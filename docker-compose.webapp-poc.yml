# Für die UGOS-Docker-App ("Projekt" -> diese Datei auswählen/einfügen).
# Baut und startet webapp-poc als eigenen Container, getrennt vom
# eBay-OAuth-Server (der läuft unabhängig weiter, Port 8080).
#
# ANTHROPIC_API_KEY wird beim Anlegen des Projekts in der Docker-App als
# Umgebungsvariable eingetragen (nicht hier im Klartext).
services:
  dcardslab-webapp-poc:
    build:
      context: .
      dockerfile: webapp-poc/Dockerfile
      # Optional - siehe README.md, "Pruefen, ob ein Update/PR wirklich im
      # laufenden Container angekommen ist". Ohne gesetztes GIT_COMMIT (z.B.
      # per "export GIT_COMMIT=$(git rev-parse --short HEAD)" vor dem Build)
      # bleibt es leer; GET /api/version zeigt dann trotzdem automatisch
      # einen Build-Zeitstempel an, der braucht kein Build-Arg.
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    container_name: dcardslab-webapp-poc
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      # eBay-Integration (Sub-Projekt 4): interne Adresse des
      # ebay-oauth-server-Containers (Port 8080) und dieselbe Umgebung wie
      # dort konfiguriert - sonst passt der Token nicht zur API-Basis-URL.
      - EBAY_OAUTH_SERVER_URL=${EBAY_OAUTH_SERVER_URL:-http://ebay-oauth-server:8080}
      - EBAY_ENVIRONMENT=${EBAY_ENVIRONMENT:-sandbox}
      # Google-Sheets-Sync (Sub-Projekt 6, optional): ohne diese drei bleibt
      # /api/backup weiterhin nutzbar, nur "Mit Google verbinden" scheitert.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      # Web-Push (optional): ohne diese drei bleibt alles andere inkl. der
      # E-Mail-Benachrichtigung nutzbar, nur "Push-Benachrichtigungen
      # aktivieren" in den Einstellungen scheitert.
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      # Login (optional): ohne APP_PASSWORD bleibt das Tool wie bisher ohne
      # Anmeldung erreichbar. SESSION_SECRET_KEY sollte gesetzt sein, sonst
      # meldet jeder Neustart alle Sitzungen automatisch ab.
      - APP_PASSWORD=${APP_PASSWORD:-}
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY:-}
    restart: unless-stopped
