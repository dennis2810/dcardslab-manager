<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>DCardLabs Web PoC</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="theme-color" content="#ffffff">
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
}
</script>
<style>
  :root {
    color-scheme: light dark;
    --warn-bg: #fff3cd; --warn-fg: #7a5c00; --surface: #f0f0f0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --warn-bg: #4a3c00; --warn-fg: #ffd866; --surface: #2a2a2a; }
  }
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  .page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  .brand-logo { height: 44px; width: auto; border-radius: 6px; }
  .page-nav { margin: 0.75rem 0 1.25rem; }
  .page-nav label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; font-weight: 600; }
  .page-nav select { padding: 0.4rem 0.6rem; font-size: 0.95rem; font-weight: normal; }
  form { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; }
  label { font-weight: 600; }
  button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; width: fit-content; }
  table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
  th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; }
  th { background: var(--surface); }
  #status { font-style: italic; color: #555; }
  .error { color: #b00020; font-weight: 600; }
  .side { display: flex; flex-direction: column; gap: 0.5rem; }
  .preview { display: none; max-width: 100%; max-height: 420px; border: 1px solid #ccc; border-radius: 6px; }
  .rotate-buttons { display: none; gap: 0.5rem; }
  .rotate-buttons button { padding: 0.3rem 0.7rem; font-size: 0.9rem; }
  tr.possible-duplicate { background: var(--warn-bg); }
  .duplicate-note { font-size: 0.85rem; color: var(--warn-fg); }
</style>
</head>
<body>
  <div class="page-header">
    <h1>DCardLabs Web PoC – Scan &rarr; Zuschnitt &rarr; KI-Erkennung</h1>
    <img class="brand-logo" src="assets/dcardslab-logo.png" alt="DCardsLab">
  </div>
  <p>Lädt Vorder- und Rückseiten-Scanbogen hoch, schneidet die 9 Karten zu und lässt sie per Claude
  Vision erkennen. Kein Speichern, kein eBay, keine Datenbank – nur der Kern-Workflow.</p>
  <nav class="page-nav">
    <label>Seite
      <select id="page-nav-select">
        <option value="" disabled selected>Seite wählen…</option>
        <option value="dashboard.html">Dashboard</option>
        <option value="index.html">Scan</option>
        <option value="cards.html">Karten</option>
        <option value="purchases.html">Käufe</option>
        <option value="ebay.html">eBay</option>
        <option value="inventory.html">Inventar</option>
        <option value="statistics.html">Statistiken</option>
        <option value="settings.html">Einstellungen</option>
      </select>
    </label>
  </nav>

  <p>
    <a href="card-new.html"><button type="button">+ Neue Karte anlegen</button></a>
    <button type="button" id="open-scan-tool">📷 Scan-Tool öffnen</button>
  </p>

  <form id="scan-form">
    <div class="side">
      <label for="front">Vorderseite (9-up Scan)</label>
      <input type="file" id="front" name="front" accept="image/*" required>
      <img id="front-preview" class="preview" alt="Vorschau Vorderseite">
      <div id="front-rotate" class="rotate-buttons">
        <button type="button" data-side="front" data-dir="left">&#8634; Links drehen</button>
        <button type="button" data-side="front" data-dir="right">&#8635; Rechts drehen</button>
      </div>
    </div>
    <div class="side">
      <label for="back">Rückseite (9-up Scan)</label>
      <input type="file" id="back" name="back" accept="image/*" required>
      <img id="back-preview" class="preview" alt="Vorschau Rückseite">
      <div id="back-rotate" class="rotate-buttons">
        <button type="button" data-side="back" data-dir="left">&#8634; Links drehen</button>
        <button type="button" data-side="back" data-dir="right">&#8635; Rechts drehen</button>
      </div>
    </div>
    <label for="location">Lagerort (für alle Karten dieses Scans)</label>
    <input type="text" id="location" name="location">
    <label for="notes">Notiz (optional, für alle Karten dieses Scans)</label>
    <input type="text" id="notes" name="notes">
    <button type="submit">Scannen &amp; erkennen</button>
  </form>

  <p id="status"></p>
  <div id="result"></div>

<script>
// Einheitliches Seiten-Auswahlfeld statt einzelner Links - erlaubt Navigation
// von jeder Seite zu jeder anderen, ohne dass jede Seite die vollstaendige
// Liste an Links vorhalten muss; identisches Snippet auf allen Seiten dupliziert.
(function initPageNav() {
  const nav = document.getElementById("page-nav-select");
  if (!nav) return;
  const current = location.pathname.split("/").pop() || "index.html";
  for (const opt of nav.options) {
    if (opt.value === current) opt.selected = true;
  }
  nav.addEventListener("change", () => {
    if (nav.value) location.href = nav.value;
  });
})();

document.getElementById("open-scan-tool").addEventListener("click", () => {
  window.open("http://192.168.2.94:8088/#/scan", "_blank");
});

const form = document.getElementById("scan-form");
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");

const COLUMNS = [
  ["number", "#"], ["status", "Status"], ["confidence", "Konf."],
  ["title", "Titel"], ["category", "Kategorie"], ["theme", "Thema"],
  ["team", "Team"], ["manufacturer", "Hersteller"], ["set_name", "Set"],
  ["season_year", "Saison"], ["card_number", "Kartennr."], ["card_type", "Typ"],
];

// Holds the blob actually submitted for each side - starts as the file the
// user picked, gets replaced by a rotated re-encoding each time they click
// a rotate button, so the preview and the upload always match.
const sideBlobs = { front: null, back: null };

function updatePreview(side) {
  const img = document.getElementById(`${side}-preview`);
  const rotateButtons = document.getElementById(`${side}-rotate`);
  const blob = sideBlobs[side];
  if (!blob) {
    img.style.display = "none";
    rotateButtons.style.display = "none";
    return;
  }
  if (img.dataset.objectUrl) URL.revokeObjectURL(img.dataset.objectUrl);
  const url = URL.createObjectURL(blob);
  img.dataset.objectUrl = url;
  img.src = url;
  img.style.display = "block";
  rotateButtons.style.display = "flex";
}

function rotateBlob(blob, direction) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const objectUrl = URL.createObjectURL(blob);
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = img.height;
      canvas.height = img.width;
      const ctx = canvas.getContext("2d");
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate((direction === "right" ? 90 : -90) * Math.PI / 180);
      ctx.drawImage(img, -img.width / 2, -img.height / 2);
      URL.revokeObjectURL(objectUrl);
      canvas.toBlob((rotated) => {
        if (rotated) resolve(rotated);
        else reject(new Error("Drehen fehlgeschlagen."));
      }, "image/jpeg", 0.92);
    };
    img.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      reject(new Error("Bild konnte nicht geladen werden."));
    };
    img.src = objectUrl;
  });
}

for (const side of ["front", "back"]) {
  document.getElementById(side).addEventListener("change", (ev) => {
    sideBlobs[side] = ev.target.files[0] || null;
    updatePreview(side);
  });
}

document.querySelectorAll(".rotate-buttons button").forEach((button) => {
  button.addEventListener("click", async () => {
    const { side, dir } = button.dataset;
    if (!sideBlobs[side]) return;
    try {
      sideBlobs[side] = await rotateBlob(sideBlobs[side], dir);
      updatePreview(side);
    } catch (err) {
      statusEl.textContent = "Fehler beim Drehen: " + err;
      statusEl.className = "error";
    }
  });
});

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  resultEl.innerHTML = "";
  statusEl.textContent = "Läuft … (kann bei 9 Karten parallel eine Weile dauern)";
  statusEl.className = "";

  const data = new FormData();
  data.append("front", sideBlobs.front, "front.jpg");
  data.append("back", sideBlobs.back, "back.jpg");
  data.append("location", document.getElementById("location").value);
  data.append("notes", document.getElementById("notes").value);

  try {
    const res = await fetch("/api/scan", { method: "POST", body: data });
    const body = await res.json();
    if (!res.ok) {
      statusEl.textContent = "Fehler: " + (body.detail || res.statusText);
      statusEl.className = "error";
      return;
    }
    statusEl.textContent = `Fertig – ${body.cards.length} Karten.`;
    renderTable(body.cards);
  } catch (err) {
    statusEl.textContent = "Fehler: " + err;
    statusEl.className = "error";
  }
});

function renderTable(cards) {
  const table = document.createElement("table");
  const thead = document.createElement("tr");
  for (const [, label] of COLUMNS) {
    const th = document.createElement("th");
    th.textContent = label;
    thead.appendChild(th);
  }
  const duplicateTh = document.createElement("th");
  duplicateTh.textContent = "Duplikat?";
  thead.appendChild(duplicateTh);
  table.appendChild(thead);

  for (const card of cards) {
    const tr = document.createElement("tr");
    for (const [key] of COLUMNS) {
      const td = document.createElement("td");
      td.textContent = card[key] ?? "";
      tr.appendChild(td);
    }
    const duplicateTd = document.createElement("td");
    if (card.possible_duplicate) {
      tr.classList.add("possible-duplicate");
      const link = document.createElement("a");
      link.href = `card.html?id=${encodeURIComponent(card.possible_duplicate.id)}`;
      link.target = "_blank";
      link.rel = "noopener";
      link.className = "duplicate-note";
      link.textContent = `⚠ evtl. bereits vorhanden (Karte #${card.possible_duplicate.card_no ?? "?"})`;
      duplicateTd.appendChild(link);
      duplicateTd.appendChild(document.createElement("br"));
      if (card.id) {
        const mergeBtn = document.createElement("button");
        mergeBtn.type = "button";
        mergeBtn.textContent = "Zusammenführen";
        mergeBtn.addEventListener("click", () => mergeDuplicate(card.id, card.possible_duplicate.id, mergeBtn, tr));
        duplicateTd.appendChild(mergeBtn);
      }
    }
    tr.appendChild(duplicateTd);
    table.appendChild(tr);
  }
  resultEl.appendChild(table);
}

async function mergeDuplicate(cardId, targetId, button, row) {
  button.disabled = true;
  button.textContent = "Führe zusammen …";
  try {
    const res = await fetch(`/api/cards/${encodeURIComponent(cardId)}/merge-into/${encodeURIComponent(targetId)}`, {
      method: "POST",
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      button.disabled = false;
      button.textContent = "Fehler – erneut versuchen";
      button.title = body.detail || res.statusText;
      return;
    }
    row.style.opacity = "0.5";
    row.querySelectorAll("td, a, button").forEach((el) => {
      if (el.tagName === "BUTTON") el.remove();
    });
    const note = document.createElement("span");
    note.className = "duplicate-note";
    note.textContent = "✓ zusammengeführt, Menge auf Original übertragen";
    row.lastElementChild.appendChild(note);
  } catch (err) {
    button.disabled = false;
    button.textContent = "Fehler – erneut versuchen";
    button.title = String(err);
  }
}
</script>
</body>
</html>
