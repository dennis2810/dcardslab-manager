<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>DCardLabs – Inventar</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  .page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  .brand-logo { height: 44px; width: auto; border-radius: 6px; }
  .page-nav { margin: 0.75rem 0 1.25rem; }
  .page-nav label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; font-weight: 600; }
  .page-nav select { padding: 0.4rem 0.6rem; font-size: 0.95rem; font-weight: normal; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; }
  th { cursor: pointer; user-select: none; white-space: nowrap; }
  th .sort-arrow { color: #888; font-size: 0.8em; }
  tr.row { cursor: pointer; }
  tr.row:hover { background: #f7f7f7; }
  img.thumb { width: 32px; height: 32px; object-fit: cover; border-radius: 3px; background: #f0f0f0; vertical-align: middle; margin-right: 0.5rem; }
  #status-msg { font-style: italic; color: #555; }
  .sums-block { font-weight: 700; font-size: 1.05rem; background: #f0f4f8; border: 1px solid #d5dee6; border-radius: 6px; padding: 0.6rem 0.9rem; margin: 0.75rem 0; }
  .pagination { display: flex; gap: 0.75rem; align-items: center; margin-top: 0.75rem; }
  .controls { display: flex; gap: 1rem; align-items: center; margin: 0.5rem 0; flex-wrap: wrap; }
  .status-badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
  .status-sold { background: #dce8fb; color: #0b3d91; }
  .status-in-stock { background: #e6f4ea; color: #1e4620; }
  .status-out { background: #eee; color: #555; }
  @media print {
    .no-print { display: none !important; }
  }
  #add-item-form { display: none; grid-template-columns: 1fr 1fr; gap: 0.75rem; border: 1px solid #ccc; border-radius: 6px; padding: 1rem; margin: 0.75rem 0; }
  #add-item-form label { display: flex; flex-direction: column; font-size: 0.85rem; font-weight: 600; }
  #add-item-form input, #add-item-form select { font-weight: normal; margin-top: 0.2rem; padding: 0.4rem; }
  #add-item-form .actions { grid-column: 1 / -1; display: flex; gap: 0.75rem; align-items: center; }
  #add-item-form .full-row { grid-column: 1 / -1; }
  .error { color: #b00020; font-weight: 600; }
  .warning-box { font-weight: 600; padding: 0.5rem 0.75rem; border-radius: 4px; margin: 0.5rem 0; background: #fff3cd; color: #7a5c00; }
  h2 { font-size: 1.05rem; margin-top: 1.5rem; }
</style>
</head>
<body>
  <div class="page-header">
    <h1>DCardLabs – Inventar</h1>
    <img class="brand-logo" src="assets/dcardslab-logo.png" alt="DCardsLab">
  </div>
  <nav class="page-nav no-print">
    <label>Seite
      <select id="page-nav-select">
        <option value="" disabled selected>Seite wählen…</option>
        <option value="dashboard.html">Dashboard</option>
        <option value="index.html">Scan</option>
        <option value="cards.html">Karten</option>
        <option value="purchases.html">Käufe</option>
        <option value="ebay.html">eBay</option>
        <option value="inventory.html">Inventar</option>
        <option value="statistics.html">Statistiken</option>
        <option value="settings.html">Einstellungen</option>
      </select>
    </label>
  </nav>

  <p id="status-msg"></p>
  <p id="total-value" class="sums-block"></p>
  <div id="inventory-warnings"></div>
  <div class="controls no-print">
    <input type="text" id="q" placeholder="Suche (Titel, SKU, Lagerort)">
    <label>Status
      <select id="status-filter">
        <option value="">Alle</option>
        <option value="Auf Lager">Auf Lager</option>
        <option value="Verkauft">Verkauft</option>
        <option value="Nicht vorrätig">Nicht vorrätig</option>
      </select>
    </label>
    <button type="button" id="toggle-add-item">+ Eintrag hinzufügen</button>
  </div>

  <h2>Lagerort-Übersicht</h2>
  <table id="location-overview-table" style="display: none;">
    <thead><tr><th>Lagerort</th><th>Karten (vorrätig)</th><th>Wert</th></tr></thead>
    <tbody id="location-overview-body"></tbody>
  </table>
  <p id="location-overview-empty"></p>

  <form id="add-item-form">
    <div class="full-row">
      <input type="text" id="card-search" placeholder="Karte suchen (Titel, Team, Set, Kartennr.)">
      <select id="card-results"></select>
    </div>
    <label>Menge <input type="number" name="quantity" value="1" min="0" step="1"></label>
    <label>Zustand <input type="text" name="condition"></label>
    <label>Lagerort <input type="text" name="location"></label>
    <label>Notizen <input type="text" name="notes"></label>
    <div class="actions">
      <button type="submit">Speichern</button>
      <button type="button" id="add-item-cancel">Abbrechen</button>
      <span id="add-item-status"></span>
    </div>
  </form>

  <h2>Alle Einträge</h2>
  <table id="inventory-table" style="display: none;">
    <thead>
      <tr>
        <th data-key="sku">SKU <span class="sort-arrow"></span></th>
        <th data-key="card_title">Karte <span class="sort-arrow"></span></th>
        <th data-key="quantity">Menge <span class="sort-arrow"></span></th>
        <th data-key="condition">Zustand <span class="sort-arrow"></span></th>
        <th data-key="location">Lagerort <span class="sort-arrow"></span></th>
        <th data-key="notes">Notizen <span class="sort-arrow"></span></th>
        <th data-key="value">Wert <span class="sort-arrow"></span></th>
        <th data-key="ebay_status">Status <span class="sort-arrow"></span></th>
      </tr>
    </thead>
    <tbody id="inventory-body"></tbody>
  </table>
  <div class="pagination no-print">
    <button type="button" id="prev-page">&larr; Zurück</button>
    <span id="page-info"></span>
    <button type="button" id="next-page">Weiter &rarr;</button>
    <button type="button" id="print-btn">🖨 Drucken</button>
    <button type="button" id="csv-btn">⭳ CSV-Export</button>
  </div>

<script>
// Einheitliches Seiten-Auswahlfeld statt einzelner Links - erlaubt Navigation
// von jeder Seite zu jeder anderen; identisches Snippet auf allen Seiten dupliziert.
(function initPageNav() {
  const nav = document.getElementById("page-nav-select");
  if (!nav) return;
  const current = location.pathname.split("/").pop() || "index.html";
  for (const opt of nav.options) {
    if (opt.value === current) opt.selected = true;
  }
  nav.addEventListener("change", () => {
    if (nav.value) location.href = nav.value;
  });
})();

const PAGE_SIZE = 40;
let currentPage = 0;
const statusMsg = document.getElementById("status-msg");
const totalValueEl = document.getElementById("total-value");
const table = document.getElementById("inventory-table");
const body = document.getElementById("inventory-body");

let items = [];
// SKU-ascending by default - the seller's most-used reference number.
let sortKey = "sku";
let sortAsc = true;

const qInput = document.getElementById("q");

// de-DE liefert Tausenderpunkt + Dezimalkomma (z.B. "1.709,10"), was fuer
// groessere Betraege deutlich lesbarer ist als toFixed().
function fmtEuro(value) {
  return value != null && value !== ""
    ? `${Number(value).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €`
    : "";
}

async function loadInventory() {
  statusMsg.textContent = "Lädt …";
  table.style.display = "none";
  try {
    const res = await fetch("/api/inventory");
    const data = await res.json();
    if (!res.ok) {
      statusMsg.textContent = "Fehler: " + (data.detail || res.statusText);
      return;
    }
    items = data.inventory.map((item) => ({ ...item, card_title: item.card?.title || "" }));
    statusMsg.textContent = `${items.length} Eintrag/Einträge`;
    totalValueEl.textContent = `Gesamtwert: ${fmtEuro(data.total_value ?? 0)}`;
    renderWarnings();
    renderLocationOverview();
    render();
  } catch (err) {
    statusMsg.textContent = "Fehler: " + err;
  }
}

function statusInfo(item) {
  if (item.ebay_status === "Verkauft") return ["Verkauft", "status-sold"];
  if ((item.quantity ?? 0) > 0) return ["Auf Lager", "status-in-stock"];
  return ["Nicht vorrätig", "status-out"];
}

// Zwei Faelle, die auf ein Problem hindeuten, statt nur einen normalen
// Zustand zu beschreiben: eine vorrätige Karte ohne erfassten Lagerort
// (nicht auffindbar) bzw. eine Karte mit Menge 0, die aber nicht ueber
// einen eBay-Verkauf als "Verkauft" erfasst wurde (z.B. verloren,
// beschaedigt oder ausserhalb von eBay verkauft, ohne das hier
// nachzutragen).
function renderWarnings() {
  const container = document.getElementById("inventory-warnings");
  container.innerHTML = "";
  const noLocation = items.filter((item) => (item.quantity ?? 0) > 0 && !(item.location || "").trim());
  const unexplainedZero = items.filter((item) => (item.quantity ?? 0) === 0 && item.ebay_status !== "Verkauft");

  const warnings = [];
  if (noLocation.length) {
    warnings.push(`📦 ${noLocation.length} vorrätige Karte(n) ohne Lagerort.`);
  }
  if (unexplainedZero.length) {
    warnings.push(`❓ ${unexplainedZero.length} Karte(n) mit Menge 0, aber nicht als verkauft markiert.`);
  }
  for (const text of warnings) {
    const p = document.createElement("p");
    p.className = "warning-box";
    p.textContent = text;
    container.appendChild(p);
  }
}

// Gruppiert nur vorrätige Eintraege (Menge > 0) nach Lagerort - "Verkauft"/
// "Nicht vorrätig" tragen nichts zum aktuellen physischen Bestand pro Ort
// bei. Ein leerer Lagerort landet in einer eigenen "(kein Lagerort)"-
// Gruppe, damit er hier genauso auffaellt wie in den Warnungen oben.
function renderLocationOverview() {
  const table = document.getElementById("location-overview-table");
  const body = document.getElementById("location-overview-body");
  const empty = document.getElementById("location-overview-empty");
  body.innerHTML = "";

  const inStock = items.filter((item) => (item.quantity ?? 0) > 0);
  if (!inStock.length) {
    table.style.display = "none";
    empty.textContent = "Keine vorrätigen Karten.";
    return;
  }

  const groups = new Map();
  for (const item of inStock) {
    const location = (item.location || "").trim() || "(kein Lagerort)";
    const group = groups.get(location) || { count: 0, value: 0 };
    group.count += 1;
    group.value += Number(item.value || 0);
    groups.set(location, group);
  }

  const sorted = [...groups.entries()].sort((a, b) => b[1].count - a[1].count);
  table.style.display = "table";
  empty.textContent = "";
  for (const [location, group] of sorted) {
    const tr = document.createElement("tr");
    for (const text of [location, String(group.count), fmtEuro(group.value)]) {
      const td = document.createElement("td");
      td.textContent = text;
      tr.appendChild(td);
    }
    body.appendChild(tr);
  }
}

function filteredItems() {
  const status = document.getElementById("status-filter").value;
  const q = qInput.value.trim().toLowerCase();
  return items.filter((item) => {
    if (status && statusInfo(item)[0] !== status) return false;
    if (q) {
      const haystack = `${item.card_title || ""} ${item.sku || ""} ${item.location || ""}`.toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });
}

function sortedFilteredItems() {
  return [...filteredItems()].sort((a, b) => {
    const av = a[sortKey] ?? "";
    const bv = b[sortKey] ?? "";
    if (typeof av === "number" && typeof bv === "number") return sortAsc ? av - bv : bv - av;
    return sortAsc
      ? String(av).localeCompare(String(bv), "de")
      : String(bv).localeCompare(String(av), "de");
  });
}

function render() {
  const sorted = sortedFilteredItems();

  for (const th of document.querySelectorAll("th[data-key]")) {
    const arrow = th.querySelector(".sort-arrow");
    arrow.textContent = th.dataset.key === sortKey ? (sortAsc ? "▲" : "▼") : "";
  }

  const pageCount = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE));
  currentPage = Math.min(currentPage, pageCount - 1);
  const pageItems = sorted.slice(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE);
  document.getElementById("page-info").textContent = `Seite ${currentPage + 1} von ${pageCount} (${sorted.length} Einträge, max. ${PAGE_SIZE}/Seite)`;
  document.getElementById("prev-page").disabled = currentPage === 0;
  document.getElementById("next-page").disabled = currentPage >= pageCount - 1;

  body.innerHTML = "";
  table.style.display = sorted.length ? "table" : "none";
  for (const item of pageItems) {
    const tr = document.createElement("tr");
    tr.className = "row";
    tr.addEventListener("click", () => {
      location.href = `card.html?id=${encodeURIComponent(item.card_id)}`;
    });

    const skuTd = document.createElement("td");
    skuTd.textContent = item.sku || "";
    tr.appendChild(skuTd);

    const cardTd = document.createElement("td");
    if (item.card?.front_image_url) {
      const img = document.createElement("img");
      img.className = "thumb";
      img.src = item.card.front_image_url;
      img.alt = "";
      cardTd.appendChild(img);
    }
    cardTd.append(item.card_title || "(ohne Titel)");
    tr.appendChild(cardTd);

    for (const key of ["quantity", "condition", "location", "notes"]) {
      const td = document.createElement("td");
      td.textContent = item[key] ?? "";
      tr.appendChild(td);
    }

    const valueTd = document.createElement("td");
    valueTd.textContent = fmtEuro(item.value);
    tr.appendChild(valueTd);

    const [statusLabel, statusClass] = statusInfo(item);
    const statusTd = document.createElement("td");
    const badge = document.createElement("span");
    badge.className = "status-badge " + statusClass;
    badge.textContent = statusLabel;
    statusTd.appendChild(badge);
    tr.appendChild(statusTd);

    body.appendChild(tr);
  }
}

for (const th of document.querySelectorAll("th[data-key]")) {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if (sortKey === key) {
      sortAsc = !sortAsc;
    } else {
      sortKey = key;
      sortAsc = true;
    }
    currentPage = 0;
    render();
  });
}

document.getElementById("prev-page").addEventListener("click", () => {
  currentPage = Math.max(0, currentPage - 1);
  render();
});
document.getElementById("next-page").addEventListener("click", () => {
  currentPage += 1;
  render();
});
document.getElementById("print-btn").addEventListener("click", () => window.print());
document.getElementById("status-filter").addEventListener("change", () => {
  currentPage = 0;
  render();
});
qInput.addEventListener("input", () => {
  clearTimeout(qInput._debounce);
  qInput._debounce = setTimeout(() => { currentPage = 0; render(); }, 200);
});

// Semikolon als Trennzeichen (deutsches Excel erwartet das per Default bei
// Komma-Dezimalzahlen) + UTF-8-BOM, damit Umlaute nicht als Mojibake landen.
function downloadCsv(filename, headers, rows) {
  const escape = (v) => {
    const s = v == null ? "" : String(v);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [headers, ...rows].map((row) => row.map(escape).join(";"));
  const csv = "\uFEFF" + lines.join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

document.getElementById("csv-btn").addEventListener("click", () => {
  const headers = ["SKU", "Karte", "Menge", "Zustand", "Lagerort", "Notizen", "Wert", "Status"];
  const rows = sortedFilteredItems().map((item) => [
    item.sku || "", item.card_title || "", item.quantity ?? "", item.condition || "",
    item.location || "", item.notes || "", item.value != null ? item.value.toFixed(2) : "",
    statusInfo(item)[0],
  ]);
  downloadCsv("inventar.csv", headers, rows);
});

const addItemForm = document.getElementById("add-item-form");
const toggleAddItemBtn = document.getElementById("toggle-add-item");
const cardSearch = document.getElementById("card-search");
const cardResults = document.getElementById("card-results");

toggleAddItemBtn.addEventListener("click", () => {
  addItemForm.style.display = addItemForm.style.display === "grid" ? "none" : "grid";
});

document.getElementById("add-item-cancel").addEventListener("click", () => {
  addItemForm.reset();
  addItemForm.style.display = "none";
  document.getElementById("add-item-status").textContent = "";
});

// Gleiches Debounced-Suche-dann-Auswahl-Muster wie purchase.html's
// Karten-Verknuepfung: Freitextsuche gegen GET /api/cards, Ergebnisse in
// einem <select>, aus dem die Karte fuer den neuen Inventareintrag gewaehlt wird.
async function searchCards() {
  const q = cardSearch.value.trim();
  cardResults.innerHTML = "";
  try {
    const url = q ? `/api/cards?q=${encodeURIComponent(q)}` : "/api/cards";
    const res = await fetch(url);
    const body = await res.json();
    for (const c of (body.cards || []).slice(0, 20)) {
      const option = document.createElement("option");
      option.value = c.id;
      option.textContent = c.title || "(ohne Titel)";
      cardResults.appendChild(option);
    }
  } catch (err) {
    // Suche schlaegt fehl -> Dropdown bleibt leer, kein Blocker fuer den Rest der Seite.
  }
}

cardSearch.addEventListener("input", () => {
  clearTimeout(cardSearch._debounce);
  cardSearch._debounce = setTimeout(searchCards, 300);
});

addItemForm.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const statusEl = document.getElementById("add-item-status");
  const cardId = cardResults.value;
  if (!cardId) {
    statusEl.textContent = "Bitte erst eine Karte suchen und auswählen.";
    statusEl.className = "error";
    return;
  }
  const fields = Object.fromEntries(new FormData(addItemForm).entries());
  statusEl.textContent = "Speichert …";
  statusEl.className = "";
  try {
    const res = await fetch(`/api/cards/${encodeURIComponent(cardId)}/inventory`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(fields),
    });
    const body = await res.json();
    if (!res.ok) {
      statusEl.textContent = "Fehler: " + (body.detail || res.statusText);
      statusEl.className = "error";
      return;
    }
    addItemForm.reset();
    cardResults.innerHTML = "";
    addItemForm.style.display = "none";
    statusEl.textContent = "";
    loadInventory();
  } catch (err) {
    statusEl.textContent = "Fehler: " + err;
    statusEl.className = "error";
  }
});

searchCards();
loadInventory();
</script>
</body>
</html>
