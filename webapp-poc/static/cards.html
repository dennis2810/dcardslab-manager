<script>
// Vor dem ersten Rendern angewendet (blockierendes Script vor <style>), damit
// eine gespeicherte manuelle Hell/Dunkel-Wahl (siehe Dashboard-Schalter) nicht
// erst kurz im System-Standard aufblitzt, bevor sie greift.
try {
  var _theme = localStorage.getItem("theme");
  if (_theme === "light" || _theme === "dark") document.documentElement.setAttribute("data-theme", _theme);
} catch (err) {}
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
}
</script>
<style>
  :root {

<script>
// Einheitliches Seiten-Auswahlfeld statt einzelner Links - erlaubt Navigation
// von jeder Seite zu jeder anderen; identisches Snippet auf allen Seiten dupliziert.
(function initPageNav() {
  const nav = document.getElementById("page-nav-select");
  if (!nav) return;
  const current = location.pathname.split("/").pop() || "index.html";
  for (const opt of nav.options) {
    if (opt.value === current) opt.selected = true;
  }
  nav.addEventListener("change", () => {
    if (nav.value) location.href = nav.value;
  });
})();

// Kurze, auffaellige Einblendung fuer das Ergebnis einer Aktion (Speichern/
// Loeschen/Bulk) - anders als ein reiner Status-Text neben dem jeweiligen
// Button bleibt sie sichtbar, auch wenn man inzwischen weitergescrollt hat.
function showToast(message, isError) {
  let container = document.getElementById("toast-container");
  if (!container) {
    container = document.createElement("div");
    container.id = "toast-container";
    document.body.appendChild(container);
  }
  const toast = document.createElement("div");
  toast.className = "toast" + (isError ? " toast-error" : "");
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 4000);
}

// Macht eine Tabellenzeile per Tastatur bedienbar - Tab fokussiert sie
// (tabIndex=0), Pfeil hoch/runter wandert zur Nachbarzeile, Enter loest
// dieselbe Aktion wie ein Klick aus (row.click()). Ergaenzt die bereits
// bestehende Maus-Bedienung, ersetzt sie nicht.
function makeRowKeyboardNavigable(row) {
  row.tabIndex = 0;
  row.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") {
      ev.preventDefault();
      row.click();
    } else if (ev.key === "ArrowDown") {
      const next = row.nextElementSibling;
      if (next) {
        ev.preventDefault();
        next.focus();
      }
    } else if (ev.key === "ArrowUp") {
      const prev = row.previousElementSibling;
      if (prev) {
        ev.preventDefault();
        prev.focus();
      }
    }
  });
}

const PAGE_SIZE = 40;
let currentPage = 0;

const qInput = document.getElementById("q");

// "/" fokussiert das Suchfeld, ausser man tippt bereits in einem Eingabefeld
// (sonst wuerde z.B. "/" in einem Notiz-Feld die Eingabe abbrechen).
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "/" || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const tag = document.activeElement?.tagName;
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
  ev.preventDefault();
  qInput.focus();
  qInput.select();
});
const statusSelect = document.getElementById("status");
const ebayFilterSelect = document.getElementById("ebay-filter");
const shippingFilterSelect = document.getElementById("shipping-filter");
const tagFilterSelect = document.getElementById("tag-filter");
const cardTypeFilterSelect = document.getElementById("card-type-filter");
const statusMsg = document.getElementById("status-msg");
const grid = document.getElementById("grid");
const list = document.getElementById("list");
const listBody = document.getElementById("list-body");
const viewToggle = document.getElementById("view-toggle");
const selectAllCheckbox = document.getElementById("select-all-checkbox");
const bulkActionsBar = document.getElementById("bulk-actions");
const bulkCountEl = document.getElementById("bulk-count");
const bulkStatusEl = document.getElementById("bulk-status");
const undoBar = document.getElementById("undo-bar");
const undoBtn = document.getElementById("bulk-undo");
const undoStatusEl = document.getElementById("undo-status");

// Massenaktionen (Karten-ID -> ausgewaehlt) - nur in der Listenansicht
// nutzbar; wird bei jedem Neuladen/Filterwechsel zurueckgesetzt, damit nie
// eine nicht mehr sichtbare Karte "unsichtbar ausgewaehlt" bleibt.
let selectedIds = new Set();

function updateBulkBar() {
  bulkActionsBar.hidden = selectedIds.size === 0;
  bulkCountEl.textContent = `${selectedIds.size} Karte(n) ausgewählt`;
}

// Same labels as card.html's eBay section, so a status reads identically
// everywhere in the app.
const EBAY_STATUS_LABELS = {
  Entwurf: "Entwurf", Geplant: "Geplant", Veroeffentlicht: "Veröffentlicht",
  Verkauft: "Verkauft", Fehler: "Fehler", Beendet: "Beendet",
};

function statusClass(status) {
  if (status === "prüfen") return "status-pruefen";
  if (status === "nicht erkannt") return "status-nicht_erkannt";
  return "";
}

function ebayBadge(ebayStatus) {
  if (!ebayStatus) return null;
  const badge = document.createElement("span");
  badge.className = "ebay-badge ebay-badge-" + ebayStatus;
  badge.textContent = "eBay: " + (EBAY_STATUS_LABELS[ebayStatus] || ebayStatus);
  return badge;
}

function manualSaleBadge(channel) {

  const badge = document.createElement("span");
  badge.className = "manual-sale-badge";
  badge.textContent = "Verkauft: " + channel;

}

function shippedBadge(shipped) {

  badge.textContent = "Abgeholt";

}

function deliveredBadge(delivered) {

  badge.textContent = "Zugestellt";
  return badge;

function refundedBadge(refunded) {

  badge.textContent = "Retoure";

}

function privateCollectionBadge(privateCollection) {

  badge.title = "Importiertes eBay-Angebot - wird nicht vom Tool verwaltet.";
  return badge;
}

let currentView = "grid";
try {
  currentView = localStorage.getItem("cardsView") || "grid";
} catch (err) {
  // localStorage can throw in locked-down browser contexts - grid view
  // just stays the default then.
}

function applyView() {
  grid.hidden = currentView !== "grid";
  list.hidden = currentView !== "list";
  viewToggle.textContent = currentView === "grid" ? "Listenansicht" : "Kachelansicht";
}
applyView();

viewToggle.addEventListener("click", () => {
  currentView = currentView === "grid" ? "list" : "grid";
  applyView();
  try {
    localStorage.setItem("cardsView", currentView);
  } catch (err) {
    // Non-fatal - the choice just won't be remembered for next time.
  }
});

async function loadCards() {
  const params = new URLSearchParams();
  if (qInput.value.trim()) params.set("q", qInput.value.trim());
  if (statusSelect.value) params.set("status", statusSelect.value);

  statusMsg.textContent = "Lädt …";
  try {
    const res = await fetch("/api/cards?" + params.toString());
    const body = await res.json();
    if (!res.ok) {
      statusMsg.textContent = "Fehler: " + (body.detail || res.statusText);
      return;
    }
    currentCards = body.cards;
    currentPage = 0;
    selectedIds.clear();
    updateBulkBar();
    populateTagFilter();
    renderCurrentView();
  } catch (err) {
    statusMsg.textContent = "Fehler: " + err;
  }
}

let currentCards = [];
// Zuletzt gerenderte Seite (fuer Massenaktionen "Alle auswaehlen" - bezieht
// sich bewusst nur auf die aktuell sichtbare Seite, nicht alle gefilterten
// Karten ueber alle Seiten hinweg).
let currentPageItems = [];
// SKU-ascending by default - the seller's most-used reference number.
let sortKey = "ebay_sku";
let sortAsc = true;

function sortedCards() {
  if (!sortKey) return currentCards;
  return [...currentCards].sort((a, b) => {
    const av = a[sortKey] ?? "";
    const bv = b[sortKey] ?? "";
    return sortAsc
      ? String(av).localeCompare(String(bv), "de")
      : String(bv).localeCompare(String(av), "de");
  });
}

function cardTags(card) {
  return (card.tags || "").split(",").map((t) => t.trim()).filter(Boolean);
}

// Nicht exklusiv (z.B. "versendet" UND spaeter "zugestellt" koennen beide
// zutreffen) - der Filter zeigt daher Karten, auf die das gewaehlte Merkmal
// zutrifft, nicht einen einzelnen "Status" pro Karte.
function matchesShippingFilter(card, value) {
  switch (value) {
    case "shipped": return Boolean(card.shipped);
    case "picked_up": return Boolean(card.picked_up);
    case "delivered": return Boolean(card.delivered);
    case "refunded": return Boolean(card.refunded);
    case "not_shipped": return !card.shipped && !card.picked_up && !card.delivered;
    default: return true;
  }
}

function visibleCards() {
  let filtered = sortedCards();
  if (ebayFilterSelect.value) {
    filtered = filtered.filter((c) => (c.ebay_status || "") === ebayFilterSelect.value);
  }
  if (shippingFilterSelect.value) {
    filtered = filtered.filter((c) => matchesShippingFilter(c, shippingFilterSelect.value));
  }
  if (tagFilterSelect.value) {
    filtered = filtered.filter((c) => cardTags(c).includes(tagFilterSelect.value));
  }
  if (cardTypeFilterSelect.value) {
    filtered = filtered.filter((c) => c.card_type === cardTypeFilterSelect.value);
  }
  return filtered;
}

// Optionen kommen aus den aktuell geladenen Karten (nicht vom Server) - bei
// wenigen hundert Karten reicht das, spart einen eigenen Endpunkt. Die
// bisherige Auswahl bleibt erhalten, wenn der Tag nach dem Neuladen noch
// vorkommt.
function populateTagFilter() {
  const previous = tagFilterSelect.value;
  const tags = new Set();
  for (const card of currentCards) {
    for (const tag of cardTags(card)) tags.add(tag);
  }
  const sorted = [...tags].sort((a, b) => a.localeCompare(b, "de"));
  tagFilterSelect.innerHTML = '<option value="">Alle Tags</option>' +
    sorted.map((t) => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join("");
  if (sorted.includes(previous)) tagFilterSelect.value = previous;
}

function renderCurrentView() {
  const filtered = visibleCards();
  if (filtered.length === 0) {
    statusMsg.textContent = currentCards.length === 0
      ? "Noch keine Karten – jetzt scannen oder manuell anlegen."
      : "Keine Karten gefunden – Suche/Filter anpassen.";
  } else {
    statusMsg.textContent = `${filtered.length} Karte(n)`;
  }
  // card.html reads this to render "vorherige/nächste" navigation within
  // the current search/filter order (across all pages, not just the
  // current one), without a dedicated backend endpoint.
  try {
    sessionStorage.setItem("cardListIds", JSON.stringify(filtered.map((c) => c.id)));
  } catch (err) {
    // sessionStorage can throw in locked-down browser contexts (private
    // mode quirks, storage disabled) - prev/next navigation just won't be
    // available then, the list itself still renders fine.
  }

  const pageCount = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  currentPage = Math.min(currentPage, pageCount - 1);
  const pageItems = filtered.slice(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE);
  currentPageItems = pageItems;
  document.getElementById("page-info").textContent = `Seite ${currentPage + 1} von ${pageCount} (${filtered.length} Karte(n), max. ${PAGE_SIZE}/Seite)`;
  document.getElementById("prev-page").disabled = currentPage === 0;
  document.getElementById("next-page").disabled = currentPage >= pageCount - 1;

  render(pageItems);
  renderList(pageItems);
}

function setSortIndicator(key) {
  for (const th of document.querySelectorAll(".list th[data-key]")) {
    const arrow = th.querySelector(".sort-arrow");
    arrow.textContent = th.dataset.key === key ? (sortAsc ? "▲" : "▼") : "";
  }
}
setSortIndicator(sortKey);

for (const th of document.querySelectorAll(".list th[data-key]")) {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if (sortKey === key) {
      sortAsc = !sortAsc;
    } else {
      sortKey = key;
      sortAsc = true;
    }
    setSortIndicator(sortKey);
    currentPage = 0;
    renderCurrentView();
  });
}

// Merkt sich die letzte Massenaktion, damit sie per "Rueckgaengig" wieder
// aufgehoben werden kann. Wird von einer neuen Massenaktion ueberschrieben -
// nur der letzte Schritt ist rueckgaengig machbar.
let lastUndo = null;

function setUndo(action, label) {
  lastUndo = action;
  undoStatusEl.textContent = label;
  undoBar.hidden = false;
}

function clearUndo() {
  lastUndo = null;
  undoBar.hidden = true;
  undoStatusEl.textContent = "";
}

async function undoLastBulkAction() {
  if (!lastUndo) return;
  const action = lastUndo;
  undoBtn.disabled = true;
  undoStatusEl.textContent = "Mache rückgängig …";
  try {
    if (action.type === "shipped") {
      await Promise.all(action.entries.map(({ id, prevShipped }) =>
        fetch(`/api/cards/${encodeURIComponent(id)}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ shipped: prevShipped }),
        })
      ));
    } else if (action.type === "ebay-drafts") {
      await Promise.all(action.ids.map((id) =>
        fetch(`/api/ebay/listings/${encodeURIComponent(id)}`, { method: "DELETE" })
      ));
    } else if (action.type === "private-collection") {
      // DELETE macht sowohl das Flag als auch die Inventar-Nullung
      // rueckgaengig (setzt die Menge auf 1 zurueck - siehe
      // db.set_card_private_collection()).
      await Promise.all(action.ids.map((id) =>
        fetch(`/api/cards/${encodeURIComponent(id)}/private-collection`, { method: "DELETE" })
      ));
    }
    clearUndo();
    loadCards();
    showToast("Aktion rückgängig gemacht.");
  } catch (err) {
    undoStatusEl.textContent = "Fehler beim Rückgängigmachen: " + err;
    showToast("Fehler beim Rückgängigmachen: " + err, true);
  } finally {
    undoBtn.disabled = false;
  }
}

undoBtn.addEventListener("click", undoLastBulkAction);

// Keine eigener Bulk-Endpoint noetig - feuert einfach ein PATCH pro
// ausgewaehlter Karte ab (gleiche Semantik wie card.html's einzelnes
// "Versendet"-Kontrollkaestchen), da die Selektion ueblicherweise klein ist.
async function bulkSetShipped(shipped) {
  bulkStatusEl.textContent = "Speichert …";
  const ids = [...selectedIds];
  const cardsById = new Map(currentCards.map((c) => [c.id, c]));
  const entries = ids.map((id) => ({ id, prevShipped: !!cardsById.get(id)?.shipped }));
  try {
    await Promise.all(ids.map((id) =>
      fetch(`/api/cards/${encodeURIComponent(id)}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ shipped }),
      })
    ));
    bulkStatusEl.textContent = "";
    selectedIds.clear();
    updateBulkBar();
    setUndo({ type: "shipped", entries }, `Versand-Markierung von ${entries.length} Karte(n) geändert.`);
    showToast(`Versand-Markierung von ${entries.length} Karte(n) geändert.`);
    loadCards();
  } catch (err) {
    bulkStatusEl.textContent = "Fehler: " + err;
    showToast("Fehler: " + err, true);
  }
}

document.getElementById("bulk-mark-shipped").addEventListener("click", () => bulkSetShipped(true));
document.getElementById("bulk-unmark-shipped").addEventListener("click", () => bulkSetShipped(false));

// Massen-Privatentnahme - ein POST pro ausgewaehlter Karte (setzt Flag +
// Inventar auf 0, siehe db.set_card_private_collection()). Karten, die
// schon in der privaten Sammlung sind, werden uebersprungen.
async function bulkSetPrivateCollection() {
  const ids = [...selectedIds].filter((id) => !currentCards.find((c) => c.id === id)?.private_collection);
  if (!ids.length) {
    showToast("Keine der ausgewählten Karten kann überführt werden (schon in der privaten Sammlung).", true);
    return;
  }
  if (!confirm(`${ids.length} Karte(n) in die private Sammlung überführen? Der Inventarbestand wird jeweils auf 0 gesetzt.`)) return;
  bulkStatusEl.textContent = "Überführt …";
  try {
    await Promise.all(ids.map((id) =>
      fetch(`/api/cards/${encodeURIComponent(id)}/private-collection`, { method: "POST" })
    ));
    bulkStatusEl.textContent = "";
    selectedIds.clear();
    updateBulkBar();
    setUndo({ type: "private-collection", ids }, `${ids.length} Karte(n) in die private Sammlung überführt.`);
    showToast(`${ids.length} Karte(n) in die private Sammlung überführt.`);
    loadCards();
  } catch (err) {
    bulkStatusEl.textContent = "Fehler: " + err;
    showToast("Fehler: " + err, true);
  }
}

// Erzeugt ein leeres eBay-Angebot ("Entwurf") pro ausgewaehlter Karte, die
// noch keins hat - main.py's POST .../ebay-listing befuellt Titel/
// Beschreibung/Aspects bereits automatisch aus den Kartendaten, wenn keine
// Felder mitgeschickt werden.
async function bulkCreateEbayDrafts() {
  const ids = [...selectedIds];
  const cardsById = new Map(currentCards.map((c) => [c.id, c]));
  const targets = ids.filter((id) => !(cardsById.get(id)?.ebay_status));
  const skipped = ids.length - targets.length;
  if (!targets.length) {
    bulkStatusEl.textContent = "Alle ausgewählten Karten haben bereits ein eBay-Angebot.";
    return;
  }
  bulkStatusEl.textContent = "Lege Entwürfe an …";
  const extraNote = document.getElementById("bulk-ebay-draft-template").value;
  try {
    const results = await Promise.all(targets.map((id) =>
      fetch(`/api/cards/${encodeURIComponent(id)}/ebay-listing`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ extra_note: extraNote }),
      })
    ));
    const okResults = results.filter((r) => r.ok);
    const failed = results.length - okResults.length;
    const created = okResults.length;
    const createdListings = await Promise.all(okResults.map((r) => r.json()));
    let message = `${created} Entwurf/Entwürfe angelegt.`;
    if (skipped) message += ` ${skipped} übersprungen (bereits vorhanden).`;
    if (failed) message += ` ${failed} fehlgeschlagen.`;
    bulkStatusEl.textContent = message;
    selectedIds.clear();
    updateBulkBar();
    if (createdListings.length) {
      setUndo(
        { type: "ebay-drafts", ids: createdListings.map((l) => l.id) },
        `${createdListings.length} eBay-Entwurf/Entwürfe angelegt.`
      );
    }
    showToast(message);
    loadCards();
  } catch (err) {
    bulkStatusEl.textContent = "Fehler: " + err;
    showToast("Fehler: " + err, true);
  }
}

document.getElementById("bulk-create-ebay-draft").addEventListener("click", bulkCreateEbayDrafts);

// Gleiches Datumsformat wie purchases.html/purchase.html (DD.MM.YYYY, per
// String-Split statt new Date(), um Zeitzonen-Verschiebungen zu vermeiden).
function formatDate(value) {
  if (!value) return "";
  const [y, m, d] = value.split("-");
  return d && m && y ? `${d}.${m}.${y}` : value;
}

const bulkAddPurchaseSelect = document.getElementById("bulk-add-purchase-select");

// Einmalig beim Laden der Seite befuellt (nicht bei jedem Oeffnen der Bulk-
// Leiste) - eine neue Auswahlmoeglichkeit fuer einen waehrenddessen
// angelegten Kauf erscheint erst nach einem Seiten-Reload, das ist fuer
// diesen Anwendungsfall (Karten kurz nach dem Kauf verknuepfen) akzeptabel.
async function loadPurchasesForBulkSelect() {
  try {
    const res = await fetch("/api/purchases");
    const data = await res.json();
    if (!res.ok) return;
    for (const p of data.purchases) {
      const option = document.createElement("option");
      option.value = p.id;
      option.textContent = [formatDate(p.purchase_date), p.platform, p.seller].filter(Boolean).join(" – ");
      bulkAddPurchaseSelect.appendChild(option);
    }
  } catch (err) {
    // Dropdown bleibt dann einfach leer - kein Blocker fuer den Rest der Seite.
  }
}
loadPurchasesForBulkSelect();

// Gleiches Einmalig-beim-Laden-Muster wie loadPurchasesForBulkSelect() oben -
// die Dropdown-Option traegt direkt den Textbaustein-Text als Wert (statt
// nur die ID), damit bulkCreateEbayDrafts() ihn ohne Nachschlagen als
// extra_note mitschicken kann.
async function loadDescriptionTemplatesForBulkSelect() {
  const select = document.getElementById("bulk-ebay-draft-template");
  try {
    const res = await fetch("/api/description-templates");
    const data = await res.json();
    if (!res.ok) return;
    for (const t of data.templates || []) {
      const option = document.createElement("option");
      option.value = t.body || "";
      option.textContent = t.name || "";
      select.appendChild(option);
    }
  } catch (err) {
    // Dropdown bleibt dann bei "keiner" - kein Blocker fuer den Rest der Seite.
  }
}

// Eine Karte kann nur einem Kauf zugeordnet sein (unique(card_id) im
// Schema) - bereits verknuepfte Karten in der Auswahl werden uebersprungen
// statt einen 409-Fehler zu produzieren.
async function bulkAddToPurchase() {
  const purchaseId = bulkAddPurchaseSelect.value;
  if (!purchaseId) {
    bulkStatusEl.textContent = "Bitte zuerst einen Kauf auswählen.";
    return;
  }
  const ids = [...selectedIds];
  const cardsById = new Map(currentCards.map((c) => [c.id, c]));
  const targets = ids.filter((id) => !cardsById.get(id)?.has_purchase);
  const skipped = ids.length - targets.length;
  if (!targets.length) {
    bulkStatusEl.textContent = "Alle ausgewählten Karten sind bereits einem Kauf zugeordnet.";
    return;
  }
  bulkStatusEl.textContent = "Verknüpft …";
  try {
    const results = await Promise.all(targets.map((id) =>
      fetch(`/api/purchases/${encodeURIComponent(purchaseId)}/items`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ card_id: id }),
      })
    ));
    const okCount = results.filter((r) => r.ok).length;
    const failed = results.length - okCount;
    let message = `${okCount} Karte(n) verknüpft.`;
    if (skipped) message += ` ${skipped} übersprungen (bereits einem Kauf zugeordnet).`;
    if (failed) message += ` ${failed} fehlgeschlagen.`;
    bulkStatusEl.textContent = message;
    selectedIds.clear();
    updateBulkBar();
    showToast(message);
    loadCards();
  } catch (err) {
    bulkStatusEl.textContent = "Fehler: " + err;
    showToast("Fehler: " + err, true);
  }
}

document.getElementById("bulk-add-to-purchase-btn").addEventListener("click", bulkAddToPurchase);

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

// Semikolon als Trennzeichen (deutsches Excel erwartet das per Default bei
// Komma-Dezimalzahlen) + UTF-8-BOM, damit Umlaute nicht als Mojibake landen.
function downloadCsv(filename, headers, rows) {
  const escape = (v) => {
    const s = v == null ? "" : String(v);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [headers, ...rows].map((row) => row.map(escape).join(";"));
  const csv = "\uFEFF" + lines.join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

    c.private_collection ? "Ja" : "Nein", c.tags || "",
  ]);
  downloadCsv("karten.csv", headers, rows);
});
