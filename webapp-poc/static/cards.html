<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>DCardLabs – Karten</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="theme-color" content="#ffffff">
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
}
</script>
<style>
  :root {
    color-scheme: light dark;
    --placeholder-bg: #f0f0f0;
    --success-bg: #d4edda; --success-fg: #155724;
    --warn-bg: #fff3cd; --warn-fg: #856404;
    --info-bg: #cce5ff; --info-fg: #004085;
    --danger-bg: #f8d7da; --danger-fg: #721c24;
    --neutral-bg: #e2e3e5; --neutral-fg: #383d41;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --placeholder-bg: #2a2a2a;
      --success-bg: #1c3324; --success-fg: #7fd99a;
      --warn-bg: #4a3c00; --warn-fg: #ffd866;
      --info-bg: #1d2c44; --info-fg: #8ab4f8;
      --danger-bg: #3a1f1d; --danger-fg: #f28b82;
      --neutral-bg: #333; --neutral-fg: #ccc;
    }
  }
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  .page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  .brand-logo { height: 44px; width: auto; border-radius: 6px; }
  .page-nav { margin: 0.75rem 0 1.25rem; }
  .page-nav label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; font-weight: 600; }
  .page-nav select { padding: 0.4rem 0.6rem; font-size: 0.95rem; font-weight: normal; }
  .controls { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  input, select { padding: 0.4rem 0.6rem; font-size: 1rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
  .card { border: 1px solid #ccc; border-radius: 6px; padding: 0.5rem; text-decoration: none; color: inherit; display: block; }
  .card img { width: 100%; height: 140px; object-fit: cover; border-radius: 4px; background: var(--placeholder-bg); }
  .card .title { font-weight: 600; margin-top: 0.4rem; }
  .card .meta { font-size: 0.8rem; color: #555; }
  .card .tags { font-style: italic; }
  .status-pruefen { color: #b06000; font-weight: 600; }
  .status-nicht_erkannt { color: #b00020; font-weight: 600; }
  #status-msg { font-style: italic; color: #555; }
  .ebay-badge { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 0.1rem 0.4rem; border-radius: 3px; margin-top: 0.2rem; }
  .ebay-badge-Veroeffentlicht { background: var(--success-bg); color: var(--success-fg); }
  .ebay-badge-Geplant { background: var(--warn-bg); color: var(--warn-fg); }
  .ebay-badge-Verkauft { background: var(--info-bg); color: var(--info-fg); }
  .ebay-badge-Fehler { background: var(--danger-bg); color: var(--danger-fg); }
  .ebay-badge-Entwurf { background: var(--neutral-bg); color: var(--neutral-fg); }
  .shipped-badge { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 0.1rem 0.4rem; border-radius: 3px; margin-top: 0.2rem; background: var(--info-bg); color: var(--info-fg); }
  .list { width: 100%; border-collapse: collapse; }
  .list th, .list td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #e0e0e0; }
  .list th[data-key] { cursor: pointer; user-select: none; white-space: nowrap; }
  .list th .sort-arrow { color: #888; font-size: 0.8em; }
  .card .sku { font-size: 0.75rem; color: #888; }
  .list img { width: 48px; height: 48px; object-fit: cover; border-radius: 4px; background: var(--placeholder-bg); }
  .list a.row-link { color: inherit; text-decoration: none; display: block; }
  [hidden] { display: none !important; }
  .pagination { display: flex; gap: 0.75rem; align-items: center; margin-top: 0.75rem; }
  @media print {
    .no-print { display: none !important; }
  }
</style>
</head>
<body>
  <div class="page-header">
    <h1>DCardLabs – Karten</h1>
    <img class="brand-logo" src="assets/dcardslab-logo.png" alt="DCardsLab">
  </div>
  <nav class="page-nav no-print">
    <label>Seite
      <select id="page-nav-select">
        <option value="" disabled selected>Seite wählen…</option>
        <option value="dashboard.html">Dashboard</option>
        <option value="index.html">Scan</option>
        <option value="cards.html">Karten</option>
        <option value="purchases.html">Käufe</option>
        <option value="ebay.html">eBay</option>
        <option value="inventory.html">Inventar</option>
        <option value="statistics.html">Statistiken</option>
        <option value="settings.html">Einstellungen</option>
      </select>
    </label>
  </nav>

  <div class="controls no-print">
    <input type="text" id="q" placeholder="Suche (Titel, Team, Set, Kartennr., SKU, Saison, Tags)">
    <select id="status">
      <option value="">Alle Status</option>
      <option value="ok">ok</option>
      <option value="prüfen">prüfen</option>
      <option value="nicht erkannt">nicht erkannt</option>
    </select>
    <select id="ebay-filter">
      <option value="">Alle eBay-Status</option>
      <option value="Entwurf">Entwurf</option>
      <option value="Geplant">Geplant</option>
      <option value="Veroeffentlicht">Veröffentlicht</option>
      <option value="Verkauft">Verkauft</option>
      <option value="Fehler">Fehler</option>
    </select>
    <select id="tag-filter">
      <option value="">Alle Tags</option>
    </select>
    <button type="button" id="view-toggle">Listenansicht</button>
    <a href="card-new.html"><button type="button">+ Neue Karte anlegen</button></a>
  </div>

  <div id="bulk-actions" class="controls no-print" hidden>
    <span id="bulk-count"></span>
    <button type="button" id="bulk-mark-shipped">Als versendet markieren</button>
    <button type="button" id="bulk-unmark-shipped">Versand-Markierung entfernen</button>
    <button type="button" id="bulk-create-ebay-draft">eBay-Entwürfe anlegen</button>
    <button type="button" id="bulk-print-labels">🏷️ Etiketten drucken</button>
    <label>Zu Kauf hinzufügen
      <select id="bulk-add-purchase-select">
        <option value="">– Kauf wählen –</option>
      </select>
    </label>
    <button type="button" id="bulk-add-to-purchase-btn">Verknüpfen</button>
    <button type="button" id="bulk-clear-selection">Auswahl aufheben</button>
    <span id="bulk-status"></span>
  </div>

  <div id="undo-bar" class="controls no-print" hidden>
    <button type="button" id="bulk-undo">↩ Rückgängig</button>
    <span id="undo-status"></span>
  </div>

  <p id="status-msg"></p>
  <div id="grid" class="grid"></div>
  <table id="list" class="list" hidden>
    <thead>
      <tr>
        <th><input type="checkbox" id="select-all-checkbox" title="Alle auswählen"></th>
        <th></th>
        <th data-key="ebay_sku">SKU <span class="sort-arrow"></span></th>
        <th data-key="title">Titel <span class="sort-arrow"></span></th>
        <th data-key="team">Team <span class="sort-arrow"></span></th>
        <th data-key="season_year">Saison <span class="sort-arrow"></span></th>
        <th data-key="recognition_status">Erkennung <span class="sort-arrow"></span></th>
        <th data-key="ebay_status">eBay <span class="sort-arrow"></span></th>
        <th data-key="shipped">Versand <span class="sort-arrow"></span></th>
        <th data-key="tags">Tags <span class="sort-arrow"></span></th>
      </tr>
    </thead>
    <tbody id="list-body"></tbody>
  </table>
  <div class="pagination no-print">
    <button type="button" id="prev-page">&larr; Zurück</button>
    <span id="page-info"></span>
    <button type="button" id="next-page">Weiter &rarr;</button>
    <button type="button" id="print-btn">🖨 Drucken</button>
    <button type="button" id="csv-btn">⭳ CSV-Export</button>
  </div>

<script>
// Einheitliches Seiten-Auswahlfeld statt einzelner Links - erlaubt Navigation
// von jeder Seite zu jeder anderen; identisches Snippet auf allen Seiten dupliziert.
(function initPageNav() {
  const nav = document.getElementById("page-nav-select");
  if (!nav) return;
  const current = location.pathname.split("/").pop() || "index.html";
  for (const opt of nav.options) {
    if (opt.value === current) opt.selected = true;
  }
  nav.addEventListener("change", () => {
    if (nav.value) location.href = nav.value;
  });
})();

const PAGE_SIZE = 40;
let currentPage = 0;

const qInput = document.getElementById("q");

// "/" fokussiert das Suchfeld, ausser man tippt bereits in einem Eingabefeld
// (sonst wuerde z.B. "/" in einem Notiz-Feld die Eingabe abbrechen).
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "/" || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const tag = document.activeElement?.tagName;
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
  ev.preventDefault();
  qInput.focus();
  qInput.select();
});
const statusSelect = document.getElementById("status");
const ebayFilterSelect = document.getElementById("ebay-filter");
const tagFilterSelect = document.getElementById("tag-filter");
const statusMsg = document.getElementById("status-msg");
const grid = document.getElementById("grid");
const list = document.getElementById("list");
const listBody = document.getElementById("list-body");
const viewToggle = document.getElementById("view-toggle");
const selectAllCheckbox = document.getElementById("select-all-checkbox");
const bulkActionsBar = document.getElementById("bulk-actions");
const bulkCountEl = document.getElementById("bulk-count");
const bulkStatusEl = document.getElementById("bulk-status");
const undoBar = document.getElementById("undo-bar");
const undoBtn = document.getElementById("bulk-undo");
const undoStatusEl = document.getElementById("undo-status");

// Massenaktionen (Karten-ID -> ausgewaehlt) - nur in der Listenansicht
// nutzbar; wird bei jedem Neuladen/Filterwechsel zurueckgesetzt, damit nie
// eine nicht mehr sichtbare Karte "unsichtbar ausgewaehlt" bleibt.
let selectedIds = new Set();

function updateBulkBar() {
  bulkActionsBar.hidden = selectedIds.size === 0;
  bulkCountEl.textContent = `${selectedIds.size} Karte(n) ausgewählt`;
}

// Same labels as card.html's eBay section, so a status reads identically
// everywhere in the app.
const EBAY_STATUS_LABELS = {
  Entwurf: "Entwurf", Geplant: "Geplant", Veroeffentlicht: "Veröffentlicht",
  Verkauft: "Verkauft", Fehler: "Fehler",
};

function statusClass(status) {
  if (status === "prüfen") return "status-pruefen";
  if (status === "nicht erkannt") return "status-nicht_erkannt";
  return "";
}

function ebayBadge(ebayStatus) {
  if (!ebayStatus) return null;
  const badge = document.createElement("span");
  badge.className = "ebay-badge ebay-badge-" + ebayStatus;
  badge.textContent = "eBay: " + (EBAY_STATUS_LABELS[ebayStatus] || ebayStatus);
  return badge;
}

function shippedBadge(shipped) {
  if (!shipped) return null;
  const badge = document.createElement("span");
  badge.className = "shipped-badge";
  badge.textContent = "Versendet";
  return badge;
}

let currentView = "grid";
try {
  currentView = localStorage.getItem("cardsView") || "grid";
} catch (err) {
  // localStorage can throw in locked-down browser contexts - grid view
  // just stays the default then.
}

function applyView() {
  grid.hidden = currentView !== "grid";
  list.hidden = currentView !== "list";
  viewToggle.textContent = currentView === "grid" ? "Listenansicht" : "Kachelansicht";
}
applyView();

viewToggle.addEventListener("click", () => {
  currentView = currentView === "grid" ? "list" : "grid";
  applyView();
  try {
    localStorage.setItem("cardsView", currentView);
  } catch (err) {
    // Non-fatal - the choice just won't be remembered for next time.
  }
});

async function loadCards() {
  const params = new URLSearchParams();
  if (qInput.value.trim()) params.set("q", qInput.value.trim());
  if (statusSelect.value) params.set("status", statusSelect.value);

  statusMsg.textContent = "Lädt …";
  try {
    const res = await fetch("/api/cards?" + params.toString());
    const body = await res.json();
    if (!res.ok) {
      statusMsg.textContent = "Fehler: " + (body.detail || res.statusText);
      return;
    }
    statusMsg.textContent = `${body.cards.length} Karte(n)`;
    currentCards = body.cards;
    currentPage = 0;
    selectedIds.clear();
    updateBulkBar();
    populateTagFilter();
    renderCurrentView();
  } catch (err) {
    statusMsg.textContent = "Fehler: " + err;
  }
}

let currentCards = [];
// Zuletzt gerenderte Seite (fuer Massenaktionen "Alle auswaehlen" - bezieht
// sich bewusst nur auf die aktuell sichtbare Seite, nicht alle gefilterten
// Karten ueber alle Seiten hinweg).
let currentPageItems = [];
// SKU-ascending by default - the seller's most-used reference number.
let sortKey = "ebay_sku";
let sortAsc = true;

function sortedCards() {
  if (!sortKey) return currentCards;
  return [...currentCards].sort((a, b) => {
    const av = a[sortKey] ?? "";
    const bv = b[sortKey] ?? "";
    return sortAsc
      ? String(av).localeCompare(String(bv), "de")
      : String(bv).localeCompare(String(av), "de");
  });
}

function cardTags(card) {
  return (card.tags || "").split(",").map((t) => t.trim()).filter(Boolean);
}

function visibleCards() {
  let filtered = sortedCards();
  if (ebayFilterSelect.value) {
    filtered = filtered.filter((c) => (c.ebay_status || "") === ebayFilterSelect.value);
  }
  if (tagFilterSelect.value) {
    filtered = filtered.filter((c) => cardTags(c).includes(tagFilterSelect.value));
  }
  return filtered;
}

// Optionen kommen aus den aktuell geladenen Karten (nicht vom Server) - bei
// wenigen hundert Karten reicht das, spart einen eigenen Endpunkt. Die
// bisherige Auswahl bleibt erhalten, wenn der Tag nach dem Neuladen noch
// vorkommt.
function populateTagFilter() {
  const previous = tagFilterSelect.value;
  const tags = new Set();
  for (const card of currentCards) {
    for (const tag of cardTags(card)) tags.add(tag);
  }
  const sorted = [...tags].sort((a, b) => a.localeCompare(b, "de"));
  tagFilterSelect.innerHTML = '<option value="">Alle Tags</option>' +
    sorted.map((t) => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join("");
  if (sorted.includes(previous)) tagFilterSelect.value = previous;
}

function renderCurrentView() {
  const filtered = visibleCards();
  // card.html reads this to render "vorherige/nächste" navigation within
  // the current search/filter order (across all pages, not just the
  // current one), without a dedicated backend endpoint.
  try {
    sessionStorage.setItem("cardListIds", JSON.stringify(filtered.map((c) => c.id)));
  } catch (err) {
    // sessionStorage can throw in locked-down browser contexts (private
    // mode quirks, storage disabled) - prev/next navigation just won't be
    // available then, the list itself still renders fine.
  }

  const pageCount = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  currentPage = Math.min(currentPage, pageCount - 1);
  const pageItems = filtered.slice(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE);
  currentPageItems = pageItems;
  document.getElementById("page-info").textContent = `Seite ${currentPage + 1} von ${pageCount} (${filtered.length} Karte(n), max. ${PAGE_SIZE}/Seite)`;
  document.getElementById("prev-page").disabled = currentPage === 0;
  document.getElementById("next-page").disabled = currentPage >= pageCount - 1;

  render(pageItems);
  renderList(pageItems);
}

function setSortIndicator(key) {
  for (const th of document.querySelectorAll(".list th[data-key]")) {
    const arrow = th.querySelector(".sort-arrow");
    arrow.textContent = th.dataset.key === key ? (sortAsc ? "▲" : "▼") : "";
  }
}
setSortIndicator(sortKey);

for (const th of document.querySelectorAll(".list th[data-key]")) {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if (sortKey === key) {
      sortAsc = !sortAsc;
    } else {
      sortKey = key;
      sortAsc = true;
    }
    setSortIndicator(sortKey);
    currentPage = 0;
    renderCurrentView();
  });
}

function render(cards) {
  grid.innerHTML = "";
  for (const card of cards) {
    const a = document.createElement("a");
    a.className = "card";
    a.href = `card.html?id=${encodeURIComponent(card.id)}`;

    const img = document.createElement("img");
    if (card.front_image_url) img.src = card.front_image_url;
    img.alt = card.title || "";
    a.appendChild(img);

    const title = document.createElement("div");
    title.className = "title";
    title.textContent = card.title || "(ohne Titel)";
    a.appendChild(title);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = [card.team, card.season_year].filter(Boolean).join(" · ");
    a.appendChild(meta);

    const statusEl = document.createElement("div");
    statusEl.className = "meta " + statusClass(card.recognition_status);
    statusEl.textContent = card.recognition_status || "";
    a.appendChild(statusEl);

    const badge = ebayBadge(card.ebay_status);
    if (badge) a.appendChild(badge);

    const shipped = shippedBadge(card.shipped);
    if (shipped) a.appendChild(shipped);

    if (card.ebay_sku) {
      const skuEl = document.createElement("div");
      skuEl.className = "sku";
      skuEl.textContent = card.ebay_sku;
      a.appendChild(skuEl);
    }

    if (card.tags) {
      const tagsEl = document.createElement("div");
      tagsEl.className = "meta tags";
      tagsEl.textContent = card.tags;
      a.appendChild(tagsEl);
    }

    grid.appendChild(a);
  }
}

function renderList(cards) {
  listBody.innerHTML = "";
  selectAllCheckbox.checked = cards.length > 0 && cards.every((c) => selectedIds.has(c.id));
  for (const card of cards) {
    const tr = document.createElement("tr");

    const checkboxTd = document.createElement("td");
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = selectedIds.has(card.id);
    checkbox.addEventListener("click", (ev) => ev.stopPropagation());
    checkbox.addEventListener("change", () => {
      if (checkbox.checked) selectedIds.add(card.id);
      else selectedIds.delete(card.id);
      selectAllCheckbox.checked = cards.length > 0 && cards.every((c) => selectedIds.has(c.id));
      updateBulkBar();
    });
    checkboxTd.appendChild(checkbox);
    tr.appendChild(checkboxTd);

    const imgTd = document.createElement("td");
    const img = document.createElement("img");
    if (card.front_image_url) img.src = card.front_image_url;
    img.alt = card.title || "";
    imgTd.appendChild(img);
    tr.appendChild(imgTd);

    const skuTd = document.createElement("td");
    skuTd.textContent = card.ebay_sku || "";
    tr.appendChild(skuTd);

    const titleTd = document.createElement("td");
    titleTd.textContent = card.title || "(ohne Titel)";
    tr.appendChild(titleTd);

    const teamTd = document.createElement("td");
    teamTd.textContent = card.team || "";
    tr.appendChild(teamTd);

    const seasonTd = document.createElement("td");
    seasonTd.textContent = card.season_year || "";
    tr.appendChild(seasonTd);

    const statusTd = document.createElement("td");
    statusTd.className = statusClass(card.recognition_status);
    statusTd.textContent = card.recognition_status || "";
    tr.appendChild(statusTd);

    const ebayTd = document.createElement("td");
    const badge = ebayBadge(card.ebay_status);
    if (badge) ebayTd.appendChild(badge);
    tr.appendChild(ebayTd);

    const shippedTd = document.createElement("td");
    const shipped = shippedBadge(card.shipped);
    if (shipped) shippedTd.appendChild(shipped);
    tr.appendChild(shippedTd);

    const tagsTd = document.createElement("td");
    tagsTd.textContent = card.tags || "";
    tr.appendChild(tagsTd);

    tr.addEventListener("click", () => {
      window.location.href = `card.html?id=${encodeURIComponent(card.id)}`;
    });
    tr.style.cursor = "pointer";
    listBody.appendChild(tr);
  }
}

qInput.addEventListener("input", () => {
  clearTimeout(qInput._debounce);
  qInput._debounce = setTimeout(loadCards, 300);
});
statusSelect.addEventListener("change", loadCards);
ebayFilterSelect.addEventListener("change", () => {
  currentPage = 0;
  renderCurrentView();
});
tagFilterSelect.addEventListener("change", () => {
  currentPage = 0;
  renderCurrentView();
});

selectAllCheckbox.addEventListener("change", () => {
  for (const card of currentPageItems) {
    if (selectAllCheckbox.checked) selectedIds.add(card.id);
    else selectedIds.delete(card.id);
  }
  updateBulkBar();
  renderCurrentView();
});

// Merkt sich die letzte Massenaktion, damit sie per "Rueckgaengig" wieder
// aufgehoben werden kann. Wird von einer neuen Massenaktion ueberschrieben -
// nur der letzte Schritt ist rueckgaengig machbar.
let lastUndo = null;

function setUndo(action, label) {
  lastUndo = action;
  undoStatusEl.textContent = label;
  undoBar.hidden = false;
}

function clearUndo() {
  lastUndo = null;
  undoBar.hidden = true;
  undoStatusEl.textContent = "";
}

async function undoLastBulkAction() {
  if (!lastUndo) return;
  const action = lastUndo;
  undoBtn.disabled = true;
  undoStatusEl.textContent = "Mache rückgängig …";
  try {
    if (action.type === "shipped") {
      await Promise.all(action.entries.map(({ id, prevShipped }) =>
        fetch(`/api/cards/${encodeURIComponent(id)}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ shipped: prevShipped }),
        })
      ));
    } else if (action.type === "ebay-drafts") {
      await Promise.all(action.ids.map((id) =>
        fetch(`/api/ebay/listings/${encodeURIComponent(id)}`, { method: "DELETE" })
      ));
    }
    clearUndo();
    loadCards();
  } catch (err) {
    undoStatusEl.textContent = "Fehler beim Rückgängigmachen: " + err;
  } finally {
    undoBtn.disabled = false;
  }
}

undoBtn.addEventListener("click", undoLastBulkAction);

// Keine eigener Bulk-Endpoint noetig - feuert einfach ein PATCH pro
// ausgewaehlter Karte ab (gleiche Semantik wie card.html's einzelnes
// "Versendet"-Kontrollkaestchen), da die Selektion ueblicherweise klein ist.
async function bulkSetShipped(shipped) {
  bulkStatusEl.textContent = "Speichert …";
  const ids = [...selectedIds];
  const cardsById = new Map(currentCards.map((c) => [c.id, c]));
  const entries = ids.map((id) => ({ id, prevShipped: !!cardsById.get(id)?.shipped }));
  try {
    await Promise.all(ids.map((id) =>
      fetch(`/api/cards/${encodeURIComponent(id)}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ shipped }),
      })
    ));
    bulkStatusEl.textContent = "";
    selectedIds.clear();
    updateBulkBar();
    setUndo({ type: "shipped", entries }, `Versand-Markierung von ${entries.length} Karte(n) geändert.`);
    loadCards();
  } catch (err) {
    bulkStatusEl.textContent = "Fehler: " + err;
  }
}

document.getElementById("bulk-mark-shipped").addEventListener("click", () => bulkSetShipped(true));
document.getElementById("bulk-unmark-shipped").addEventListener("click", () => bulkSetShipped(false));

document.getElementById("bulk-clear-selection").addEventListener("click", () => {
  selectedIds.clear();
  updateBulkBar();
  renderCurrentView();
});

// Erzeugt ein leeres eBay-Angebot ("Entwurf") pro ausgewaehlter Karte, die
// noch keins hat - main.py's POST .../ebay-listing befuellt Titel/
// Beschreibung/Aspects bereits automatisch aus den Kartendaten, wenn keine
// Felder mitgeschickt werden.
async function bulkCreateEbayDrafts() {
  const ids = [...selectedIds];
  const cardsById = new Map(currentCards.map((c) => [c.id, c]));
  const targets = ids.filter((id) => !(cardsById.get(id)?.ebay_status));
  const skipped = ids.length - targets.length;
  if (!targets.length) {
    bulkStatusEl.textContent = "Alle ausgewählten Karten haben bereits ein eBay-Angebot.";
    return;
  }
  bulkStatusEl.textContent = "Lege Entwürfe an …";
  try {
    const results = await Promise.all(targets.map((id) =>
      fetch(`/api/cards/${encodeURIComponent(id)}/ebay-listing`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({}),
      })
    ));
    const okResults = results.filter((r) => r.ok);
    const failed = results.length - okResults.length;
    const created = okResults.length;
    const createdListings = await Promise.all(okResults.map((r) => r.json()));
    let message = `${created} Entwurf/Entwürfe angelegt.`;
    if (skipped) message += ` ${skipped} übersprungen (bereits vorhanden).`;
    if (failed) message += ` ${failed} fehlgeschlagen.`;
    bulkStatusEl.textContent = message;
    selectedIds.clear();
    updateBulkBar();
    if (createdListings.length) {
      setUndo(
        { type: "ebay-drafts", ids: createdListings.map((l) => l.id) },
        `${createdListings.length} eBay-Entwurf/Entwürfe angelegt.`
      );
    }
    loadCards();
  } catch (err) {
    bulkStatusEl.textContent = "Fehler: " + err;
  }
}

document.getElementById("bulk-create-ebay-draft").addEventListener("click", bulkCreateEbayDrafts);

// Gleiches Datumsformat wie purchases.html/purchase.html (DD.MM.YYYY, per
// String-Split statt new Date(), um Zeitzonen-Verschiebungen zu vermeiden).
function formatDate(value) {
  if (!value) return "";
  const [y, m, d] = value.split("-");
  return d && m && y ? `${d}.${m}.${y}` : value;
}

const bulkAddPurchaseSelect = document.getElementById("bulk-add-purchase-select");

// Einmalig beim Laden der Seite befuellt (nicht bei jedem Oeffnen der Bulk-
// Leiste) - eine neue Auswahlmoeglichkeit fuer einen waehrenddessen
// angelegten Kauf erscheint erst nach einem Seiten-Reload, das ist fuer
// diesen Anwendungsfall (Karten kurz nach dem Kauf verknuepfen) akzeptabel.
async function loadPurchasesForBulkSelect() {
  try {
    const res = await fetch("/api/purchases");
    const data = await res.json();
    if (!res.ok) return;
    for (const p of data.purchases) {
      const option = document.createElement("option");
      option.value = p.id;
      option.textContent = [formatDate(p.purchase_date), p.platform, p.seller].filter(Boolean).join(" – ");
      bulkAddPurchaseSelect.appendChild(option);
    }
  } catch (err) {
    // Dropdown bleibt dann einfach leer - kein Blocker fuer den Rest der Seite.
  }
}
loadPurchasesForBulkSelect();

// Eine Karte kann nur einem Kauf zugeordnet sein (unique(card_id) im
// Schema) - bereits verknuepfte Karten in der Auswahl werden uebersprungen
// statt einen 409-Fehler zu produzieren.
async function bulkAddToPurchase() {
  const purchaseId = bulkAddPurchaseSelect.value;
  if (!purchaseId) {
    bulkStatusEl.textContent = "Bitte zuerst einen Kauf auswählen.";
    return;
  }
  const ids = [...selectedIds];
  const cardsById = new Map(currentCards.map((c) => [c.id, c]));
  const targets = ids.filter((id) => !cardsById.get(id)?.has_purchase);
  const skipped = ids.length - targets.length;
  if (!targets.length) {
    bulkStatusEl.textContent = "Alle ausgewählten Karten sind bereits einem Kauf zugeordnet.";
    return;
  }
  bulkStatusEl.textContent = "Verknüpft …";
  try {
    const results = await Promise.all(targets.map((id) =>
      fetch(`/api/purchases/${encodeURIComponent(purchaseId)}/items`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ card_id: id }),
      })
    ));
    const okCount = results.filter((r) => r.ok).length;
    const failed = results.length - okCount;
    let message = `${okCount} Karte(n) verknüpft.`;
    if (skipped) message += ` ${skipped} übersprungen (bereits einem Kauf zugeordnet).`;
    if (failed) message += ` ${failed} fehlgeschlagen.`;
    bulkStatusEl.textContent = message;
    selectedIds.clear();
    updateBulkBar();
    loadCards();
  } catch (err) {
    bulkStatusEl.textContent = "Fehler: " + err;
  }
}

document.getElementById("bulk-add-to-purchase-btn").addEventListener("click", bulkAddToPurchase);

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

// Einfache Text-Etiketten (SKU/Team/Saison/Titel), kein echtes Barcode-
// Symbol - vermeidet eine externe Barcode-Bibliothek fuer ein Nice-to-have;
// oeffnet ein eigenes Fenster statt window.print() auf der Kartenseite
// selbst, damit Filter/Layout der Kartenliste unberuehrt bleiben.
function printLabels(cards) {
  const win = window.open("", "_blank");
  if (!win) {
    alert("Popup wurde blockiert - bitte Popups für diese Seite erlauben.");
    return;
  }
  const rows = cards.map((c) => `
    <div class="label">
      <div class="sku">${escapeHtml(c.ebay_sku || "(keine SKU)")}</div>
      <div class="meta">${escapeHtml([c.team, c.season_year].filter(Boolean).join(" · "))}</div>
      <div class="title">${escapeHtml(c.title || "(ohne Titel)")}</div>
    </div>
  `).join("");
  win.document.write(`<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Etiketten</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 1rem; }
  .labels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; }
  .label { border: 1px solid #999; border-radius: 4px; padding: 0.4rem 0.5rem; page-break-inside: avoid; }
  .label .sku { font-weight: 700; font-size: 0.85rem; }
  .label .meta { font-size: 0.7rem; color: #555; }
  .label .title { font-size: 0.75rem; margin-top: 0.15rem; }
</style></head>
<body>
  <div class="labels">${rows}</div>
  <script>window.onload = () => window.print();<\/script>
</body></html>`);
  win.document.close();
}

document.getElementById("bulk-print-labels").addEventListener("click", () => {
  const ids = [...selectedIds];
  const selected = currentCards.filter((c) => ids.includes(c.id));
  printLabels(selected);
});

document.getElementById("prev-page").addEventListener("click", () => {
  currentPage = Math.max(0, currentPage - 1);
  renderCurrentView();
});
document.getElementById("next-page").addEventListener("click", () => {
  currentPage += 1;
  renderCurrentView();
});
document.getElementById("print-btn").addEventListener("click", () => window.print());

// Semikolon als Trennzeichen (deutsches Excel erwartet das per Default bei
// Komma-Dezimalzahlen) + UTF-8-BOM, damit Umlaute nicht als Mojibake landen.
function downloadCsv(filename, headers, rows) {
  const escape = (v) => {
    const s = v == null ? "" : String(v);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [headers, ...rows].map((row) => row.map(escape).join(";"));
  const csv = "\uFEFF" + lines.join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

document.getElementById("csv-btn").addEventListener("click", () => {
  const headers = ["SKU", "Titel", "Team", "Saison", "Erkennung", "eBay-Status", "Versendet", "Tags"];
  const rows = visibleCards().map((c) => [
    c.ebay_sku || "", c.title || "", c.team || "", c.season_year || "",
    c.recognition_status || "", EBAY_STATUS_LABELS[c.ebay_status] || c.ebay_status || "",
    c.shipped ? "Ja" : "Nein", c.tags || "",
  ]);
  downloadCsv("karten.csv", headers, rows);
});
