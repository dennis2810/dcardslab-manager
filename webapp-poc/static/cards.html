<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>DCardLabs – Karten</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  .controls { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  input, select { padding: 0.4rem 0.6rem; font-size: 1rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
  .card { border: 1px solid #ccc; border-radius: 6px; padding: 0.5rem; text-decoration: none; color: inherit; display: block; }
  .card img { width: 100%; height: 140px; object-fit: cover; border-radius: 4px; background: #f0f0f0; }
  .card .title { font-weight: 600; margin-top: 0.4rem; }
  .card .meta { font-size: 0.8rem; color: #555; }
  .status-pruefen { color: #b06000; font-weight: 600; }
  .status-nicht_erkannt { color: #b00020; font-weight: 600; }
  #status-msg { font-style: italic; color: #555; }
  .ebay-badge { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 0.1rem 0.4rem; border-radius: 3px; margin-top: 0.2rem; }
  .ebay-badge-Veroeffentlicht { background: #d4edda; color: #155724; }
  .ebay-badge-Geplant { background: #fff3cd; color: #856404; }
  .ebay-badge-Verkauft { background: #cce5ff; color: #004085; }
  .ebay-badge-Fehler { background: #f8d7da; color: #721c24; }
  .ebay-badge-Entwurf { background: #e2e3e5; color: #383d41; }
  .list { width: 100%; border-collapse: collapse; }
  .list th, .list td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #e0e0e0; }
  .list img { width: 48px; height: 48px; object-fit: cover; border-radius: 4px; background: #f0f0f0; }
  .list a.row-link { color: inherit; text-decoration: none; display: block; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1>DCardLabs – Karten</h1>
  <p><a href="index.html">&larr; Zum Scan-Formular</a></p>
  <p><a href="purchases.html">Zu den Käufen &rarr;</a></p>
  <p><a href="ebay.html">Zu den eBay-Angeboten &rarr;</a></p>
  <p><a href="card-new.html">+ Neue Karte anlegen</a></p>
  <p><a href="settings.html">Einstellungen &rarr;</a></p>

  <div class="controls">
    <input type="text" id="q" placeholder="Suche (Titel, Team, Set, Kartennr.)">
    <select id="status">
      <option value="">Alle Status</option>
      <option value="ok">ok</option>
      <option value="prüfen">prüfen</option>
      <option value="nicht erkannt">nicht erkannt</option>
    </select>
    <button type="button" id="view-toggle">Listenansicht</button>
  </div>

  <p id="status-msg"></p>
  <div id="grid" class="grid"></div>
  <table id="list" class="list" hidden>
    <thead>
      <tr><th></th><th>Titel</th><th>Team / Saison</th><th>Erkennung</th><th>eBay</th></tr>
    </thead>
    <tbody id="list-body"></tbody>
  </table>

<script>
const qInput = document.getElementById("q");
const statusSelect = document.getElementById("status");
const statusMsg = document.getElementById("status-msg");
const grid = document.getElementById("grid");
const list = document.getElementById("list");
const listBody = document.getElementById("list-body");
const viewToggle = document.getElementById("view-toggle");

// Same labels as card.html's eBay section, so a status reads identically
// everywhere in the app.
const EBAY_STATUS_LABELS = {
  Entwurf: "Entwurf", Geplant: "Geplant", Veroeffentlicht: "Veröffentlicht",
  Verkauft: "Verkauft", Fehler: "Fehler",
};

function statusClass(status) {
  if (status === "prüfen") return "status-pruefen";
  if (status === "nicht erkannt") return "status-nicht_erkannt";
  return "";
}

function ebayBadge(ebayStatus) {
  if (!ebayStatus) return null;
  const badge = document.createElement("span");
  badge.className = "ebay-badge ebay-badge-" + ebayStatus;
  badge.textContent = "eBay: " + (EBAY_STATUS_LABELS[ebayStatus] || ebayStatus);
  return badge;
}

let currentView = "grid";
try {
  currentView = localStorage.getItem("cardsView") || "grid";
} catch (err) {
  // localStorage can throw in locked-down browser contexts - grid view
  // just stays the default then.
}

function applyView() {
  grid.hidden = currentView !== "grid";
  list.hidden = currentView !== "list";
  viewToggle.textContent = currentView === "grid" ? "Listenansicht" : "Kachelansicht";
}
applyView();

viewToggle.addEventListener("click", () => {
  currentView = currentView === "grid" ? "list" : "grid";
  applyView();
  try {
    localStorage.setItem("cardsView", currentView);
  } catch (err) {
    // Non-fatal - the choice just won't be remembered for next time.
  }
});

async function loadCards() {
  const params = new URLSearchParams();
  if (qInput.value.trim()) params.set("q", qInput.value.trim());
  if (statusSelect.value) params.set("status", statusSelect.value);

  statusMsg.textContent = "Lädt …";
  try {
    const res = await fetch("/api/cards?" + params.toString());
    const body = await res.json();
    if (!res.ok) {
      statusMsg.textContent = "Fehler: " + (body.detail || res.statusText);
      return;
    }
    statusMsg.textContent = `${body.cards.length} Karte(n)`;
    render(body.cards);
    renderList(body.cards);
  } catch (err) {
    statusMsg.textContent = "Fehler: " + err;
  }
}

function render(cards) {
  grid.innerHTML = "";
  // card.html reads this to render "vorherige/nächste" navigation within
  // the current search/filter order, without a dedicated backend endpoint.
  try {
    sessionStorage.setItem("cardListIds", JSON.stringify(cards.map((c) => c.id)));
  } catch (err) {
    // sessionStorage can throw in locked-down browser contexts (private
    // mode quirks, storage disabled) - prev/next navigation just won't be
    // available then, the list itself still renders fine.
  }
  for (const card of cards) {
    const a = document.createElement("a");
    a.className = "card";
    a.href = `card.html?id=${encodeURIComponent(card.id)}`;

    const img = document.createElement("img");
    if (card.front_image_url) img.src = card.front_image_url;
    img.alt = card.title || "";
    a.appendChild(img);

    const title = document.createElement("div");
    title.className = "title";
    title.textContent = card.title || "(ohne Titel)";
    a.appendChild(title);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = [card.team, card.season_year].filter(Boolean).join(" · ");
    a.appendChild(meta);

    const statusEl = document.createElement("div");
    statusEl.className = "meta " + statusClass(card.recognition_status);
    statusEl.textContent = card.recognition_status || "";
    a.appendChild(statusEl);

    const badge = ebayBadge(card.ebay_status);
    if (badge) a.appendChild(badge);

    grid.appendChild(a);
  }
}

function renderList(cards) {
  listBody.innerHTML = "";
  for (const card of cards) {
    const tr = document.createElement("tr");

    const imgTd = document.createElement("td");
    const img = document.createElement("img");
    if (card.front_image_url) img.src = card.front_image_url;
    img.alt = card.title || "";
    imgTd.appendChild(img);
    tr.appendChild(imgTd);

    const titleTd = document.createElement("td");
    titleTd.textContent = card.title || "(ohne Titel)";
    tr.appendChild(titleTd);

    const metaTd = document.createElement("td");
    metaTd.textContent = [card.team, card.season_year].filter(Boolean).join(" · ");
    tr.appendChild(metaTd);

    const statusTd = document.createElement("td");
    statusTd.className = statusClass(card.recognition_status);
    statusTd.textContent = card.recognition_status || "";
    tr.appendChild(statusTd);

    const ebayTd = document.createElement("td");
    const badge = ebayBadge(card.ebay_status);
    if (badge) ebayTd.appendChild(badge);
    tr.appendChild(ebayTd);

    tr.addEventListener("click", () => {
      window.location.href = `card.html?id=${encodeURIComponent(card.id)}`;
    });
    tr.style.cursor = "pointer";
    listBody.appendChild(tr);
  }
}

qInput.addEventListener("input", () => {
  clearTimeout(qInput._debounce);
  qInput._debounce = setTimeout(loadCards, 300);
});
statusSelect.addEventListener("change", loadCards);

loadCards();
</script>
</body>
</html>
