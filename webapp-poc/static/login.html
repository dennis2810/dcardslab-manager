<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>DCardLabs – Anmelden</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="theme-color" content="#ffffff">
<script>
// Vor dem ersten Rendern angewendet (blockierendes Script vor <style>), damit
// eine gespeicherte manuelle Hell/Dunkel-Wahl (siehe Dashboard-Schalter) nicht
// erst kurz im System-Standard aufblitzt, bevor sie greift.
try {
  var _theme = localStorage.getItem("theme");
  if (_theme === "light" || _theme === "dark") document.documentElement.setAttribute("data-theme", _theme);
} catch (err) {}
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
}
</script>
<style>
  :root { color-scheme: light dark; }
  :root[data-theme="dark"] { color-scheme: dark; }
  :root[data-theme="light"] { color-scheme: light; }
  body {
    font-family: system-ui, sans-serif; max-width: 22rem; margin: 4rem auto; padding: 0 1rem;
    display: flex; flex-direction: column; align-items: center;
  }
  .brand-logo { height: 56px; width: auto; border-radius: 8px; margin-bottom: 1.5rem; }
  h1 { font-size: 1.2rem; margin: 0 0 1.5rem; }
  form { width: 100%; display: flex; flex-direction: column; gap: 0.75rem; }
  input[type="password"] { padding: 0.6rem 0.7rem; font-size: 1rem; box-sizing: border-box; }
  button { padding: 0.6rem 0.7rem; font-size: 1rem; cursor: pointer; }
  .status { font-style: italic; color: #555; margin-top: 0.5rem; min-height: 1.2em; }
  .error { color: #b00020; font-weight: 600; font-style: normal; }
</style>
</head>
<body>
  <img class="brand-logo" src="assets/dcardslab-logo.png" alt="DCardsLab">
  <h1>Anmelden</h1>
  <form id="login-form">
    <input type="password" id="password-input" placeholder="Passwort" autocomplete="current-password" autofocus required>
    <button type="submit">Anmelden</button>
  </form>
  <p class="status" id="login-status"></p>

<script>
const params = new URLSearchParams(location.search);
const nextPath = params.get("next") || "/dashboard.html";

document.getElementById("login-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const statusEl = document.getElementById("login-status");
  statusEl.textContent = "Prüfe …";
  statusEl.className = "status";
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("password-input").value }),
    });
    if (!res.ok) {
      const body = await res.json();
      statusEl.textContent = body.detail || "Anmeldung fehlgeschlagen.";
      statusEl.className = "status error";
      document.getElementById("password-input").value = "";
      document.getElementById("password-input").focus();
      return;
    }
    // Volle Navigation statt fetch/XHR-Weiterleitung - so greift die
    // per _require_login gesetzte Session-Cookie sicher fuer den naechsten
    // Seitenaufruf inkl. aller ueber <img>/<script> nachgeladenen Ressourcen.
    location.href = nextPath;
  } catch (err) {
    statusEl.textContent = "Fehler: " + err;
    statusEl.className = "status error";
  }
});
</script>
</body>
</html>
