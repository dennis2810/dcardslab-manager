<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>DCardLabs – Dashboard</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="theme-color" content="#ffffff">
<script>
// Vor dem ersten Rendern angewendet (blockierendes Script vor <style>), damit
// eine gespeicherte manuelle Hell/Dunkel-Wahl (siehe Dashboard-Schalter unten)
// nicht erst kurz im System-Standard aufblitzt, bevor sie greift.
try {
  var _theme = localStorage.getItem("theme");
  if (_theme === "light" || _theme === "dark") document.documentElement.setAttribute("data-theme", _theme);
} catch (err) {}
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
}
</script>
<style>
  :root {
    color-scheme: light dark;
    --neutral-bg: #eee;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --neutral-bg: #333; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --neutral-bg: #333; }
  :root[data-theme="light"] { color-scheme: light; }
  body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  h2 { font-size: 1.05rem; margin-top: 2rem; }
  .page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  .brand-logo { height: 44px; width: auto; border-radius: 6px; }
  .page-nav { margin: 0.75rem 0 1.25rem; }
  .page-nav label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; font-weight: 600; }
  .page-nav select { padding: 0.4rem 0.6rem; font-size: 0.95rem; font-weight: normal; }
  .theme-toggle { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; font-weight: 600; }
  .theme-toggle select { padding: 0.3rem 0.5rem; font-size: 0.85rem; font-weight: normal; }
  #status-msg { font-style: italic; color: #555; }
  .last-updates { font-size: 0.8rem; color: #555; }
  .summary-cards { display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 1rem 0; }
  .summary-card { border: 1px solid #ddd; border-radius: 8px; padding: 0.6rem 0.9rem; min-width: 170px; display: block; color: inherit; text-decoration: none; }
  a.summary-card:hover { border-color: #888; }
  .summary-card .label { font-size: 0.8rem; color: #555; }
  .summary-card .value { font-size: 1.2rem; font-weight: 600; }
  .action-list { list-style: none; padding: 0; margin: 0; }
  .action-list li { border: 1px solid #ddd; border-radius: 6px; padding: 0.6rem 0.9rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; }
  .action-list a { color: inherit; }
  .action-empty { color: #555; font-style: italic; }
  .activity-list { list-style: none; padding: 0; margin: 0; }
  .activity-list li { padding: 0.5rem 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; gap: 0.75rem; }
  .activity-list a { color: inherit; text-decoration: none; }
  .activity-list a:hover { text-decoration: underline; }
  .activity-date { color: #555; font-size: 0.85rem; white-space: nowrap; }
  .ampel { display: flex; gap: 1.25rem; flex-wrap: wrap; margin: 0.75rem 0; }
  .ampel-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; font-weight: 600; color: inherit; text-decoration: none; }
  a.ampel-item:hover { text-decoration: underline; }
  .ampel-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .ampel-green { background: #1e8e3e; }
  .ampel-red { background: #d93025; }
  .ampel-gray { background: #999; }
  .goal-block { border: 1px solid #ddd; border-radius: 8px; padding: 0.75rem 1rem; margin: 1rem 0; }
  .goal-header { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; font-weight: 600; }
  .goal-header button { font-size: 0.8rem; padding: 0.2rem 0.6rem; }
  .goal-bar-track { background: var(--neutral-bg); border-radius: 6px; height: 14px; overflow: hidden; margin-top: 0.5rem; }
  .goal-bar-fill { background: #1e8e3e; height: 100%; width: 0%; transition: width 0.3s; }
  .goal-form { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.6rem; flex-wrap: wrap; }
  [hidden] { display: none !important; }
  .goal-form input, .goal-form select { padding: 0.3rem 0.5rem; }
  .error { color: #b00020; font-weight: 600; }
  .qr-hint { font-size: 0.85rem; color: #555; }
  .qr-code { display: inline-block; background: #fff; padding: 0.75rem; border-radius: 8px; line-height: 0; }
  #toast-container { position: fixed; bottom: 1rem; right: 1rem; display: flex; flex-direction: column; gap: 0.5rem; z-index: 1000; max-width: min(90vw, 360px); }
  .toast { background: #333; color: #fff; padding: 0.6rem 1rem; border-radius: 6px; font-size: 0.9rem; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); animation: toast-in 0.15s ease-out; }
  .toast-error { background: #b00020; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
  <div class="page-header">
    <h1>DCardLabs – Dashboard</h1>
    <label class="theme-toggle">Design
      <select id="theme-select">
        <option value="system">System</option>
        <option value="light">Hell</option>
        <option value="dark">Dunkel</option>
      </select>
    </label>
    <img class="brand-logo" src="assets/dcardslab-logo.png" alt="DCardsLab">
  </div>
  <nav class="page-nav">
    <label>Seite
      <select id="page-nav-select">
        <option value="" disabled selected>Seite wählen…</option>
        <option value="dashboard.html">Dashboard</option>
        <option value="index.html">Scan</option>
        <option value="cards.html">Karten</option>
        <option value="purchases.html">Käufe</option>
        <option value="ebay.html">eBay</option>
        <option value="inventory.html">Inventar</option>
        <option value="statistics.html">Statistiken</option>
        <option value="settings.html">Einstellungen</option>
      </select>
    </label>
  </nav>

  <p id="status-msg">Lädt …</p>
  <div class="ampel" id="connection-ampel"></div>
  <p id="last-updates" class="last-updates"></p>

  <div class="goal-block">
    <div class="goal-header">
      <span id="goal-label">Lädt …</span>
      <button type="button" id="goal-edit-btn">Bearbeiten</button>
    </div>
    <div class="goal-bar-track"><div class="goal-bar-fill" id="goal-bar-fill"></div></div>
    <form id="goal-form" class="goal-form" hidden>
      <select id="goal-metric">
        <option value="revenue">Umsatz</option>
        <option value="profit">Gewinn</option>
      </select>
      <input type="number" id="goal-amount" step="1" min="0" placeholder="Zielbetrag in €">
      <button type="submit">Speichern</button>
      <button type="button" id="goal-cancel-btn">Abbrechen</button>
      <span id="goal-status"></span>
    </form>
  </div>

  <div class="summary-cards" id="summary-cards" style="display: none;"></div>

  <h2>Was jetzt tun?</h2>
  <ul class="action-list" id="action-list"></ul>

  <h2>Letzte Aktivität</h2>
  <ul class="activity-list" id="activity-list"></ul>

  <h2>Schneller Zugriff</h2>
  <p class="qr-hint">Mit dem Handy scannen, um direkt zum Dashboard zu kommen.</p>
  <div id="qr-code" class="qr-code"></div>

<script src="vendor/qrcode.js"></script>
<script>
// Einheitliches Seiten-Auswahlfeld statt einzelner Links - erlaubt Navigation
// von jeder Seite zu jeder anderen; identisches Snippet auf allen Seiten dupliziert.
(function initPageNav() {
  const nav = document.getElementById("page-nav-select");
  if (!nav) return;
  const current = location.pathname.split("/").pop() || "index.html";
  for (const opt of nav.options) {
    if (opt.value === current) opt.selected = true;
  }
  nav.addEventListener("change", () => {
    if (nav.value) location.href = nav.value;
  });
})();

// Schalter wirkt App-weit (data-theme-Attribut auf <html> + localStorage),
// obwohl er nur hier im Dashboard sichtbar ist - jede andere Seite liest das
// gespeicherte "theme" beim Laden ueber ein blockierendes Head-Script (siehe
// <head>) und wendet es genauso an, bevor sie rendert.
(function initThemeToggle() {
  const select = document.getElementById("theme-select");
  if (!select) return;
  let stored = null;
  try { stored = localStorage.getItem("theme"); } catch (err) {}
  select.value = stored === "light" || stored === "dark" ? stored : "system";
  select.addEventListener("change", () => {
    const value = select.value;
    try {
      if (value === "system") localStorage.removeItem("theme");
      else localStorage.setItem("theme", value);
    } catch (err) {}
    if (value === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", value);
  });
})();

// Kurze, auffaellige Einblendung fuer das Ergebnis einer Aktion (Speichern/
// Loeschen/Bulk) - anders als ein reiner Status-Text neben dem jeweiligen
// Button bleibt sie sichtbar, auch wenn man inzwischen weitergescrollt hat.
function showToast(message, isError) {
  let container = document.getElementById("toast-container");
  if (!container) {
    container = document.createElement("div");
    container.id = "toast-container";
    document.body.appendChild(container);
  }
  const toast = document.createElement("div");
  toast.className = "toast" + (isError ? " toast-error" : "");
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 4000);
}

// QR-Code zum Dashboard, damit man es vom Handy aus per Kamera direkt
// oeffnen kann, ohne die Adresse abzutippen - qrcode.js ist lokal
// vendort (vendor/qrcode.js, MIT-lizenziert), kein CDN/externer Aufruf.
// typeNumber 0 = kleinste passende QR-Version automatisch waehlen.
(function renderQrCode() {
  const container = document.getElementById("qr-code");
  if (!container || typeof qrcode !== "function") return;
  const qr = qrcode(0, "M");
  qr.addData(location.origin + "/dashboard.html");
  qr.make();
  container.innerHTML = qr.createSvgTag(4);
})();

// Gleicher Schwellwert wie ebay.html/main.py's _sheets_tabs() - eBay-
// Angebote, die laenger als das "Geplant" sind, deuten meist auf einen
// haengengebliebenen Scheduling-Job hin.
const STALE_GEPLANT_DAYS = 3;
// Karten, die laenger als das ohne Verkauf im Bestand liegen, werden als
// "lange Liegedauer" markiert - willkuerlicher, aber sinnvoller Richtwert.
const LONG_HOLDING_DAYS = 90;

function fmtEuro(v) {
  return v != null ? `${Number(v).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €` : "–";
}

function fmtPercent(v) {
  return v != null ? `${Number(v).toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 })} %` : "–";
}

// Einheitliches Datumsformat (DD.MM.YYYY) - purchase_date ist ein reiner
// Datums-String ("YYYY-MM-DD"), sale_date/created_at sind volle Zeitstempel.
function formatDate(value) {
  if (!value) return "";
  const dateOnly = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
  if (dateOnly) {
    const [, y, m, d] = dateOnly;
    return `${d}.${m}.${y}`;
  }
  const d = new Date(value);
  if (isNaN(d)) return value;
  return `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}.${d.getFullYear()}`;
}

function formatDateTime(value) {
  if (!value) return "";
  const d = new Date(value);
  if (isNaN(d)) return value;
  const time = d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  return `${formatDate(value)} ${time}`;
}

function daysSince(value) {
  if (!value) return null;
  const d = new Date(value);
  if (isNaN(d)) return null;
  return Math.floor((Date.now() - d.getTime()) / (24 * 60 * 60 * 1000));
}

function addAction(items, html) {
  const li = document.createElement("li");
  li.innerHTML = html;
  items.appendChild(li);
}

// Eigener try/catch statt im Promise.all unten - ein nicht erreichbarer
// eBay-oauth-Server darf nur diese eine Aktions-Zeile ausfallen lassen,
// nicht das ganze Dashboard (gleiche Absicherung wie main.py's
// GET /api/ebay/oauth/status selbst schon serverseitig hat).
async function loadEbayStatus() {
  try {
    const res = await fetch("/api/ebay/oauth/status");
    return await res.json();
  } catch (err) {
    return null;
  }
}

// Eigener try/catch, gleiche Begruendung wie loadEbayStatus() oben - kein
// gesetztes Ziel (oder ein Fehler beim Laden) darf das restliche Dashboard
// nicht rendern.
async function loadGoal() {
  try {
    const res = await fetch("/api/dashboard-goal");
    return await res.json();
  } catch (err) {
    return null;
  }
}

// Fuer den Fortschrittsbalken gebraucht (Filterung nach aktuellem Jahr) -
// gemerkt, damit der Speichern-Handler des Ziel-Formulars unten nicht das
// ganze Dashboard neu laden muss, nur um die Zahl neu zu berechnen.
let lastStats = null;

async function load() {
  try {
    const [statsRes, invRes, cardsRes, geplantRes, sheetsRes, appStatusRes] = await Promise.all([
      fetch("/api/statistics"), fetch("/api/inventory"), fetch("/api/cards"),
      fetch("/api/ebay/listings?status=Geplant"), fetch("/api/sheets/status"),
      fetch("/api/app-status"),
    ]);
    const stats = await statsRes.json();
    const inventory = await invRes.json();
    const cardsBody = await cardsRes.json();
    const geplant = await geplantRes.json();
    const sheets = await sheetsRes.json();
    const appStatus = await appStatusRes.json();
    const ebayStatus = await loadEbayStatus();
    dashboardGoal = await loadGoal();
    lastStats = stats;

    document.getElementById("status-msg").style.display = "none";
    renderConnectionAmpel(sheets, ebayStatus);
    renderLastUpdates(sheets, appStatus);
    renderGoal();
    renderSummary(stats, inventory);
    renderActions(stats, cardsBody.cards || [], geplant.listings || [], sheets, ebayStatus);
    renderActivity(stats);
  } catch (err) {
    document.getElementById("status-msg").textContent = "Fehler: " + err;
  }
}

let dashboardGoal = null;

function currentYearTotal(stats, metric) {
  const year = String(new Date().getFullYear());
  return (stats.monthly || [])
    .filter((m) => m.month.startsWith(year))
    .reduce((sum, m) => sum + (metric === "profit" ? m.profit : m.revenue), 0);
}

function renderGoal() {
  const label = document.getElementById("goal-label");
  const fill = document.getElementById("goal-bar-fill");
  const year = new Date().getFullYear();
  if (!dashboardGoal || !dashboardGoal.amount) {
    label.textContent = `Noch kein Jahresziel für ${year} gesetzt.`;
    fill.style.width = "0%";
    return;
  }
  const metricLabel = dashboardGoal.metric === "profit" ? "Gewinn" : "Umsatz";
  const current = lastStats ? currentYearTotal(lastStats, dashboardGoal.metric) : 0;
  const pct = Math.max(0, Math.min(100, (current / dashboardGoal.amount) * 100));
  label.textContent = `${metricLabel}-Ziel ${dashboardGoal.year || year}: ${fmtEuro(current)} von ${fmtEuro(dashboardGoal.amount)} (${pct.toFixed(0)} %)`;
  fill.style.width = `${pct}%`;
}

const goalForm = document.getElementById("goal-form");
document.getElementById("goal-edit-btn").addEventListener("click", () => {
  document.getElementById("goal-metric").value = (dashboardGoal && dashboardGoal.metric) || "revenue";
  document.getElementById("goal-amount").value = (dashboardGoal && dashboardGoal.amount) || "";
  goalForm.hidden = false;
});
document.getElementById("goal-cancel-btn").addEventListener("click", () => {
  goalForm.hidden = true;
});
goalForm.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const goalStatus = document.getElementById("goal-status");
  goalStatus.textContent = "Speichert …";
  goalStatus.className = "";
  try {
    const res = await fetch("/api/dashboard-goal", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        metric: document.getElementById("goal-metric").value,
        amount: document.getElementById("goal-amount").value,
      }),
    });
    const body = await res.json();
    if (!res.ok) {
      goalStatus.textContent = "Fehler: " + (body.detail || res.statusText);
      goalStatus.className = "error";
      showToast("Fehler: " + (body.detail || res.statusText), true);
      return;
    }
    dashboardGoal = body;
    goalStatus.textContent = "";
    goalForm.hidden = true;
    renderGoal();
    showToast("Jahresziel gespeichert.");
  } catch (err) {
    goalStatus.textContent = "Fehler: " + err;
    goalStatus.className = "error";
    showToast("Fehler: " + err, true);
  }
});

function renderSummary(stats, inventory) {
  const currentMonth = new Date().toISOString().slice(0, 7);
  const monthBucket = (stats.monthly || []).find((m) => m.month === currentMonth) || { revenue: 0, profit: 0 };

  const cards = document.getElementById("summary-cards");
  cards.style.display = "flex";
  // href pro Kachel - macht jede Kennzahl klickbar zur passenden Detailseite,
  // statt nur eine reine Zahl zu zeigen.
  const entries = [
    ["Aktueller Inventarwert", fmtEuro(inventory.total_value), "inventory.html"],
    ["Umsatz laufender Monat", fmtEuro(monthBucket.revenue), "statistics.html"],
    ["Gewinn laufender Monat", fmtEuro(monthBucket.profit), "statistics.html"],
    ["Realisierter Gewinn (gesamt)", fmtEuro(stats.summary.realized_profit), "statistics.html"],
    ["ROI (verkauft)", fmtPercent(stats.summary.roi_pct), "statistics.html"],
    ["Verkaufte Karten (gesamt)", String(stats.summary.sold_count), "statistics-sales.html"],
    ["Offene Karten (Kauf, unverkauft)", String(stats.summary.open_count), "cards.html"],
  ];
  cards.innerHTML = "";
  for (const [label, value, href] of entries) {
    const card = document.createElement(href ? "a" : "div");
    card.className = "summary-card";
    if (href) card.href = href;
    card.innerHTML = `<div class="label">${label}</div><div class="value">${value}</div>`;
    cards.appendChild(card);
  }
}

// Dauerhaft sichtbare Ampel statt nur einer Warnzeile in "Was jetzt tun?" -
// so ist der Verbindungsstatus auch dann auf einen Blick erkennbar, wenn
// gerade nichts anderes zu tun ist. null (Status nicht abrufbar) zeigt grau
// statt faelschlich rot, gleiche Vorsicht wie schon bei der Warnzeile unten.
function ampelStatus(connected) {
  if (connected === true) return { cls: "ampel-green", label: "verbunden" };
  if (connected === false) return { cls: "ampel-red", label: "getrennt" };
  return { cls: "ampel-gray", label: "unbekannt" };
}

function renderConnectionAmpel(sheets, ebayStatus) {
  const container = document.getElementById("connection-ampel");
  container.innerHTML = "";
  const items = [
    ["eBay", ebayStatus ? ebayStatus.authorized : null, "ebay.html"],
    ["Google Sheets", sheets ? sheets.connected : null, "settings.html"],
  ];
  for (const [label, connected, href] of items) {
    const status = ampelStatus(connected);
    const span = document.createElement(href ? "a" : "span");
    span.className = "ampel-item";
    if (href) span.href = href;
    span.innerHTML = `<span class="ampel-dot ${status.cls}"></span>${label}: ${status.label}`;
    container.appendChild(span);
  }
}

function renderLastUpdates(sheets, appStatus) {
  const el = document.getElementById("last-updates");
  const parts = [
    `Google Sheets zuletzt synchronisiert: ${sheets.last_synced_at ? formatDateTime(sheets.last_synced_at) : "noch nie"}`,
    `Backup zuletzt heruntergeladen: ${appStatus.last_backup_at ? formatDateTime(appStatus.last_backup_at) : "noch nie"}`,
  ];
  el.textContent = parts.join(" · ");
}

function renderActions(stats, cards, geplantListings, sheets, ebayStatus) {
  const list = document.getElementById("action-list");
  list.innerHTML = "";
  let count = 0;

  const unshipped = cards.filter((c) => c.ebay_status === "Verkauft" && !c.shipped);
  if (unshipped.length) {
    count++;
    addAction(list, `📦 ${unshipped.length} verkaufte Karte(n) noch nicht versendet – <a href="cards.html">zu den Karten &rarr;</a>`);
  }

  const longHolding = (stats.rows || []).filter((r) => {
    if (r.cost == null || r.sale_price != null || !r.purchase_date) return false;
    const days = daysSince(r.purchase_date);
    return days != null && days > LONG_HOLDING_DAYS;
  });
  if (longHolding.length) {
    count++;
    addAction(list, `⏳ ${longHolding.length} Karte(n) seit über ${LONG_HOLDING_DAYS} Tagen unverkauft im Bestand – <a href="statistics.html">zu den Statistiken &rarr;</a>`);
  }

  const cardsById = new Map(cards.map((c) => [c.id, c]));
  const noListingYet = (stats.rows || []).filter((r) => {
    if (r.cost == null || r.sale_price != null || !r.purchase_date) return false;
    const days = daysSince(r.purchase_date);
    if (days == null || days <= LONG_HOLDING_DAYS) return false;
    const card = cardsById.get(r.card_id);
    return card && !card.ebay_status;
  });
  if (noListingYet.length) {
    count++;
    addAction(list, `🏷️ ${noListingYet.length} Karte(n) seit über ${LONG_HOLDING_DAYS} Tagen im Bestand, aber noch ohne eBay-Angebot – <a href="cards.html">zu den Karten &rarr;</a>`);
  }

  const staleGeplant = geplantListings.filter((l) => {
    const days = daysSince(l.scheduled_at || l.created_at);
    return days != null && days > STALE_GEPLANT_DAYS;
  });
  if (staleGeplant.length) {
    count++;
    addAction(list, `⚠️ ${staleGeplant.length} eBay-Angebot(e) seit über ${STALE_GEPLANT_DAYS} Tagen "Geplant", aber nicht veröffentlicht – <a href="ebay.html">zu den eBay-Angeboten &rarr;</a>`);
  }

  if (!sheets.connected) {
    count++;
    addAction(list, `🔌 Google Sheets ist nicht verbunden – <a href="settings.html">zu den Einstellungen &rarr;</a>`);
  }

  // ebayStatus ist null, wenn die Statusabfrage selbst fehlgeschlagen ist
  // (z.B. oauth-Server nicht erreichbar) - dann lieber keinen (evtl.
  // falschen) Alarm zeigen als einen unzuverlässigen.
  if (ebayStatus && !ebayStatus.authorized) {
    count++;
    addAction(list, `🔌 eBay ist nicht verbunden – <a href="ebay.html">zu den eBay-Angeboten &rarr;</a>`);
  }

  if (!count) {
    const li = document.createElement("li");
    li.className = "action-empty";
    li.textContent = "Alles im grünen Bereich – nichts zu tun.";
    list.appendChild(li);
  }
}

function renderActivity(stats) {
  const list = document.getElementById("activity-list");
  list.innerHTML = "";

  const rows = stats.rows || [];
  const sales = rows
    .filter((r) => r.sale_date)
    .map((r) => ({ date: r.sale_date, text: `Verkauft: ${r.title || "(ohne Titel)"} für ${fmtEuro(r.sale_price)}`, href: `card.html?id=${encodeURIComponent(r.card_id)}` }));
  const purchases = rows
    .filter((r) => r.purchase_date)
    .map((r) => ({ date: r.purchase_date, text: `Gekauft: ${r.title || "(ohne Titel)"}${r.cost != null ? ` für ${fmtEuro(r.cost)}` : ""}`, href: `card.html?id=${encodeURIComponent(r.card_id)}` }));

  const combined = [...sales, ...purchases]
    .sort((a, b) => String(b.date).localeCompare(String(a.date)))
    .slice(0, 10);

  if (!combined.length) {
    const li = document.createElement("li");
    li.textContent = "Noch keine Aktivität.";
    list.appendChild(li);
    return;
  }

  for (const entry of combined) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = entry.href;
    a.textContent = entry.text;
    li.appendChild(a);
    const dateSpan = document.createElement("span");
    dateSpan.className = "activity-date";
    dateSpan.textContent = formatDate(entry.date);
    li.appendChild(dateSpan);
    list.appendChild(li);
  }
}

load();
</script>
</body>
</html>
