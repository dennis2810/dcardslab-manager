<script>
// Vor dem ersten Rendern angewendet (blockierendes Script vor <style>), damit
// eine gespeicherte manuelle Hell/Dunkel-Wahl (siehe Dashboard-Schalter) nicht
// erst kurz im System-Standard aufblitzt, bevor sie greift.
try {
  var _theme = localStorage.getItem("theme");
  if (_theme === "light" || _theme === "dark") document.documentElement.setAttribute("data-theme", _theme);
} catch (err) {}
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
}
</script>

<script>
// Einheitliches Seiten-Auswahlfeld statt einzelner Links - erlaubt Navigation
// von jeder Seite zu jeder anderen; identisches Snippet auf allen Seiten dupliziert.
(function initPageNav() {
  const nav = document.getElementById("page-nav-select");
  if (!nav) return;
  const current = location.pathname.split("/").pop() || "index.html";
  for (const opt of nav.options) {
    if (opt.value === current) opt.selected = true;
  }
  nav.addEventListener("change", () => {
    if (nav.value) location.href = nav.value;
  });
})();

// Kurze, auffaellige Einblendung fuer das Ergebnis einer Aktion (Speichern/
// Loeschen/Bulk) - anders als ein reiner Status-Text neben dem jeweiligen
// Button bleibt sie sichtbar, auch wenn man inzwischen weitergescrollt hat.
function showToast(message, isError) {
  let container = document.getElementById("toast-container");
  if (!container) {
    container = document.createElement("div");
    container.id = "toast-container";
    document.body.appendChild(container);
  }
  const toast = document.createElement("div");
  toast.className = "toast" + (isError ? " toast-error" : "");
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 4000);
}

// Schwellwert fuer die "auffaellig hohe Marge"-Markierung - deckungsgleich
// mit statistics.html.
const OUTLIER_MARGIN_THRESHOLD = 300;

// Third element is a short explanation shown as a hover tooltip on the
// field's label - same field meanings as integrations/ai_card_recognition.py's
// recognition prompt, so the UI and the AI agree on what each field means.
const FIELDS = [
  ["title", "Titel", "Name der abgebildeten Person/des Charakters"],
  ["category", "Kategorie", "Sportart bzw. übergeordnete Kategorie (z. B. Fußball, Marvel)"],
  ["theme", "Thema", "Liga/Wettbewerb/Serie, falls auf der Karte aufgedruckt (z. B. Bundesliga)"],
  ["team", "Team", "Team/Verein, wie auf der Karte angegeben"],
  ["manufacturer", "Hersteller", "Kartenhersteller (z. B. Topps, Panini)"],
  ["set_name", "Set", "Set-/Serienname"],
  ["season_year", "Saison", "Saison oder Jahr (z. B. \"2024\" oder \"2024/25\")"],
  ["card_type", "Typ", "Parallel-/Variantenbezeichnung (z. B. Gold, Silver, Base, Insert)"],
  ["variant", "Variante", "Weitere Variantenangabe, falls von Typ verschieden"],
  ["position", "Position", "Spielposition, falls auf der Karte vermerkt"],
  ["squad_number", "Trikotnummer", "Trikotnummer, falls auf der Karte vermerkt"],
  ["club_debut_season", "Debütsaison", "Debütsaison beim Verein, falls vermerkt"],
  ["card_number", "Kartennr.", "Kartennummer, wie auf der Karte angegeben (z. B. \"#123\")"],
  ["serial_number", "Seriennr.", "Seriennummer bei limitierten Karten (z. B. \"12/99\")"],
  ["print_run", "Auflage", "Gesamtauflage bei limitierten Karten (z. B. \"99\")"],
];

// Einheitliches Datumsformat (DD.MM.YYYY) fuer die ganze App - manuell statt
// ueber toLocaleDateString("de-DE"), da dessen Default-Ausgabe Tag/Monat
// NICHT nullt-pollstert (z.B. "5.1.2026" statt "05.01.2026"). Reine
// Datums-Strings (purchase_date, "YYYY-MM-DD") werden per String-Split
// statt ueber new Date() zerlegt, damit ein Aufruf in einer Zeitzone
// westlich von UTC nicht durch die UTC-Mitternachts-Interpretation auf den
// Vortag zurueckfaellt.
function formatDate(value) {
  if (!value) return "";
  const dateOnly = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
  if (dateOnly) {
    const [, y, m, d] = dateOnly;
    return `${d}.${m}.${y}`;
  }
  const d = new Date(value);
  if (isNaN(d)) return value;
  return `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}.${d.getFullYear()}`;
}

function formatDateTime(value) {
  if (!value) return "";
  const d = new Date(value);
  if (isNaN(d)) return value;
  const time = d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  return `${formatDate(value)} ${time}`;
}

// de-DE liefert Tausenderpunkt + Dezimalkomma (z.B. "1.709,10"), was fuer
// groessere Betraege/Prozentwerte deutlich lesbarer ist als toFixed().
function fmtEuro(value) {
  return value != null && value !== ""
    ? `${Number(value).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €`
    : "";
}

function fmtPercent(value) {
  return value != null
    ? `${Number(value).toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 })} %`
    : "";
}

function showError(container, message) {
  container.innerHTML = "";
  const p = document.createElement("p");
  p.className = "error";
  p.textContent = message;
  container.appendChild(p);
}

const params = new URLSearchParams(location.search);
const cardId = params.get("id");
const form = document.getElementById("edit-form");

// Warnt vor Verlassen der Seite, sobald ein Feld im Bearbeiten-Formular
// getippt wurde - bewusst nur auf #edit-form beschraenkt, nicht auf der
// ganzen Seite: card.html hat noch etliche andere, sofort speichernde
// Mini-Formulare (Preisrecherche, eBay-Gebuehren, ...), die keine
// "ungespeicherten Aenderungen" im gleichen Sinn haben.
let formIsDirty = false;
form.addEventListener("input", () => { formIsDirty = true; });
window.addEventListener("beforeunload", (ev) => {
  if (!formIsDirty) return;
  ev.preventDefault();
  ev.returnValue = "";
});

if (!cardId) {
  showError(form, "Keine Karten-ID angegeben.");
} else {
  loadCard();
  renderPrevNextNav();
}

// Reads the ordered ID list cards.html stored for the current search/filter
// (see cards.html's render()) so "vorherige/nächste" can jump within that
// same order - no dedicated backend endpoint needed. Direct navigation to
// this page (no list ever loaded in this tab, or the ID isn't in the
// stored list) just renders no links.
function renderPrevNextNav() {
  const nav = document.getElementById("prev-next-nav");
  nav.innerHTML = "";
  let ids = [];
  try {
    ids = JSON.parse(sessionStorage.getItem("cardListIds") || "[]");
  } catch (err) {
    ids = [];
  }
  const index = ids.indexOf(cardId);
  if (index === -1) return;

  if (index > 0) {
    const prevLink = document.createElement("a");
    prevLink.href = `card.html?id=${encodeURIComponent(ids[index - 1])}`;
    prevLink.textContent = "← Vorherige";
    nav.appendChild(prevLink);
  }
  if (index < ids.length - 1) {
    const nextLink = document.createElement("a");
    nextLink.href = `card.html?id=${encodeURIComponent(ids[index + 1])}`;
    nextLink.textContent = "Nächste →";
    nav.appendChild(nextLink);
  }
}

// Download + drehen + Re-Upload nach Supabase Storage ist ein Server-
// seitiger Roundtrip, der spuerbar dauern kann (abhaengig von der
// Upload-Bandbreite des NAS) - ohne Rueckmeldung sah ein Klick waehrend
// dieser Wartezeit wie "tut nichts" aus, und mehrere schnelle Klicks
// hintereinander feuerten mehrere ueberlappende Requests, deren Antworten
// in beliebiger Reihenfolge zurueckkommen konnten. requestId pro Seite
// sorgt dafuer, dass nur die Antwort des zuletzt gestarteten Requests
// tatsaechlich angezeigt wird; die Buttons sind waehrenddessen deaktiviert,
// damit gar nicht erst mehrere Requests fuer dieselbe Seite ueberlappen.
const _rotateRequestIds = { front: 0, back: 0 };

async function rotateImage(side, degrees) {
  const leftBtn = document.getElementById(`${side}-rotate-left`);
  const rightBtn = document.getElementById(`${side}-rotate-right`);
  const statusEl = document.getElementById(`${side}-rotate-status`);
  const requestId = ++_rotateRequestIds[side];

  leftBtn.disabled = true;
  rightBtn.disabled = true;
  statusEl.textContent = "Dreht …";
  try {
    const res = await fetch(`/api/cards/${encodeURIComponent(cardId)}/rotate`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ side, degrees }),
    });
    const body = await res.json();
    if (requestId !== _rotateRequestIds[side]) return;  // ueberholt von einem neueren Klick
    if (!res.ok) {
      alert("Fehler beim Drehen: " + (body.detail || res.statusText));
      return;
    }
    // Zeigt die gedrehten Bytes direkt als Data-URI an, statt eine
    // signierte Storage-URL nachzuladen: Supabase Storage's CDN kann kurz
    // nach dem Ueberschreiben noch eine veraltete Kopie der Objekt-Bytes
    // ausliefern, selbst bei einer frisch signierten URL mit Cache-Busting-
    // Parameter - die Data-URI kommt dagegen direkt aus der Rotation
    // selbst und kann nicht veraltet sein.
    if (body.rotated_image_data_uri) {
      const imgId = side === "front" ? "front-img" : "back-img";
      document.getElementById(imgId).src = body.rotated_image_data_uri;
    }
  } catch (err) {
    if (requestId === _rotateRequestIds[side]) alert("Fehler beim Drehen: " + err);
  } finally {
    if (requestId === _rotateRequestIds[side]) {
      leftBtn.disabled = false;
      rightBtn.disabled = false;
      statusEl.textContent = "";
    }
  }
}

document.getElementById("front-rotate-left").addEventListener("click", () => rotateImage("front", 270));
document.getElementById("front-rotate-right").addEventListener("click", () => rotateImage("front", 90));
document.getElementById("back-rotate-left").addEventListener("click", () => rotateImage("back", 270));
document.getElementById("back-rotate-right").addEventListener("click", () => rotateImage("back", 90));

// Ersetzt ein einzelnes Foto, ohne die ganze Karte neu anzulegen - bisher
// liess sich ein unscharfes/falsches Foto nur drehen, nicht austauschen.
async function replaceImage(side, file) {
  const leftBtn = document.getElementById(`${side}-rotate-left`);
  const rightBtn = document.getElementById(`${side}-rotate-right`);
  const replaceBtn = document.getElementById(`${side}-replace-btn`);
  const statusEl = document.getElementById(`${side}-rotate-status`);

  leftBtn.disabled = true;
  rightBtn.disabled = true;
  replaceBtn.disabled = true;
  statusEl.textContent = "Lädt hoch …";
  try {
    const formData = new FormData();
    formData.append("side", side);
    formData.append("file", file);
    const res = await fetch(`/api/cards/${encodeURIComponent(cardId)}/image`, {
      method: "POST",
      body: formData,
    });
    const body = await res.json();
    if (!res.ok) {
      alert("Fehler beim Ersetzen: " + (body.detail || res.statusText));
      return;
    }
    if (body.replaced_image_data_uri) {
      const imgId = side === "front" ? "front-img" : "back-img";
      document.getElementById(imgId).src = body.replaced_image_data_uri;
    }
  } catch (err) {
    alert("Fehler beim Ersetzen: " + err);
  } finally {
    leftBtn.disabled = false;
    rightBtn.disabled = false;
    replaceBtn.disabled = false;
    statusEl.textContent = "";
  }
}

for (const side of ["front", "back"]) {
  const fileInput = document.getElementById(`${side}-replace-file`);
  document.getElementById(`${side}-replace-btn`).addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    fileInput.value = "";
    if (file) replaceImage(side, file);
  });
}

async function loadCard() {
  try {
    const res = await fetch(`/api/cards/${encodeURIComponent(cardId)}`);
    const card = await res.json();
    if (!res.ok) {
      showError(form, "Fehler: " + (card.detail || res.statusText));
      return;
    }
    render(card);
    renderPurchaseSection(card.purchase);
    renderInventorySection(card.inventory);
    renderEbaySection(card.ebay_listing, card.purchase, card.ebay_sale);
    renderManualSaleSection(card.manual_sale, card.purchase);
    renderPriceResearchSection(card.price_research, card.ebay_listing?.title || card.title, card.ebay_listing?.price);
  } catch (err) {
    showError(form, "Fehler: " + err);
  }
}

function render(card) {
  const frontImg = document.getElementById("front-img");
  if (card.front_image_url) frontImg.src = card.front_image_url;
  const backImg = document.getElementById("back-img");
  if (card.back_image_url) backImg.src = card.back_image_url;

  form.innerHTML = "";
  for (const [key, label, explanation] of FIELDS) {
    const wrapper = document.createElement("label");
    wrapper.textContent = label;
    if (explanation) wrapper.title = explanation;
    const input = document.createElement("input");
    input.type = "text";
    input.name = key;
    input.value = card[key] ?? "";
    wrapper.appendChild(input);
    form.appendChild(wrapper);
  }

  const statusWrapper = document.createElement("label");
  statusWrapper.textContent = "Status";
  const statusSelect = document.createElement("select");
  statusSelect.name = "recognition_status";
  const KNOWN_STATUSES = ["ok", "prüfen", "nicht erkannt"];
  const currentStatus = card.recognition_status || "";
  // A card can carry a status outside the three normal values (e.g.
  // "deaktiviert" or an AI-Erkennung-fehlgeschlagen error text from
  // recognize_card()) - add it as its own preselected option instead of
  // silently falling back to "ok" when the dropdown has no matching
  // <option>, which would overwrite that status on the next save even if
  // the user only meant to fix an unrelated field.
  const options = currentStatus && !KNOWN_STATUSES.includes(currentStatus)
    ? [currentStatus, ...KNOWN_STATUSES]
    : KNOWN_STATUSES;
  for (const value of options) {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = value;
    if (currentStatus === value) option.selected = true;
    statusSelect.appendChild(option);
  }
  statusWrapper.appendChild(statusSelect);
  form.appendChild(statusWrapper);

  const shippedWrapper = document.createElement("label");
  shippedWrapper.className = "checkbox-field";
  const shippedCheckbox = document.createElement("input");
  shippedCheckbox.type = "checkbox";
  shippedCheckbox.name = "shipped";
  shippedCheckbox.checked = Boolean(card.shipped);
  shippedWrapper.append(shippedCheckbox, " Versendet");
  form.appendChild(shippedWrapper);

  const tagsWrapper = document.createElement("label");
  tagsWrapper.textContent = "Tags";
  tagsWrapper.title = "Kommagetrennt, z. B. Rookie, PSA-würdig, Investment";
  const tagsInput = document.createElement("input");
  tagsInput.type = "text";
  tagsInput.name = "tags";
  tagsInput.placeholder = "Kommagetrennt, z. B. Rookie, PSA-würdig";
  tagsInput.value = card.tags ?? "";
  tagsWrapper.appendChild(tagsInput);
  form.appendChild(tagsWrapper);

  const actions = document.createElement("div");
  actions.className = "actions";

  const saveBtn = document.createElement("button");
  saveBtn.type = "submit";
  saveBtn.textContent = "Speichern";
  actions.appendChild(saveBtn);

  const deleteBtn = document.createElement("button");
  deleteBtn.type = "button";
  deleteBtn.id = "delete-btn";
  deleteBtn.textContent = "Löschen";
  deleteBtn.addEventListener("click", onDelete);
  actions.appendChild(deleteBtn);

  form.appendChild(actions);

  const statusP = document.createElement("p");
  statusP.id = "save-status";
  form.appendChild(statusP);
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const fields = {};
  for (const [key] of FIELDS) {
    fields[key] = form.elements[key].value;
  }
  fields.recognition_status = form.elements["recognition_status"].value;
  fields.shipped = form.elements["shipped"].checked;
  fields.tags = form.elements["tags"].value;
  const statusP = document.getElementById("save-status");
  statusP.textContent = "Speichert …";
  statusP.className = "";
  try {
    const res = await fetch(`/api/cards/${encodeURIComponent(cardId)}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(fields),
    });
    const body = await res.json();
    if (!res.ok) {
      statusP.textContent = "Fehler: " + (body.detail || res.statusText);
      statusP.className = "error";
      showToast("Fehler: " + (body.detail || res.statusText), true);
      return;
    }
    statusP.textContent = "Gespeichert.";
    formIsDirty = false;
    showToast("Karte gespeichert.");
  } catch (err) {
    statusP.textContent = "Fehler: " + err;
    statusP.className = "error";
    showToast("Fehler: " + err, true);
  }
});

async function onDelete() {
  if (!confirm("Diese Karte wirklich löschen?")) return;
  try {
    const res = await fetch(`/api/cards/${encodeURIComponent(cardId)}`, { method: "DELETE" });
    if (!res.ok) {
      const body = await res.json();
      alert("Fehler beim Löschen: " + (body.detail || res.statusText));
      return;
    }
    formIsDirty = false;
    location.href = "cards.html";
  } catch (err) {
    alert("Fehler beim Löschen: " + err);
  }
}

function renderPurchaseSection(purchase) {
  const section = document.getElementById("purchase-section");
  section.innerHTML = "<h2>Kauf</h2>";

  if (purchase) {
    const dl = document.createElement("dl");
    dl.className = "purchase-info";
    const rows = [
      ["Kaufdatum", formatDate(purchase.purchase_date)], ["Plattform", purchase.platform],
      ["Verkäufer", purchase.seller], ["Anteil-Preis", fmtEuro(purchase.allocated_cost)],
      ["Notizen", purchase.notes],
    ];
    for (const [label, value] of rows) {
      const dt = document.createElement("dt");
      dt.textContent = label;
      dl.appendChild(dt);
      const dd = document.createElement("dd");
      dd.textContent = value || "";
      dl.appendChild(dd);
    }
    section.appendChild(dl);

    const link = document.createElement("a");
    link.href = `purchase.html?id=${encodeURIComponent(purchase.purchase_id)}`;
    link.textContent = "Zum Kauf";
    section.appendChild(link);
    section.appendChild(document.createTextNode(" · "));

    const unlinkBtn = document.createElement("button");
    unlinkBtn.type = "button";
    unlinkBtn.textContent = "Verknüpfung lösen";
    unlinkBtn.addEventListener("click", async () => {
      if (!confirm("Verknüpfung zu diesem Kauf lösen? Der Kauf selbst bleibt bestehen.")) return;
      try {
        const res = await fetch(
          `/api/purchases/${encodeURIComponent(purchase.purchase_id)}/items/${encodeURIComponent(purchase.item_id)}`,
          { method: "DELETE" }
        );
        if (!res.ok && res.status !== 204) {
          const body = await res.json();
          alert("Fehler: " + (body.detail || res.statusText));
          return;
        }
        showToast("Verknüpfung gelöst.");
        loadCard();
      } catch (err) {
        alert("Fehler: " + err);
      }
    });
    section.appendChild(unlinkBtn);
    return;
  }

  const forms = document.createElement("div");
  forms.className = "purchase-forms";

  const quickBuy = document.createElement("div");
  quickBuy.innerHTML = `
    <strong>Neuer Kauf für diese Karte</strong><br>
    <input type="date" id="quick-purchase-date" required>
    <input type="text" id="quick-platform" placeholder="Plattform">
    <input type="text" id="quick-seller" placeholder="Verkäufer">
    <input type="number" step="0.01" id="quick-total-price" placeholder="Preis">
    <input type="number" step="0.01" id="quick-shipping" placeholder="Versand">
    <button type="button" id="quick-buy-btn">Speichern</button>
    <span id="quick-buy-status"></span>
  `;
  forms.appendChild(quickBuy);

  const existingBuy = document.createElement("div");
  existingBuy.innerHTML = `
    <strong>Zu bestehendem Kauf hinzufügen</strong><br>
    <input type="text" id="purchase-search" placeholder="Kauf suchen (Plattform, Verkäufer, Notizen)">
    <select id="purchase-results"></select>
    <button type="button" id="link-purchase-btn">Verknüpfen</button>
    <span id="link-purchase-status"></span>
  `;
  forms.appendChild(existingBuy);

  section.appendChild(forms);

  document.getElementById("quick-buy-btn").addEventListener("click", async () => {
    const statusEl = document.getElementById("quick-buy-status");
    const purchaseDate = document.getElementById("quick-purchase-date").value;
    if (!purchaseDate) {
      statusEl.textContent = "Kaufdatum fehlt.";
      statusEl.className = "error";
      return;
    }
    statusEl.textContent = "Speichert …";
    statusEl.className = "";
    try {
      const res = await fetch("/api/purchases", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          purchase_date: purchaseDate,
          platform: document.getElementById("quick-platform").value,
          seller: document.getElementById("quick-seller").value,
          total_price: document.getElementById("quick-total-price").value,
          shipping: document.getElementById("quick-shipping").value,
          items: [{ card_id: cardId }],
        }),
      });
      const body = await res.json();
      if (!res.ok) {
        statusEl.textContent = "Fehler: " + (body.detail || res.statusText);
        statusEl.className = "error";
        showToast("Fehler: " + (body.detail || res.statusText), true);
        return;
      }
      showToast("Kauf angelegt und verknüpft.");
      loadCard();
    } catch (err) {
      statusEl.textContent = "Fehler: " + err;
      statusEl.className = "error";
      showToast("Fehler: " + err, true);
    }
  });

  const purchaseSearch = document.getElementById("purchase-search");
  const purchaseResults = document.getElementById("purchase-results");

  // Ohne Suchbegriff werden die zuletzt angelegten Kaeufe vorgeschlagen
  // (GET /api/purchases liefert standardmaessig neueste zuerst), auf 20
  // Eintraege gedeckelt - deckt den haeufigen Fall ab, eine Karte direkt
  // dem gerade eben angelegten Kauf zuzuordnen, ohne erst danach suchen
  // zu muessen.
  async function searchPurchases() {
    const q = purchaseSearch.value.trim();
    purchaseResults.innerHTML = "";
    try {
      const url = q ? `/api/purchases?q=${encodeURIComponent(q)}` : "/api/purchases";
      const res = await fetch(url);
      const body = await res.json();
      for (const p of (body.purchases || []).slice(0, 20)) {
        const option = document.createElement("option");
        option.value = p.id;
        option.textContent = `${p.purchase_date || ""} · ${p.platform || ""} · ${p.seller || ""}`;
        purchaseResults.appendChild(option);
      }
    } catch (err) {
      // Suche schlaegt fehl -> Dropdown bleibt leer.
    }
  }

  purchaseSearch.addEventListener("input", () => {
    clearTimeout(purchaseSearch._debounce);
    purchaseSearch._debounce = setTimeout(searchPurchases, 300);
  });
  searchPurchases();

  document.getElementById("link-purchase-btn").addEventListener("click", async () => {
    const statusEl = document.getElementById("link-purchase-status");
    const selectedPurchaseId = purchaseResults.value;
    if (!selectedPurchaseId) {
      statusEl.textContent = "Bitte erst einen Kauf suchen und auswählen.";
      statusEl.className = "error";
      return;
    }
    statusEl.textContent = "Verknüpft …";
    statusEl.className = "";
    try {
      const res = await fetch(`/api/purchases/${encodeURIComponent(selectedPurchaseId)}/items`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ card_id: cardId }),
      });
      const body = await res.json();
      if (!res.ok) {
        statusEl.textContent = "Fehler: " + (body.detail || res.statusText);
        statusEl.className = "error";
        showToast("Fehler: " + (body.detail || res.statusText), true);
        return;
      }
      showToast("Mit Kauf verknüpft.");
      loadCard();
    } catch (err) {
      statusEl.textContent = "Fehler: " + err;
      statusEl.className = "error";
      showToast("Fehler: " + err, true);
    }
  });
}

const EBAY_STATUS_LABELS = {
  Entwurf: "Entwurf", Geplant: "Geplant", Veroeffentlicht: "Veröffentlicht",
  Verkauft: "Verkauft", Fehler: "Fehler",
};

// Same URL formulas as ebay_listing.price_research_links() on the backend
// - built client-side here so the links update live as the title is
// edited, without a round trip for something this cheap to compute.
function priceResearchLinks(title) {
  const q = encodeURIComponent(title || "");
  return {
    ebaySold: `https://www.ebay.de/sch/i.html?_nkw=${q}&LH_Sold=1&LH_Complete=1`,
    onepoint: `https://130point.com/sales/?search=${q}`,
  };
}

// Cached across calls within the page's lifetime - the environment
// (sandbox vs. production) can't change without a server restart, so one
// fetch per page load is enough instead of one per rendered link.
let _ebayEnvironment = null;

async function getEbayEnvironment() {
  if (_ebayEnvironment) return _ebayEnvironment;
  try {
    const res = await fetch("/api/ebay/oauth/status");
    const body = await res.json();
    _ebayEnvironment = body.environment || "sandbox";
    return _ebayEnvironment;
  } catch (err) {
    // Only a successful fetch is cached - a transient failure here must
    // not permanently pin every later link on this page to "sandbox"
    // (falling through to the same fallback without caching it retries
    // on the next call instead).
    return "sandbox";
  }
}

function ebayListingUrl(listing, environment) {
  const host = environment === "production" ? "ebay.de" : "sandbox.ebay.de";
  return `https://www.${host}/itm/${encodeURIComponent(listing.ebay_listing_id)}`;
}

const CONDITION_OPTIONS = [
  ["NM", "Neuwertig / Near Mint or Better (NM)"],
  ["EX", "Sehr gut / Excellent (EX)"],
  ["VG", "Gut / Very Good (VG)"],
  ["G", "Befriedigend / Poor (G)"],
];

function renderInventorySection(items) {
  const section = document.getElementById("inventory-section");
  section.innerHTML = "<h2>Inventar</h2>";

  for (const item of items || []) {
    section.appendChild(renderInventoryRow(item));
  }

  const addBtn = document.createElement("button");
  addBtn.type = "button";
  addBtn.textContent = "+ Inventareintrag hinzufügen";
  addBtn.addEventListener("click", () => {
    addBtn.replaceWith(renderInventoryRow(null));
  });
  section.appendChild(addBtn);
}

function renderInventoryRow(item) {
  const row = document.createElement("div");
  row.className = "inventory-row";

  const quantityInput = document.createElement("input");
  quantityInput.type = "number";
  quantityInput.min = "0";
  quantityInput.value = item?.quantity ?? 1;
  const quantityWrapper = document.createElement("label");
  quantityWrapper.textContent = "Menge";
  quantityWrapper.appendChild(quantityInput);
  row.appendChild(quantityWrapper);

  const conditionSelect = document.createElement("select");
  for (const [value, label] of CONDITION_OPTIONS) {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = label;
    if ((item?.condition || "NM") === value) option.selected = true;
    conditionSelect.appendChild(option);
  }
  const conditionWrapper = document.createElement("label");
  conditionWrapper.textContent = "Zustand";
  conditionWrapper.appendChild(conditionSelect);
  row.appendChild(conditionWrapper);

  const locationInput = document.createElement("input");
  locationInput.type = "text";
  locationInput.value = item?.location || "";
  const locationWrapper = document.createElement("label");
  locationWrapper.textContent = "Lagerort";
  locationWrapper.appendChild(locationInput);
  row.appendChild(locationWrapper);

  const notesInput = document.createElement("input");
  notesInput.type = "text";
  notesInput.value = item?.notes || "";
  const notesWrapper = document.createElement("label");
  notesWrapper.className = "notes-field";
  notesWrapper.textContent = "Notizen";
  notesWrapper.appendChild(notesInput);
  row.appendChild(notesWrapper);

  const statusEl = document.createElement("span");
  row.appendChild(statusEl);

  const saveBtn = document.createElement("button");
  saveBtn.type = "button";
  saveBtn.textContent = "Speichern";
  saveBtn.addEventListener("click", async () => {
    const fields = {
      quantity: quantityInput.value, condition: conditionSelect.value,
      location: locationInput.value, notes: notesInput.value,
    };
    statusEl.textContent = "Speichert …";
    statusEl.className = "";
    try {
      const url = item
        ? `/api/inventory/${encodeURIComponent(item.id)}`
        : `/api/cards/${encodeURIComponent(cardId)}/inventory`;
      const res = await fetch(url, {
        method: item ? "PATCH" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(fields),
      });
      const body = await res.json();
      if (!res.ok) {
        statusEl.textContent = "Fehler: " + (body.detail || res.statusText);
        statusEl.className = "error";
        showToast("Fehler: " + (body.detail || res.statusText), true);
        return;
      }
      showToast("Inventareintrag gespeichert.");
      loadCard();
    } catch (err) {
      statusEl.textContent = "Fehler: " + err;
      statusEl.className = "error";
      showToast("Fehler: " + err, true);
    }
  });
  row.appendChild(saveBtn);

  if (item) {
    const deleteBtn = document.createElement("button");
    deleteBtn.type = "button";
    deleteBtn.textContent = "Löschen";
    deleteBtn.addEventListener("click", async () => {
      if (!confirm("Diesen Inventareintrag wirklich löschen?")) return;
      try {
        const res = await fetch(`/api/inventory/${encodeURIComponent(item.id)}`, { method: "DELETE" });
        if (!res.ok && res.status !== 204) {
          const body = await res.json();
          alert("Fehler: " + (body.detail || res.statusText));
          return;
        }
        showToast("Inventareintrag gelöscht.");
        loadCard();
      } catch (err) {
        alert("Fehler: " + err);
      }
    });
    row.appendChild(deleteBtn);
  }

  return row;
}

// Preisrecherche-Verlauf: manuell eingetragene Marktpreis-Beobachtungen
// ueber die Zeit (z.B. "eBay verkaufte Artikel" am X. Datum bei Y Euro) -
// unabhaengig vom eigenen eBay-Angebot, hilft bei der Preisfindung.
// Verkauf ausserhalb von eBay (Kleinanzeigen, Vinted, ...) - eigenstaendig
// von renderEbaySection() oben, da nicht an einen ebay_listings-Eintrag
// gebunden. Genau ein manueller Verkauf pro Karte (siehe main.py's
// POST/PATCH/DELETE /api/manual-sales), analog zu renderSaleStats() fuer
// eBay-Verkaeufe, aber mit editierbarem Kanal/Preis/Datum statt nur
// nachtraeglich anpassbaren Gebuehren.
function renderManualSaleSection(manualSale, purchase) {
  const section = document.getElementById("manual-sale-section");
  if (manualSale) {
    renderManualSaleReadonly(section, manualSale, purchase);
  } else {
    renderManualSaleForm(section, null);
  }
}

function renderManualSaleReadonly(section, sale, purchase) {
  section.innerHTML = "<h2>Verkauf außerhalb eBay</h2>";
  const readonly = document.createElement("div");
  readonly.className = "manual-sale-readonly";
  const dl = document.createElement("dl");
  const rows = [
    ["Kanal", sale.channel || ""],
    ["Verkauft am", formatDate(sale.sale_date)],
    ["Verkaufspreis", fmtEuro(sale.gross_price)],
    ["Versand erhalten", fmtEuro(sale.shipping_charged)],
  ];
  if (sale.refunded) rows.push(["Status", "↩ Rückerstattet"]);
  if (purchase && purchase.allocated_cost != null && sale.gross_price != null) {
    const cost = Number(purchase.allocated_cost);
    const refunded = Boolean(sale.refunded);
    const grossPrice = refunded ? 0 : Number(sale.gross_price || 0);
    const shippingCharged = refunded ? 0 : Number(sale.shipping_charged || 0);
    const shippingCost = Number(sale.shipping_cost || 0);
    const fees = Number(sale.fees || 0);
    const profit = grossPrice + shippingCharged - cost - shippingCost - fees;
    rows.push(["Gewinn", fmtEuro(profit)]);
    if (cost) {
      const marginPct = (profit / cost) * 100;
      let marginText = fmtPercent(marginPct);
      if (marginPct > OUTLIER_MARGIN_THRESHOLD) {
        marginText += " ⚠️ auffällig hoch – ggf. automatisch aufgeteilten Einstandspreis auf der Kaufseite prüfen";
      }
      rows.push(["Marge", marginText]);
    }
  }
  if (purchase && purchase.purchase_date && sale.sale_date) {
    const purchaseDate = new Date(purchase.purchase_date);
    const saleDate = new Date(sale.sale_date);
    const days = Math.round((saleDate - purchaseDate) / (24 * 60 * 60 * 1000));
    rows.push(["Liegedauer", `${days} Tag(e)`]);
  }
  for (const [label, value] of rows) {
    const dt = document.createElement("dt"); dt.textContent = label; dl.appendChild(dt);
    const dd = document.createElement("dd"); dd.textContent = value; dl.appendChild(dd);
  }
  readonly.appendChild(dl);
  section.appendChild(readonly);

  const actions = document.createElement("div");
  actions.className = "ebay-actions";

  const editBtn = document.createElement("button");
  editBtn.type = "button";
  editBtn.textContent = "Bearbeiten";
  editBtn.addEventListener("click", () => renderManualSaleForm(section, sale));
  actions.appendChild(editBtn);

  const deleteBtn = document.createElement("button");
  deleteBtn.type = "button";
  deleteBtn.textContent = "Verkauf löschen";
  deleteBtn.addEventListener("click", async () => {
    if (!confirm("Diesen manuellen Verkauf wirklich löschen?")) return;
    try {
      const res = await fetch(`/api/manual-sales/${encodeURIComponent(sale.id)}`, { method: "DELETE" });
      if (!res.ok && res.status !== 204) {
        const body = await res.json();
        alert("Fehler: " + (body.detail || res.statusText));
        return;
      }
      showToast("Verkauf gelöscht.");
      loadCard();
    } catch (err) {
      alert("Fehler: " + err);
    }
  });
  actions.appendChild(deleteBtn);
  section.appendChild(actions);
}

function renderManualSaleForm(section, existingSale) {
  section.innerHTML = "<h2>Verkauf außerhalb eBay</h2>";
  const form = document.createElement("form");
  form.className = "manual-sale-form";

  function field(label, name, value, type = "text", step) {
    const wrapper = document.createElement("label");
    wrapper.textContent = label;
    const input = document.createElement("input");
    input.type = type;
    if (step) input.step = step;
    input.name = name;
    input.value = value ?? "";
    wrapper.appendChild(input);
    form.appendChild(wrapper);
    return input;
  }

  const channelWrapper = document.createElement("label");
  channelWrapper.textContent = "Kanal";
  const channelSelect = document.createElement("select");
  channelSelect.name = "channel";
  for (const value of ["Kleinanzeigen", "Vinted", "Sonstiges"]) {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = value;
    if ((existingSale?.channel || "Kleinanzeigen") === value) option.selected = true;
    channelSelect.appendChild(option);
  }
  channelWrapper.appendChild(channelSelect);
  form.appendChild(channelWrapper);

  field(
    "Verkaufsdatum", "sale_date",
    existingSale?.sale_date ? existingSale.sale_date.slice(0, 10) : new Date().toISOString().slice(0, 10),
    "date"
  );
  // step="0.01" statt des Zahlen-Defaults (Ganzzahl-Schritte) - sonst lehnen
  // manche Browser Cent-Betraege wie 0,50 als "ungueltigen Wert" ab.
  field("Verkaufspreis (€)", "gross_price", existingSale?.gross_price, "number", "0.01");
  field("Versand erhalten (€)", "shipping_charged", existingSale?.shipping_charged, "number", "0.01");
  field("Versand-Kosten (€)", "shipping_cost", existingSale?.shipping_cost, "number", "0.01");
  field("Gebühren (€)", "fees", existingSale?.fees, "number", "0.01");
  field("Notizen", "notes", existingSale?.notes);

  const refundedWrapper = document.createElement("label");
  refundedWrapper.className = "checkbox-field";
  const refundedCheckbox = document.createElement("input");
  refundedCheckbox.type = "checkbox";
  refundedCheckbox.checked = Boolean(existingSale?.refunded);
  refundedWrapper.append(refundedCheckbox, " Als Rückerstattung/Retoure markieren");
  form.appendChild(refundedWrapper);

  const actions = document.createElement("div");
  actions.className = "actions";
  const saveBtn = document.createElement("button");
  saveBtn.type = "submit";
  saveBtn.textContent = existingSale ? "Speichern" : "Verkauf erfassen";
  actions.appendChild(saveBtn);

  if (existingSale) {
    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.textContent = "Abbrechen";
    cancelBtn.addEventListener("click", () => loadCard());
    actions.appendChild(cancelBtn);
  }

  const statusEl = document.createElement("span");
  actions.appendChild(statusEl);
  form.appendChild(actions);
  section.appendChild(form);

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const fields = {
      channel: form.elements.channel.value,
      sale_date: form.elements.sale_date.value,
      gross_price: form.elements.gross_price.value,
      shipping_charged: form.elements.shipping_charged.value,
      shipping_cost: form.elements.shipping_cost.value,
      fees: form.elements.fees.value,
      notes: form.elements.notes.value,
      refunded: refundedCheckbox.checked,
    };
    statusEl.textContent = "Speichert …";
    statusEl.className = "";
    try {
      const url = existingSale
        ? `/api/manual-sales/${encodeURIComponent(existingSale.id)}`
        : `/api/cards/${encodeURIComponent(cardId)}/manual-sale`;
      const res = await fetch(url, {
        method: existingSale ? "PATCH" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(fields),
      });
      const body = await res.json();
      if (!res.ok) {
        statusEl.textContent = "Fehler: " + (body.detail || res.statusText);
        statusEl.className = "error";
        showToast("Fehler: " + (body.detail || res.statusText), true);
        return;
      }
      showToast(existingSale ? "Verkauf gespeichert." : "Verkauf erfasst.");
      loadCard();
    } catch (err) {
      statusEl.textContent = "Fehler: " + err;
      statusEl.className = "error";
      showToast("Fehler: " + err, true);
    }
  });
}

function renderPriceResearchSection(entries, cardTitle, listingPrice) {
  const section = document.getElementById("price-research-section");
  section.innerHTML = "<h2>Preisrecherche-Verlauf</h2>";

  // Preis-Alarm: warnt in beide Richtungen, wenn der eigene Angebotspreis um
  // mindestens 20% vom Durchschnitt der erfassten Preisrecherche-Einträge
  // abweicht - sowohl "zu teuer" (verkauft sich schlecht) als auch "zu
  // billig" (Geld liegen gelassen) sind für den Verkäufer relevant.
  const knownPrices = (entries || [])
    .map((entry) => Number(entry.price))
    .filter((price) => Number.isFinite(price) && price > 0);
  if (listingPrice != null && knownPrices.length) {
    const avg = knownPrices.reduce((sum, price) => sum + price, 0) / knownPrices.length;
    const diffPct = ((Number(listingPrice) - avg) / avg) * 100;
    if (avg > 0 && Math.abs(diffPct) >= 20) {
      const alertP = document.createElement("p");
      alertP.className = "price-alert";
      const direction = diffPct > 0 ? "über" : "unter";
      alertP.textContent =
        `⚠ Angebotspreis (${fmtEuro(listingPrice)}) liegt ${Math.abs(diffPct).toFixed(0)}% ${direction} ` +
        `dem Marktdurchschnitt (${fmtEuro(avg)}).`;
      section.appendChild(alertP);
    }
  }

  if (entries && entries.length) {
    const table = document.createElement("table");
    table.className = "price-research-table";
    const thead = document.createElement("tr");
    for (const label of ["Datum", "Preis", "Notiz", ""]) {
      const th = document.createElement("th");
      th.textContent = label;
      thead.appendChild(th);
    }
    table.appendChild(thead);
    for (const entry of entries) {
      const tr = document.createElement("tr");
      const dateTd = document.createElement("td");
      dateTd.textContent = formatDate(entry.checked_at);
      tr.appendChild(dateTd);
      const priceTd = document.createElement("td");
      priceTd.textContent = fmtEuro(entry.price);
      tr.appendChild(priceTd);
      const noteTd = document.createElement("td");
      noteTd.textContent = entry.note || "";
      tr.appendChild(noteTd);
      const actionsTd = document.createElement("td");
      const deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.textContent = "Löschen";
      deleteBtn.addEventListener("click", async () => {
        if (!confirm("Diesen Preisrecherche-Eintrag wirklich löschen?")) return;
        try {
          const res = await fetch(`/api/price-research/${encodeURIComponent(entry.id)}`, { method: "DELETE" });
          if (!res.ok && res.status !== 204) {
            const body = await res.json();
            alert("Fehler: " + (body.detail || res.statusText));
            return;
          }
          showToast("Preisrecherche-Eintrag gelöscht.");
          loadCard();
        } catch (err) {
          alert("Fehler: " + err);
        }
      });
      actionsTd.appendChild(deleteBtn);
      tr.appendChild(actionsTd);
      table.appendChild(tr);
    }
    section.appendChild(table);
  } else {
    const emptyP = document.createElement("p");
    emptyP.textContent = "Noch keine Preisrecherche erfasst.";
    section.appendChild(emptyP);
  }

  const form = document.createElement("div");
  form.className = "price-research-form";

  const dateWrapper = document.createElement("label");
  dateWrapper.textContent = "Datum";
  const dateInput = document.createElement("input");
  dateInput.type = "date";
  dateInput.value = new Date().toISOString().slice(0, 10);
  dateWrapper.appendChild(dateInput);
  form.appendChild(dateWrapper);

  const priceWrapper = document.createElement("label");
  priceWrapper.textContent = "Preis";
  const priceInput = document.createElement("input");
  priceInput.type = "number";
  priceInput.step = "0.01";
  priceWrapper.appendChild(priceInput);
  form.appendChild(priceWrapper);

  const noteWrapper = document.createElement("label");
  noteWrapper.className = "note-field";
  noteWrapper.textContent = "Notiz";
  const noteInput = document.createElement("input");
  noteInput.type = "text";
  noteInput.placeholder = "z.B. eBay verkaufte Artikel";
  noteWrapper.appendChild(noteInput);
  form.appendChild(noteWrapper);

  const statusEl = document.createElement("span");
  const addBtn = document.createElement("button");
  addBtn.type = "button";
  addBtn.textContent = "Hinzufügen";
  addBtn.addEventListener("click", async () => {
    if (!priceInput.value) {
      statusEl.textContent = "Bitte einen Preis eingeben.";
      statusEl.className = "error";
      return;
    }
    statusEl.textContent = "Speichert …";
    statusEl.className = "";
    try {
      const res = await fetch(`/api/cards/${encodeURIComponent(cardId)}/price-research`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ price: priceInput.value, note: noteInput.value, checked_at: dateInput.value }),
      });
      const body = await res.json();
      if (!res.ok) {
        statusEl.textContent = "Fehler: " + (body.detail || res.statusText);
        statusEl.className = "error";
        showToast("Fehler: " + (body.detail || res.statusText), true);
        return;
      }
      showToast("Preisrecherche-Eintrag hinzugefügt.");
      loadCard();
    } catch (err) {
      statusEl.textContent = "Fehler: " + err;
      statusEl.className = "error";
      showToast("Fehler: " + err, true);
    }
  });
  form.appendChild(addBtn);
  form.appendChild(statusEl);

  // Automatische Preisrecherche ueber aktive eBay-Angebote (Buy/Browse API) -
  // bewusst KEINE verkauften Artikel (die dafuer noetige Marketplace-
  // Insights-API braucht eine gesonderte eBay-Freigabe). Ein Treffer
  // uebernehmen befuellt nur das Formular oben, gespeichert wird weiterhin
  // erst per Klick auf "Hinzufügen" - der Mensch behaelt die Kontrolle.
  const searchWrapper = document.createElement("div");
  searchWrapper.className = "price-research-search";
  const searchInput = document.createElement("input");
  searchInput.type = "text";
  searchInput.value = cardTitle || "";
  searchInput.placeholder = "Suchbegriff für eBay-Preisrecherche";
  const searchBtn = document.createElement("button");
  searchBtn.type = "button";
  searchBtn.textContent = "eBay-Preise suchen (aktive Angebote)";
  const searchStatus = document.createElement("span");
  const resultsList = document.createElement("ul");
  resultsList.className = "price-research-results";

  searchBtn.addEventListener("click", async () => {
    const q = searchInput.value.trim();
    if (!q) return;
    searchBtn.disabled = true;
    searchStatus.textContent = "Sucht …";
    searchStatus.className = "";
    resultsList.innerHTML = "";
    try {
      const res = await fetch(`/api/ebay/price-research?q=${encodeURIComponent(q)}`);
      const body = await res.json();
      if (!res.ok) {
        searchStatus.textContent = "Fehler: " + (body.detail || res.statusText);
        searchStatus.className = "error";
        return;
      }
      searchStatus.textContent = body.results.length ? "" : "Keine aktiven Angebote gefunden.";
      for (const item of body.results) {
        const li = document.createElement("li");
        const link = document.createElement("a");
        link.href = item.item_web_url;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = `${item.title} – ${item.price != null ? fmtEuro(item.price) : "?"}`;
        li.appendChild(link);
        const useBtn = document.createElement("button");
        useBtn.type = "button";
        useBtn.textContent = "Übernehmen";
        useBtn.addEventListener("click", () => {
          if (item.price != null) priceInput.value = item.price.toFixed(2);
          noteInput.value = "Aktives eBay-Angebot: " + item.title;
        });
        li.appendChild(useBtn);
        resultsList.appendChild(li);
      }
    } catch (err) {
      searchStatus.textContent = "Fehler: " + err;
      searchStatus.className = "error";
    } finally {
      searchBtn.disabled = false;
    }
  });

  searchWrapper.append(searchInput, searchBtn, searchStatus, resultsList);
  section.appendChild(searchWrapper);
  section.appendChild(form);
}

async function renderEbaySection(listing, purchase, sale) {
  const section = document.getElementById("ebay-section");
  section.innerHTML = "<h2>eBay</h2>";

  if (!listing) {
    renderEbayCreateForm(section);
    return;
  }

  // Reiner Hinweis, kein technischer Zwang (bewusste Entscheidung) - eine
  // Karte kann auch ohne Kauf-Verknuepfung veroeffentlicht/verkauft werden,
  // aber dann fehlen spaeter Einstandspreis/Gewinn in den Statistiken.
  if (!purchase && (listing.status === "Geplant" || listing.status === "Veroeffentlicht" || listing.status === "Verkauft")) {
    const hint = document.createElement("p");
    hint.className = "workflow-hint";
    hint.textContent = "Hinweis: Diese Karte ist noch keinem Kauf zugeordnet (siehe Abschnitt „Kauf“ oben).";
    section.appendChild(hint);
  }

  const badge = document.createElement("span");
  badge.className = "ebay-status-badge ebay-status-" + listing.status;
  badge.textContent = EBAY_STATUS_LABELS[listing.status] || listing.status;
  section.appendChild(badge);

  if (listing.status === "Entwurf" || listing.status === "Fehler") {
    if (listing.status === "Fehler" && listing.last_error) {
      const err = document.createElement("p");
      err.className = "error";
      err.textContent = listing.last_error;
      section.appendChild(err);
    }
    renderEbayEditForm(section, listing, purchase);
  } else if (listing.status === "Geplant") {
    const environment = await getEbayEnvironment();
    renderEbayScheduledView(section, listing, environment);
  } else {
    const environment = await getEbayEnvironment();
    renderEbayPublishedView(section, listing, environment, purchase, sale);
  }
}

function renderEbayCreateForm(section) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.textContent = "eBay-Angebot erstellen";
  const statusEl = document.createElement("span");
  statusEl.style.marginLeft = "0.6rem";
  section.appendChild(btn);
  section.appendChild(statusEl);

  btn.addEventListener("click", async () => {
    btn.disabled = true;
    statusEl.textContent = "Erstellt Vorschlag …";
    try {
      const res = await fetch(`/api/cards/${encodeURIComponent(cardId)}/ebay-listing`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({}),
      });
      const body = await res.json();
      if (!res.ok) {
        statusEl.textContent = "Fehler: " + (body.detail || res.statusText);
        statusEl.className = "error";
        showToast("Fehler: " + (body.detail || res.statusText), true);
        btn.disabled = false;
        return;
      }
      showToast("eBay-Angebot erstellt.");

      btn.disabled = false;
    }
  });
}

function renderEbayEditForm(section, listing, purchase) {
  const form = document.createElement("form");
  form.className = "ebay-form";

  function field(label, name, value, type = "text", step) {
    const wrapper = document.createElement("label");
    wrapper.textContent = label;
    const input = document.createElement(type === "textarea" ? "textarea" : "input");
    if (type !== "textarea") input.type = type;
    if (step) input.step = step;
    input.name = name;
    input.value = value ?? "";
    wrapper.appendChild(input);
    form.appendChild(wrapper);
    return input;
  }

  if (listing.sku) {
    const skuP = document.createElement("p");
    skuP.textContent = "SKU: " + listing.sku;
    form.appendChild(skuP);
  }

  const titleInput = field("Titel", "title", listing.title);
  field("Beschreibung (HTML)", "description", listing.description, "textarea");
  // step="0.01" statt des Zahlen-Defaults (Ganzzahl-Schritte) - sonst
  // lehnen manche Browser Cent-Betraege wie 0,50 als "ungueltigen Wert" ab.
  const priceInputEl = field("Preis (€)", "price", listing.price, "number", "0.01");
  field("Menge", "quantity", listing.quantity ?? 1, "number");

  // Einfacher Preisrechner: Zielmarge -> Preisvorschlag aus dem
  // Einstandspreis, nur anzeigbar wenn die Karte ueberhaupt einen
  // (automatisch aufgeteilten oder manuell gesetzten) Einstandspreis hat.
  if (purchase && purchase.allocated_cost != null) {
    const cost = Number(purchase.allocated_cost);
    const calcWrapper = document.createElement("div");
    calcWrapper.className = "price-calc";

    const hint = document.createElement("span");
    hint.className = "price-calc-hint";
    hint.textContent = `Einstandspreis: ${fmtEuro(cost)}`;
    calcWrapper.appendChild(hint);

    const marginLabel = document.createElement("label");
    marginLabel.textContent = "Zielmarge (%)";
    const marginInput = document.createElement("input");
    marginInput.type = "number";
    marginInput.step = "1";
    marginInput.placeholder = "z.B. 50";
    marginLabel.appendChild(marginInput);
    calcWrapper.appendChild(marginLabel);

    const suggestBtn = document.createElement("button");
    suggestBtn.type = "button";
    suggestBtn.textContent = "Preis übernehmen";
    suggestBtn.addEventListener("click", () => {
      if (marginInput.value === "") return;
      const suggested = cost * (1 + Number(marginInput.value) / 100);
      priceInputEl.value = suggested.toFixed(2);
    });
    calcWrapper.appendChild(suggestBtn);

    form.appendChild(calcWrapper);
  }

  const typeWrapper = document.createElement("label");
  typeWrapper.textContent = "Kartentyp";
  const typeSelect = document.createElement("select");
  typeSelect.name = "listing_type";
  for (const [value, label] of [["sport", "Sport"], ["non_sport", "Non-Sport"]]) {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = label;
    if (listing.listing_type === value) option.selected = true;
    typeSelect.appendChild(option);
  }
  typeWrapper.appendChild(typeSelect);
  form.appendChild(typeWrapper);

  const conditionWrapper = document.createElement("label");
  conditionWrapper.textContent = "Zustand";
  const conditionSelect = document.createElement("select");
  conditionSelect.name = "condition";
  for (const [value, label] of [
    ["NM", "Neuwertig / Near Mint or Better (NM)"],
    ["EX", "Sehr gut / Excellent (EX)"],
    ["VG", "Gut / Very Good (VG)"],
    ["G", "Befriedigend / Poor (G)"],
  ]) {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = label;
    if ((listing.condition || "NM") === value) option.selected = true;
    conditionSelect.appendChild(option);
  }
  conditionWrapper.appendChild(conditionSelect);
  form.appendChild(conditionWrapper);

  // "Gegradet" (PSA/BGS/...) replaces the plain Zustand-Dropdown with
  // Gutachter+Note - eBay wants different Condition Descriptors for
  // graded vs. ungraded cards (see ebay_client.condition_descriptors()).
  const gradedWrapper = document.createElement("label");
  const gradedCheckbox = document.createElement("input");
  gradedCheckbox.type = "checkbox";
  gradedCheckbox.name = "is_graded";
  gradedCheckbox.checked = listing.condition_id === "2750";
  gradedWrapper.append(gradedCheckbox, " Gegradete Karte (PSA/BGS/...)");
  form.appendChild(gradedWrapper);

  const graderWrapper = document.createElement("label");
  graderWrapper.textContent = "Gutachter";
  const graderSelect = document.createElement("select");
  graderSelect.name = "grader";
  for (const value of ["PSA", "BGS", "SGC", "CGC", "HGA", "Sonstige"]) {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = value;
    if (listing.grader === value) option.selected = true;
    graderSelect.appendChild(option);
  }
  graderWrapper.appendChild(graderSelect);
  form.appendChild(graderWrapper);

  const gradeInput = field("Note (z. B. 9.5)", "grade", listing.grade);

  function updateGradedVisibility() {
    const graded = gradedCheckbox.checked;
    conditionWrapper.hidden = graded;
    graderWrapper.hidden = !graded;
    gradeInput.closest("label").hidden = !graded;
  }
  gradedCheckbox.addEventListener("change", updateGradedVisibility);
  updateGradedVisibility();

  const priceLinksP = document.createElement("p");
  priceLinksP.className = "price-research-links";
  form.appendChild(priceLinksP);
  function updatePriceLinks() {
    const links = priceResearchLinks(titleInput.value);
    priceLinksP.innerHTML = "";
    const a1 = document.createElement("a");
    a1.href = links.ebaySold; a1.target = "_blank"; a1.rel = "noopener";
    a1.textContent = "eBay verkaufte Artikel";
    const a2 = document.createElement("a");
    a2.href = links.onepoint; a2.target = "_blank"; a2.rel = "noopener";
    a2.textContent = "130point.com";
    priceLinksP.append("Preis recherchieren: ", a1, " · ", a2);
  }
  titleInput.addEventListener("input", updatePriceLinks);
  updatePriceLinks();

  const aspectsWrapper = document.createElement("div");
  aspectsWrapper.className = "ebay-aspects";
  const aspectsTitle = document.createElement("strong");
  aspectsTitle.textContent = "Aspects (eBay-Pflichtfelder je Kartentyp)";
  aspectsWrapper.appendChild(aspectsTitle);
  const aspectEntries = Object.entries(listing.aspects || {});
  for (const [key, values] of aspectEntries) {
    const wrapper = document.createElement("label");
    wrapper.textContent = key;
    const input = document.createElement("input");
    input.type = "text";
    input.dataset.aspectKey = key;
    input.value = (values || []).join(", ");
    wrapper.appendChild(input);
    aspectsWrapper.appendChild(wrapper);
  }
  form.appendChild(aspectsWrapper);

  const scheduleWrapper = document.createElement("label");
  scheduleWrapper.textContent = "Veröffentlichen am (optional)";
  const scheduleInput = document.createElement("input");
  scheduleInput.type = "datetime-local";
  scheduleInput.id = "ebay-schedule-at";
  scheduleWrapper.appendChild(scheduleInput);
  form.appendChild(scheduleWrapper);

  const actions = document.createElement("div");
  actions.className = "ebay-actions";

  const saveBtn = document.createElement("button");
  saveBtn.type = "button";
  saveBtn.textContent = listing.id ? "Speichern" : "Als Entwurf speichern";
  actions.appendChild(saveBtn);

  const publishBtn = document.createElement("button");
  publishBtn.type = "button";
  publishBtn.textContent = "Veröffentlichen";
  scheduleInput.addEventListener("input", () => {
    publishBtn.textContent = scheduleInput.value ? "Planen" : "Veröffentlichen";
  });
  actions.appendChild(publishBtn);

  if (listing.id) {
    const deleteBtn = document.createElement("button");
    deleteBtn.type = "button";
    deleteBtn.textContent = "Entwurf löschen";
    deleteBtn.addEventListener("click", async () => {
      if (!confirm("Diesen eBay-Entwurf wirklich löschen?")) return;
      try {
        const res = await fetch(`/api/ebay/listings/${encodeURIComponent(listing.id)}`, { method: "DELETE" });
        if (!res.ok && res.status !== 204) {
          const body = await res.json();
          alert("Fehler: " + (body.detail || res.statusText));
          return;
        }
        showToast("eBay-Entwurf gelöscht.");
        loadCard();
      } catch (err) {
        alert("Fehler: " + err);
      }
    });
    actions.appendChild(deleteBtn);
  }

  const statusEl = document.createElement("span");
  actions.appendChild(statusEl);
  form.appendChild(actions);
  section.appendChild(form);

  function collectFields() {
    const aspects = {};
    for (const input of form.querySelectorAll("[data-aspect-key]")) {
      const values = input.value.split(",").map((v) => v.trim()).filter(Boolean);
      if (values.length) aspects[input.dataset.aspectKey] = values;
    }
    const isGraded = form.elements.is_graded.checked;
    return {
      title: form.elements.title.value,
      description: form.elements.description.value,
      price: form.elements.price.value,
      quantity: form.elements.quantity.value,
      listing_type: form.elements.listing_type.value,
      condition: form.elements.condition.value,
      condition_id: isGraded ? "2750" : "4000",
      grader: isGraded ? form.elements.grader.value : "",
      grade: isGraded ? form.elements.grade.value : "",
      aspects,
    };
  }

  async function saveDraft() {
    statusEl.textContent = "Speichert …";
    statusEl.className = "";
    try {
      const url = listing.id
        ? `/api/ebay/listings/${encodeURIComponent(listing.id)}`
        : `/api/cards/${encodeURIComponent(cardId)}/ebay-listing`;
      const res = await fetch(url, {
        method: listing.id ? "PATCH" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(collectFields()),
      });
      const body = await res.json();
      if (!res.ok) {
        statusEl.textContent = "Fehler: " + (body.detail || res.statusText);
        statusEl.className = "error";
        showToast("Fehler: " + (body.detail || res.statusText), true);
        return null;
      }
      return body;
    } catch (err) {
      statusEl.textContent = "Fehler: " + err;
      statusEl.className = "error";
      showToast("Fehler: " + err, true);
      return null;
    }
  }

  saveBtn.addEventListener("click", async () => {
    const saved = await saveDraft();
    if (saved) {
      showToast("eBay-Entwurf gespeichert.");
      loadCard();
    }
  });

  publishBtn.addEventListener("click", async () => {
    const saved = await saveDraft();
    if (!saved) return;
    statusEl.textContent = "Veröffentlicht …";
    statusEl.className = "";
    try {
      const publishBody = scheduleInput.value
        ? { scheduled_at: new Date(scheduleInput.value).toISOString() }
        : {};
      const res = await fetch(`/api/ebay/listings/${encodeURIComponent(saved.id)}/publish`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(publishBody),
      });
      const body = await res.json();
      if (!res.ok) {
        statusEl.textContent = "Fehler: " + (body.detail || res.statusText);
        statusEl.className = "error";
        showToast("Fehler: " + (body.detail || res.statusText), true);
        return;
      }
      showToast(scheduleInput.value ? "eBay-Angebot geplant." : "eBay-Angebot veröffentlicht.");
      loadCard();
    } catch (err) {
      statusEl.textContent = "Fehler: " + err;
      statusEl.className = "error";
      showToast("Fehler: " + err, true);
    }
  });
}

function renderEbayScheduledView(section, listing, environment) {
  const readonly = document.createElement("div");
  readonly.className = "ebay-readonly";
  const scheduledDate = formatDateTime(listing.scheduled_at);
  const dl = document.createElement("dl");
  const rows = [["SKU", listing.sku], ["Geplant für", scheduledDate], ["Titel", listing.title], ["Preis", fmtEuro(listing.price)]];
  for (const [label, value] of rows) {
    const dt = document.createElement("dt"); dt.textContent = label; dl.appendChild(dt);
    const dd = document.createElement("dd"); dd.textContent = value || ""; dl.appendChild(dd);
  }
  readonly.appendChild(dl);

  const hint = document.createElement("p");
  if (listing.scheduling_mode === "native" && listing.ebay_listing_id) {
    const a = document.createElement("a");
    a.href = ebayListingUrl(listing, environment);
    a.target = "_blank"; a.rel = "noopener";
    a.textContent = "Auf eBay ansehen";
    hint.appendChild(a);
  } else {
    hint.textContent = "Wird erst zum geplanten Zeitpunkt bei eBay angelegt - vorher dort nicht einsehbar.";
  }
  readonly.appendChild(hint);
  section.appendChild(readonly);

  const actions = document.createElement("div");
  actions.className = "ebay-actions";

  const publishNowBtn = document.createElement("button");
  publishNowBtn.type = "button";
  publishNowBtn.textContent = "Jetzt sofort veröffentlichen";
  publishNowBtn.addEventListener("click", async () => {
    try {
      const res = await fetch(`/api/ebay/listings/${encodeURIComponent(listing.id)}/publish`, { method: "POST" });
      const body = await res.json();
      if (!res.ok) {
        alert("Fehler: " + (body.detail || res.statusText));
        return;
      }
      showToast("eBay-Angebot veröffentlicht.");
      loadCard();
    } catch (err) {
      alert("Fehler: " + err);
    }
  });
  actions.appendChild(publishNowBtn);

  const unscheduleBtn = document.createElement("button");
  unscheduleBtn.type = "button";
  unscheduleBtn.textContent = "Planung stornieren";
  unscheduleBtn.addEventListener("click", async () => {
    if (!confirm("Geplante Veröffentlichung wirklich stornieren?")) return;
    try {
      const res = await fetch(`/api/ebay/listings/${encodeURIComponent(listing.id)}/unschedule`, { method: "POST" });
      const body = await res.json();
      if (!res.ok) {
        alert("Fehler: " + (body.detail || res.statusText));
        return;
      }
      showToast("Planung storniert.");
      loadCard();
    } catch (err) {
      alert("Fehler: " + err);
    }
  });
  actions.appendChild(unscheduleBtn);
  section.appendChild(actions);
}

// "Kürzlich aktualisiert" ist bewusst an published_at aufgehaengt statt an
// einem eigenen Feld: das Bearbeiten eines bereits veroeffentlichten
// Angebots stoesst in update_ebay_listing() sofort einen Re-Publish an, der
// published_at neu setzt (main.py, _publish_listing()) - der Zeitstempel
// spiegelt also schon "zuletzt zu eBay geschickt" wider, egal ob das die
// Erstveroeffentlichung oder eine spaetere Bearbeitung war.
const RECENTLY_UPDATED_WINDOW_MS = 3 * 24 * 60 * 60 * 1000;

function renderEbayPublishedView(section, listing, environment, purchase, sale) {
  const readonly = document.createElement("div");
  readonly.className = "ebay-readonly";
  const dl = document.createElement("dl");
  const rows = [["SKU", listing.sku], ["Titel", listing.title], ["Preis", fmtEuro(listing.price)], ["Zustand", listing.condition]];
  for (const [label, value] of rows) {
    const dt = document.createElement("dt"); dt.textContent = label; dl.appendChild(dt);
    const dd = document.createElement("dd"); dd.textContent = value || ""; dl.appendChild(dd);
  }
  readonly.appendChild(dl);

  if (listing.published_at) {
    const updatedP = document.createElement("p");
    const isRecent = Date.now() - new Date(listing.published_at).getTime() <= RECENTLY_UPDATED_WINDOW_MS;
    updatedP.textContent = `Zuletzt aktualisiert: ${formatDateTime(listing.published_at)}`
      + (isRecent ? " 🕓 kürzlich geändert" : "");
    readonly.appendChild(updatedP);
  }

  if (listing.ebay_listing_id) {
    const a = document.createElement("a");
    a.href = ebayListingUrl(listing, environment);
    a.target = "_blank"; a.rel = "noopener";
    a.textContent = "Auf eBay ansehen";
    readonly.appendChild(a);
  }
  section.appendChild(readonly);

  if (listing.status === "Verkauft" && sale) {
    section.appendChild(renderSaleStats(purchase, sale));
  }

  if (listing.status === "Veroeffentlicht") {
    const editBtn = document.createElement("button");
    editBtn.type = "button";
    editBtn.textContent = "Bearbeiten";
    editBtn.addEventListener("click", () => renderEbayEditForm(section, listing));
    section.appendChild(editBtn);
  }
}

// WE-Datum (Wareneingang) = Kaufdatum, WA-Datum (Warenausgang) = Verkaufs-
// datum - Liegedauer/Marge werden nur angezeigt, wenn beide Seiten
// (Kauf-Verknuepfung UND Verkauf) tatsaechlich vorliegen.
function renderSaleStats(purchase, sale) {
  const dl = document.createElement("dl");
  const saleDate = sale.sale_date ? new Date(sale.sale_date) : null;
  // Versand als durchlaufender Posten: eingenommener Versand (automatisch
  // aus der eBay-Bestellung) zaehlt als Einnahme, das tatsaechlich gezahlte
  // Porto (manuell, s.u.) als Ausgabe - decken sie sich, heben sie sich im
  // Gewinn gegenseitig auf; nur eine Differenz wirkt sich aus. Gleiche
  // Formel wie im /api/statistics-Endpunkt.
  // Retoure: Verkaufspreis/erhaltener Versand gingen an den Kaeufer zurueck
  // und zaehlen daher nicht mehr als Einnahme - Einstandspreis, gezahltes
  // Porto und eBay-Gebuehren bleiben aber ein Verlust, da eBay diese i.d.R.
  // nicht erstattet. Gleiche Formel wie main.py's _compute_statistics().
  const refunded = Boolean(sale.refunded);
  const shippingCharged = refunded ? 0 : Number(sale.shipping_charged || 0);
  const shippingCost = Number(sale.shipping_cost || 0);
  const grossPrice = refunded ? 0 : Number(sale.gross_price || 0);
  // eBay-Verkaufsgebuehren - eBays Order-API (fuer den Sync genutzt) liefert
  // sie nicht mit, daher aktuell nur manuell erfassbar (s.u.), analog zu
  // shipping_cost. Faellt in den Gewinn mit rein, sobald eingetragen.
  const ebayFees = Number(sale.ebay_fees || 0);
  const rows = [
    ["Verkauft am (WA)", formatDate(sale.sale_date)],
    ["Verkaufspreis", fmtEuro(sale.gross_price)],
    ["Versand erhalten", fmtEuro(sale.shipping_charged)],
  ];
  if (refunded) rows.push(["Status", "↩ Rückerstattet"]);
  if (purchase && purchase.allocated_cost != null && sale.gross_price != null) {
    const cost = Number(purchase.allocated_cost);
    const profit = grossPrice + shippingCharged - cost - shippingCost - ebayFees;
    rows.push(["Gewinn", fmtEuro(profit)]);
    if (cost) {
      const marginPct = (profit / cost) * 100;
      let marginText = fmtPercent(marginPct);
      // Auffaellig hohe Marge deutet meist auf einen sehr klein automatisch
      // aufgeteilten Einstandspreis hin (Sammel-Kauf ueber viele Karten) -
      // rechnerisch korrekt, aber einen Hinweis wert (gleicher Schwellwert
      // wie statistics.html's Ausreisser-Markierung).
      if (marginPct > OUTLIER_MARGIN_THRESHOLD) {
        marginText += " ⚠️ auffällig hoch – ggf. automatisch aufgeteilten Einstandspreis auf der Kaufseite prüfen";
      }
      rows.push(["Marge", marginText]);
    }
  }
  if (purchase && purchase.purchase_date && saleDate) {
    const purchaseDate = new Date(purchase.purchase_date);
    const days = Math.round((saleDate - purchaseDate) / (24 * 60 * 60 * 1000));
    rows.push(["Liegedauer", `${days} Tag(e)`]);
  }
  const wrapper = document.createElement("div");
  wrapper.className = "ebay-readonly sale-stats";
  for (const [label, value] of rows) {
    const dt = document.createElement("dt"); dt.textContent = label; dl.appendChild(dt);
    const dd = document.createElement("dd"); dd.textContent = value; dl.appendChild(dd);
  }
  wrapper.appendChild(dl);

  const shippingCostP = document.createElement("p");
  shippingCostP.className = "fee-input-row";
  const shippingCostLabel = document.createElement("label");
  shippingCostLabel.textContent = "Versand-Kosten (Porto) ";
  const shippingCostInput = document.createElement("input");
  shippingCostInput.type = "number";
  shippingCostInput.step = "0.01";
  shippingCostInput.value = sale.shipping_cost ?? 0;
  shippingCostLabel.appendChild(shippingCostInput);
  shippingCostP.appendChild(shippingCostLabel);
  shippingCostP.appendChild(document.createTextNode(" €"));
  wrapper.appendChild(shippingCostP);

  // eBay zieht bei einem Verkauf ueblicherweise eine Verkaufsgebuehr (aktuell
  // ~10-13 % vom Verkaufspreis) ab, die die Order-API nicht mitliefert -
  // daher manuell erfassbar, analog zu Versand-Kosten oben. Ohne Eintrag
  // (0) bleibt der Gewinn wie bisher unveraendert.
  const ebayFeesP = document.createElement("p");
  ebayFeesP.className = "fee-input-row";
  const ebayFeesLabel = document.createElement("label");
  ebayFeesLabel.textContent = "eBay-Gebühren ";
  const ebayFeesInput = document.createElement("input");
  ebayFeesInput.type = "number";
  ebayFeesInput.step = "0.01";
  ebayFeesInput.value = sale.ebay_fees ?? 0;
  ebayFeesLabel.appendChild(ebayFeesInput);
  ebayFeesP.appendChild(ebayFeesLabel);
  ebayFeesP.appendChild(document.createTextNode(" €"));
  wrapper.appendChild(ebayFeesP);

  // Retoure: Kaeufer hat den Verkauf zurueckgeschickt/erstattet bekommen -
  // Verkaufspreis/Versand zaehlen dann nicht mehr als Umsatz im Gewinn
  // (s.o.), Einstandspreis/Porto/eBay-Gebuehren bleiben ein Verlust.
  const refundedWrapper = document.createElement("label");
  refundedWrapper.className = "checkbox-field";
  const refundedCheckbox = document.createElement("input");
  refundedCheckbox.type = "checkbox";
  refundedCheckbox.checked = Boolean(sale.refunded);
  refundedWrapper.append(refundedCheckbox, " Als Rückerstattung/Retoure markieren");
  wrapper.appendChild(refundedWrapper);

  const saveShippingBtn = document.createElement("button");
  saveShippingBtn.type = "button";
  saveShippingBtn.textContent = "Speichern";
  const shippingStatus = document.createElement("span");
  saveShippingBtn.addEventListener("click", async () => {
    shippingStatus.textContent = "Speichert …";
    shippingStatus.className = "";
    try {
      const res = await fetch(`/api/ebay/sales/${encodeURIComponent(sale.id)}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          shipping_cost: shippingCostInput.value, ebay_fees: ebayFeesInput.value,
          refunded: refundedCheckbox.checked,
        }),
      });
      const body = await res.json();
      if (!res.ok) {
        shippingStatus.textContent = "Fehler: " + (body.detail || res.statusText);
        shippingStatus.className = "error";
        showToast("Fehler: " + (body.detail || res.statusText), true);
        return;
      }
      showToast("Verkaufsdaten gespeichert.");
      loadCard();
    } catch (err) {
      shippingStatus.textContent = "Fehler: " + err;
      shippingStatus.className = "error";
      showToast("Fehler: " + err, true);
    }
  });
  ebayFeesP.appendChild(saveShippingBtn);
  ebayFeesP.appendChild(shippingStatus);

  return wrapper;
}
</script>
