<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>DCardLabs – Karte bearbeiten</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  .images { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
  .image-block { flex: 1; display: flex; flex-direction: column; gap: 0.4rem; }
  .image-block img { width: 100%; border-radius: 6px; background: #f0f0f0; }
  .rotate-buttons { display: flex; gap: 0.4rem; }
  .rotate-buttons button { padding: 0.3rem 0.6rem; font-size: 0.9rem; }
  #prev-next-nav { display: flex; gap: 0.75rem; margin-bottom: 1rem; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  label { display: flex; flex-direction: column; font-size: 0.85rem; font-weight: 600; }
  input { font-weight: normal; padding: 0.4rem; margin-top: 0.2rem; }
  .actions { grid-column: 1 / -1; display: flex; gap: 0.75rem; margin-top: 1rem; }
  button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; }
  #delete-btn { background: #b00020; color: white; border: none; border-radius: 4px; }
  .error { color: #b00020; font-weight: 600; }
  .purchase-section { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #ddd; }
  .purchase-section h2 { font-size: 1.1rem; }
  .purchase-info { display: grid; grid-template-columns: auto 1fr; gap: 0.3rem 0.75rem; margin-bottom: 0.75rem; }
  .purchase-info dt { font-weight: 600; }
  .purchase-info dd { margin: 0; }
  .purchase-forms { display: flex; flex-direction: column; gap: 1rem; }
  .purchase-forms > div { border: 1px solid #ccc; border-radius: 6px; padding: 0.75rem; }
  .purchase-forms input, .purchase-forms select { padding: 0.3rem; margin-right: 0.4rem; }
</style>
</head>
<body>
  <h1>Karte bearbeiten</h1>
  <p><a href="cards.html">&larr; Zur Liste</a></p>
  <p id="prev-next-nav"></p>

  <div class="images">
    <div class="image-block">
      <img id="front-img" alt="Vorderseite">
      <div class="rotate-buttons">
        <button type="button" id="front-rotate-left">&#8634; Links</button>
        <button type="button" id="front-rotate-right">&#8635; Rechts</button>
      </div>
    </div>
    <div class="image-block">
      <img id="back-img" alt="Rückseite">
      <div class="rotate-buttons">
        <button type="button" id="back-rotate-left">&#8634; Links</button>
        <button type="button" id="back-rotate-right">&#8635; Rechts</button>
      </div>
    </div>
  </div>

  <form id="edit-form">
    <p id="load-status">Lädt …</p>
  </form>

  <div class="purchase-section" id="purchase-section"></div>

<script>
const FIELDS = [
  ["title", "Titel"], ["category", "Kategorie"], ["theme", "Thema"],
  ["team", "Team"], ["manufacturer", "Hersteller"], ["set_name", "Set"],
  ["season_year", "Saison"], ["card_type", "Typ"], ["variant", "Variante"],
  ["position", "Position"], ["squad_number", "Trikotnummer"],
  ["club_debut_season", "Debütsaison"], ["card_number", "Kartennr."],
  ["serial_number", "Seriennr."], ["print_run", "Auflage"],
];

function showError(container, message) {
  container.innerHTML = "";
  const p = document.createElement("p");
  p.className = "error";
  p.textContent = message;
  container.appendChild(p);
}

const params = new URLSearchParams(location.search);
const cardId = params.get("id");
const form = document.getElementById("edit-form");

if (!cardId) {
  showError(form, "Keine Karten-ID angegeben.");
} else {
  loadCard();
  renderPrevNextNav();
}

// Reads the ordered ID list cards.html stored for the current search/filter
// (see cards.html's render()) so "vorherige/nächste" can jump within that
// same order - no dedicated backend endpoint needed. Direct navigation to
// this page (no list ever loaded in this tab, or the ID isn't in the
// stored list) just renders no links.
function renderPrevNextNav() {
  const nav = document.getElementById("prev-next-nav");
  nav.innerHTML = "";
  let ids = [];
  try {
    ids = JSON.parse(sessionStorage.getItem("cardListIds") || "[]");
  } catch (err) {
    ids = [];
  }
  const index = ids.indexOf(cardId);
  if (index === -1) return;

  if (index > 0) {
    const prevLink = document.createElement("a");
    prevLink.href = `card.html?id=${encodeURIComponent(ids[index - 1])}`;
    prevLink.textContent = "← Vorherige";
    nav.appendChild(prevLink);
  }
  if (index < ids.length - 1) {
    const nextLink = document.createElement("a");
    nextLink.href = `card.html?id=${encodeURIComponent(ids[index + 1])}`;
    nextLink.textContent = "Nächste →";
    nav.appendChild(nextLink);
  }
}

async function rotateImage(side, degrees) {
  try {
    const res = await fetch(`/api/cards/${encodeURIComponent(cardId)}/rotate`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ side, degrees }),
    });
    const body = await res.json();
    if (!res.ok) {
      alert("Fehler beim Drehen: " + (body.detail || res.statusText));
      return;
    }
    // The signed URL's token differs on every response, but Supabase's
    // storage CDN can still serve a stale cached copy of the object bytes
    // for a short time after rotate_image() overwrites it - append a
    // cache-busting param so the browser always fetches the fresh image
    // instead of showing the same rotation again on the next click.
    if (side === "front" && body.front_image_url) {
      document.getElementById("front-img").src = body.front_image_url + "&_cb=" + Date.now();
    }
    if (side === "back" && body.back_image_url) {
      document.getElementById("back-img").src = body.back_image_url + "&_cb=" + Date.now();
    }
  } catch (err) {
    alert("Fehler beim Drehen: " + err);
  }
}

document.getElementById("front-rotate-left").addEventListener("click", () => rotateImage("front", 270));
document.getElementById("front-rotate-right").addEventListener("click", () => rotateImage("front", 90));
document.getElementById("back-rotate-left").addEventListener("click", () => rotateImage("back", 270));
document.getElementById("back-rotate-right").addEventListener("click", () => rotateImage("back", 90));

async function loadCard() {
  try {
    const res = await fetch(`/api/cards/${encodeURIComponent(cardId)}`);
    const card = await res.json();
    if (!res.ok) {
      showError(form, "Fehler: " + (card.detail || res.statusText));
      return;
    }
    render(card);
    renderPurchaseSection(card.purchase);
  } catch (err) {
    showError(form, "Fehler: " + err);
  }
}

function render(card) {
  const frontImg = document.getElementById("front-img");
  if (card.front_image_url) frontImg.src = card.front_image_url;
  const backImg = document.getElementById("back-img");
  if (card.back_image_url) backImg.src = card.back_image_url;

  form.innerHTML = "";
  for (const [key, label] of FIELDS) {
    const wrapper = document.createElement("label");
    wrapper.textContent = label;
    const input = document.createElement("input");
    input.type = "text";
    input.name = key;
    input.value = card[key] ?? "";
    wrapper.appendChild(input);
    form.appendChild(wrapper);
  }

  const statusWrapper = document.createElement("label");
  statusWrapper.textContent = "Status";
  const statusSelect = document.createElement("select");
  statusSelect.name = "recognition_status";
  const KNOWN_STATUSES = ["ok", "prüfen", "nicht erkannt"];
  const currentStatus = card.recognition_status || "";
  // A card can carry a status outside the three normal values (e.g.
  // "deaktiviert" or an AI-Erkennung-fehlgeschlagen error text from
  // recognize_card()) - add it as its own preselected option instead of
  // silently falling back to "ok" when the dropdown has no matching
  // <option>, which would overwrite that status on the next save even if
  // the user only meant to fix an unrelated field.
  const options = currentStatus && !KNOWN_STATUSES.includes(currentStatus)
    ? [currentStatus, ...KNOWN_STATUSES]
    : KNOWN_STATUSES;
  for (const value of options) {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = value;
    if (currentStatus === value) option.selected = true;
    statusSelect.appendChild(option);
  }
  statusWrapper.appendChild(statusSelect);
  form.appendChild(statusWrapper);

  const actions = document.createElement("div");
  actions.className = "actions";

  const saveBtn = document.createElement("button");
  saveBtn.type = "submit";
  saveBtn.textContent = "Speichern";
  actions.appendChild(saveBtn);

  const deleteBtn = document.createElement("button");
  deleteBtn.type = "button";
  deleteBtn.id = "delete-btn";
  deleteBtn.textContent = "Löschen";
  deleteBtn.addEventListener("click", onDelete);
  actions.appendChild(deleteBtn);

  form.appendChild(actions);

  const statusP = document.createElement("p");
  statusP.id = "save-status";
  form.appendChild(statusP);
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const fields = {};
  for (const [key] of FIELDS) {
    fields[key] = form.elements[key].value;
  }
  fields.recognition_status = form.elements["recognition_status"].value;
  const statusP = document.getElementById("save-status");
  statusP.textContent = "Speichert …";
  statusP.className = "";
  try {
    const res = await fetch(`/api/cards/${encodeURIComponent(cardId)}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(fields),
    });
    const body = await res.json();
    if (!res.ok) {
      statusP.textContent = "Fehler: " + (body.detail || res.statusText);
      statusP.className = "error";
      return;
    }
    statusP.textContent = "Gespeichert.";
  } catch (err) {
    statusP.textContent = "Fehler: " + err;
    statusP.className = "error";
  }
});

async function onDelete() {
  if (!confirm("Diese Karte wirklich löschen?")) return;
  try {
    const res = await fetch(`/api/cards/${encodeURIComponent(cardId)}`, { method: "DELETE" });
    if (!res.ok) {
      const body = await res.json();
      alert("Fehler beim Löschen: " + (body.detail || res.statusText));
      return;
    }
    location.href = "cards.html";
  } catch (err) {
    alert("Fehler beim Löschen: " + err);
  }
}

function renderPurchaseSection(purchase) {
  const section = document.getElementById("purchase-section");
  section.innerHTML = "<h2>Kauf</h2>";

  if (purchase) {
    const dl = document.createElement("dl");
    dl.className = "purchase-info";
    const rows = [
      ["Kaufdatum", purchase.purchase_date], ["Plattform", purchase.platform],
      ["Verkäufer", purchase.seller], ["Anteil-Preis", purchase.allocated_cost],
      ["Notizen", purchase.notes],
    ];
    for (const [label, value] of rows) {
      const dt = document.createElement("dt");
      dt.textContent = label;
      dl.appendChild(dt);
      const dd = document.createElement("dd");
      dd.textContent = value || "";
      dl.appendChild(dd);
    }
    section.appendChild(dl);

    const link = document.createElement("a");
    link.href = `purchase.html?id=${encodeURIComponent(purchase.purchase_id)}`;
    link.textContent = "Zum Kauf";
    section.appendChild(link);
    section.appendChild(document.createTextNode(" · "));

    const unlinkBtn = document.createElement("button");
    unlinkBtn.type = "button";
    unlinkBtn.textContent = "Verknüpfung lösen";
    unlinkBtn.addEventListener("click", async () => {
      if (!confirm("Verknüpfung zu diesem Kauf lösen? Der Kauf selbst bleibt bestehen.")) return;
      try {
        const res = await fetch(
          `/api/purchases/${encodeURIComponent(purchase.purchase_id)}/items/${encodeURIComponent(purchase.item_id)}`,
          { method: "DELETE" }
        );
        if (!res.ok && res.status !== 204) {
          const body = await res.json();
          alert("Fehler: " + (body.detail || res.statusText));
          return;
        }
        loadCard();
      } catch (err) {
        alert("Fehler: " + err);
      }
    });
    section.appendChild(unlinkBtn);
    return;
  }

  const forms = document.createElement("div");
  forms.className = "purchase-forms";

  const quickBuy = document.createElement("div");
  quickBuy.innerHTML = `
    <strong>Neuer Kauf für diese Karte</strong><br>
    <input type="date" id="quick-purchase-date" required>
    <input type="text" id="quick-platform" placeholder="Plattform">
    <input type="text" id="quick-seller" placeholder="Verkäufer">
    <input type="number" step="0.01" id="quick-total-price" placeholder="Preis">
    <input type="number" step="0.01" id="quick-shipping" placeholder="Versand">
    <button type="button" id="quick-buy-btn">Speichern</button>
    <span id="quick-buy-status"></span>
  `;
  forms.appendChild(quickBuy);

  const existingBuy = document.createElement("div");
  existingBuy.innerHTML = `
    <strong>Zu bestehendem Kauf hinzufügen</strong><br>
    <input type="text" id="purchase-search" placeholder="Kauf suchen (Plattform, Verkäufer, Notizen)">
    <select id="purchase-results"></select>
    <button type="button" id="link-purchase-btn">Verknüpfen</button>
    <span id="link-purchase-status"></span>
  `;
  forms.appendChild(existingBuy);

  section.appendChild(forms);

  document.getElementById("quick-buy-btn").addEventListener("click", async () => {
    const statusEl = document.getElementById("quick-buy-status");
    const purchaseDate = document.getElementById("quick-purchase-date").value;
    if (!purchaseDate) {
      statusEl.textContent = "Kaufdatum fehlt.";
      statusEl.className = "error";
      return;
    }
    statusEl.textContent = "Speichert …";
    statusEl.className = "";
    try {
      const res = await fetch("/api/purchases", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          purchase_date: purchaseDate,
          platform: document.getElementById("quick-platform").value,
          seller: document.getElementById("quick-seller").value,
          total_price: document.getElementById("quick-total-price").value,
          shipping: document.getElementById("quick-shipping").value,
          items: [{ card_id: cardId }],
        }),
      });
      const body = await res.json();
      if (!res.ok) {
        statusEl.textContent = "Fehler: " + (body.detail || res.statusText);
        statusEl.className = "error";
        return;
      }
      loadCard();
    } catch (err) {
      statusEl.textContent = "Fehler: " + err;
      statusEl.className = "error";
    }
  });

  const purchaseSearch = document.getElementById("purchase-search");
  const purchaseResults = document.getElementById("purchase-results");
  purchaseSearch.addEventListener("input", () => {
    clearTimeout(purchaseSearch._debounce);
    purchaseSearch._debounce = setTimeout(async () => {
      const q = purchaseSearch.value.trim();
      purchaseResults.innerHTML = "";
      if (!q) return;
      try {
        const res = await fetch(`/api/purchases?q=${encodeURIComponent(q)}`);
        const body = await res.json();
        for (const p of body.purchases || []) {
          const option = document.createElement("option");
          option.value = p.id;
          option.textContent = `${p.purchase_date || ""} · ${p.platform || ""} · ${p.seller || ""}`;
          purchaseResults.appendChild(option);
        }
      } catch (err) {
        // Suche schlaegt fehl -> Dropdown bleibt leer.
      }
    }, 300);
  });

  document.getElementById("link-purchase-btn").addEventListener("click", async () => {
    const statusEl = document.getElementById("link-purchase-status");
    const selectedPurchaseId = purchaseResults.value;
    if (!selectedPurchaseId) {
      statusEl.textContent = "Bitte erst einen Kauf suchen und auswählen.";
      statusEl.className = "error";
      return;
    }
    statusEl.textContent = "Verknüpft …";
    statusEl.className = "";
    try {
      const res = await fetch(`/api/purchases/${encodeURIComponent(selectedPurchaseId)}/items`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ card_id: cardId }),
      });
      const body = await res.json();
      if (!res.ok) {
        statusEl.textContent = "Fehler: " + (body.detail || res.statusText);
        statusEl.className = "error";
        return;
      }
      loadCard();
    } catch (err) {
      statusEl.textContent = "Fehler: " + err;
      statusEl.className = "error";
    }
  });
}
</script>
</body>
</html>
