<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>DCardLabs – Käufe</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  h2 { font-size: 1.05rem; margin-top: 1.5rem; }
  .profit-positive { color: #1e4620; }
  .profit-negative { color: #b00020; }
  .page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  .brand-logo { height: 44px; width: auto; border-radius: 6px; }
  .page-nav { margin: 0.75rem 0 1.25rem; }
  .page-nav label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; font-weight: 600; }
  .page-nav select { padding: 0.4rem 0.6rem; font-size: 0.95rem; font-weight: normal; }
  .controls { display: flex; gap: 0.75rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
  input, select { padding: 0.4rem 0.6rem; font-size: 1rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; }
  th[data-key] { cursor: pointer; user-select: none; white-space: nowrap; }
  th .sort-arrow { color: #888; font-size: 0.8em; }
  tr.row { cursor: pointer; }
  tr.row:hover { background: #f7f7f7; }
  .expand-btn { border: none; background: none; cursor: pointer; font-size: 0.9rem; padding: 0 0.4rem; }
  tr.detail-row { cursor: default; }
  tr.detail-row td { background: #fafafa; padding: 0.5rem 1rem; }
  .detail-items { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.9rem; }
  #status-msg { font-style: italic; color: #555; }
  #new-purchase-form { display: none; grid-template-columns: 1fr 1fr; gap: 0.75rem; border: 1px solid #ccc; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
  #new-purchase-form label { display: flex; flex-direction: column; font-size: 0.85rem; font-weight: 600; }
  #new-purchase-form input, #new-purchase-form select { font-weight: normal; margin-top: 0.2rem; }
  #new-purchase-form .actions { grid-column: 1 / -1; }
  .error { color: #b00020; font-weight: 600; }
  .sums-block { font-weight: 700; font-size: 1.05rem; background: #f0f4f8; border: 1px solid #d5dee6; border-radius: 6px; padding: 0.6rem 0.9rem; margin: 0.75rem 0; }
  .pagination { display: flex; gap: 0.75rem; align-items: center; margin-top: 0.75rem; }
  @media print {
    .no-print { display: none !important; }
  }
</style>
</head>
<body>
  <div class="page-header">
    <h1>DCardLabs – Käufe</h1>
    <img class="brand-logo" src="assets/dcardslab-logo.png" alt="DCardsLab">
  </div>
  <nav class="page-nav">
    <label>Seite
      <select id="page-nav-select">
        <option value="" disabled selected>Seite wählen…</option>
        <option value="dashboard.html">Dashboard</option>
        <option value="index.html">Scan</option>
        <option value="cards.html">Karten</option>
        <option value="purchases.html">Käufe</option>
        <option value="ebay.html">eBay</option>
        <option value="inventory.html">Inventar</option>
        <option value="statistics.html">Statistiken</option>
        <option value="settings.html">Einstellungen</option>
      </select>
    </label>
  </nav>

  <div class="controls no-print">
    <input type="text" id="q" placeholder="Suche (Plattform, Verkäufer, Notizen)">
    <label>Von <input type="date" id="date-from"></label>
    <label>Bis <input type="date" id="date-to"></label>
    <button type="button" id="reset-date-filter">Zeitfilter zurücksetzen</button>
    <button type="button" id="toggle-new">+ Neuer Kauf</button>
  </div>
  <p id="sums" class="sums-block"></p>

  <h2>Plattform-Auswertung</h2>
  <table id="platform-ranking-table" style="display: none;">
    <thead><tr><th>Plattform</th><th>Verkäufe</th><th>Ø Gewinn</th><th>Ø Marge</th></tr></thead>
    <tbody id="platform-ranking-body"></tbody>
  </table>
  <p id="platform-ranking-empty"></p>

  <form id="new-purchase-form" class="no-print">
    <label>Kaufdatum <input type="date" name="purchase_date" required></label>
    <label>Plattform
      <select name="platform">
        <option value="">– wählen –</option>
        <option value="eBay">eBay</option>
        <option value="Kleinanzeigen">Kleinanzeigen</option>
        <option value="Vinted">Vinted</option>
        <option value="Sonstiges">Sonstiges</option>
      </select>
    </label>
    <label>Verkäufer <input type="text" name="seller"></label>
    <label>Versand <input type="number" step="0.01" name="shipping"></label>
    <label>Gesamtpreis <input type="number" step="0.01" name="total_price"></label>
    <label>Notizen <input type="text" name="notes"></label>
    <div class="actions">
      <button type="submit">Speichern</button>
      <button type="button" id="new-purchase-cancel">Abbrechen</button>
      <span id="new-purchase-status"></span>
    </div>
  </form>

  <p id="status-msg"></p>
  <table id="purchases-table" style="display: none;">
    <thead>
      <tr>
        <th></th>
        <th data-key="purchase_date">Datum <span class="sort-arrow"></span></th>
        <th data-key="platform">Plattform <span class="sort-arrow"></span></th>
        <th data-key="seller">Verkäufer <span class="sort-arrow"></span></th>
        <th data-key="item_count">Karten <span class="sort-arrow"></span></th>
        <th data-key="total_price">Gesamt <span class="sort-arrow"></span></th>
        <th data-key="shipping">Versand <span class="sort-arrow"></span></th>
      </tr>
    </thead>
    <tbody id="purchases-body"></tbody>
  </table>
  <div class="pagination no-print">
    <button type="button" id="prev-page">&larr; Zurück</button>
    <span id="page-info"></span>
    <button type="button" id="next-page">Weiter &rarr;</button>
    <button type="button" id="print-btn">🖨 Drucken</button>
    <button type="button" id="csv-btn">⭳ CSV-Export</button>
  </div>

<script>
// Einheitliches Seiten-Auswahlfeld statt einzelner Links - erlaubt Navigation
// von jeder Seite zu jeder anderen; identisches Snippet auf allen Seiten dupliziert.
(function initPageNav() {
  const nav = document.getElementById("page-nav-select");
  if (!nav) return;
  const current = location.pathname.split("/").pop() || "index.html";
  for (const opt of nav.options) {
    if (opt.value === current) opt.selected = true;
  }
  nav.addEventListener("change", () => {
    if (nav.value) location.href = nav.value;
  });
})();

const PAGE_SIZE = 40;
let currentPage = 0;

const qInput = document.getElementById("q");

// "/" fokussiert das Suchfeld, ausser man tippt bereits in einem Eingabefeld
// (sonst wuerde z.B. "/" in einem Notiz-Feld die Eingabe abbrechen).
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "/" || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const tag = document.activeElement?.tagName;
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
  ev.preventDefault();
  qInput.focus();
  qInput.select();
});
const dateFromInput = document.getElementById("date-from");
const dateToInput = document.getElementById("date-to");
const statusMsg = document.getElementById("status-msg");
const sumsEl = document.getElementById("sums");
const table = document.getElementById("purchases-table");
const body = document.getElementById("purchases-body");
const toggleNewBtn = document.getElementById("toggle-new");
const newForm = document.getElementById("new-purchase-form");

let currentPurchases = [];
// Merkt sich aufgeklappte Kaeufe ueber Re-Renders hinweg (Sortieren, Suchen,
// Seitenwechsel) hinweg - gleiches Set-Pattern wie die Bulk-Auswahl auf
// cards.html/ebay.html. purchaseDetailsCache haelt bereits geladene
// Kauf-Details (inkl. verknuepfter Karten), damit ein erneutes Auf-/Zuklappen
// keinen neuen Request ausloest.
const expandedIds = new Set();
const purchaseDetailsCache = new Map();
// Neuestes Kaufdatum zuerst, wie bisher schon von db.list_purchases()
// serverseitig sortiert (order("purchase_date", desc=True)).
let sortKey = "purchase_date";
let sortAsc = false;

// Einheitliches Datumsformat (DD.MM.YYYY) - manuell statt ueber
// toLocaleDateString("de-DE"), da dessen Default-Ausgabe nicht nullgepolstert
// ist (z.B. "5.1.2026" statt "05.01.2026"). purchase_date ist ein reiner
// Datums-String ("YYYY-MM-DD"), daher per String-Split statt new Date()
// zerlegt, um Zeitzonen-Verschiebungen zu vermeiden.
function formatDate(value) {
  if (!value) return "";
  const [y, m, d] = value.split("-");
  return d && m && y ? `${d}.${m}.${y}` : value;
}

// de-DE liefert Tausenderpunkt + Dezimalkomma (z.B. "1.709,10"), was fuer
// groessere Betraege/Prozentwerte deutlich lesbarer ist als toFixed().
function fmtEuro(value) {
  return value != null && value !== ""
    ? `${Number(value).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €`
    : "";
}

function fmtPercent(value) {
  return value != null
    ? `${Number(value).toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 })} %`
    : "";
}

// Nutzt /api/statistics mit (spiegelt main.py's _rank_platforms(): nur
// verkaufte Karten mit bekannter Einkaufsplattform fliessen ein, gruppiert
// nach Plattform mit Durchschnitts- statt Summenwerten), damit hier keine
// zweite Gewinn-Berechnung noetig ist.
async function loadPlatformRanking() {
  const table = document.getElementById("platform-ranking-table");
  const body = document.getElementById("platform-ranking-body");
  const empty = document.getElementById("platform-ranking-empty");
  try {
    const res = await fetch("/api/statistics");
    const data = await res.json();
    if (!res.ok) {
      empty.textContent = "Fehler: " + (data.detail || res.statusText);
      return;
    }
    const ranking = data.platform_ranking || [];
    body.innerHTML = "";
    if (!ranking.length) {
      table.style.display = "none";
      empty.textContent = "Noch keine verkauften Karten mit erfasster Einkaufsplattform.";
      return;
    }
    table.style.display = "table";
    empty.textContent = "";
    for (const entry of ranking) {
      const tr = document.createElement("tr");
      for (const text of [entry.name, String(entry.count)]) {
        const td = document.createElement("td");
        td.textContent = text;
        tr.appendChild(td);
      }
      const profitTd = document.createElement("td");
      profitTd.textContent = fmtEuro(entry.avg_profit);
      profitTd.className = entry.avg_profit >= 0 ? "profit-positive" : "profit-negative";
      tr.appendChild(profitTd);
      const marginTd = document.createElement("td");
      marginTd.textContent = fmtPercent(entry.avg_margin_pct);
      tr.appendChild(marginTd);
      body.appendChild(tr);
    }
  } catch (err) {
    empty.textContent = "Fehler: " + err;
  }
}

function filteredPurchases() {
  const from = dateFromInput.value;
  const to = dateToInput.value;
  if (!from && !to) return currentPurchases;
  return currentPurchases.filter((p) => {
    if (from && p.purchase_date < from) return false;
    if (to && p.purchase_date > to) return false;
    return true;
  });
}

function sortedPurchases(purchases) {
  if (!sortKey) return purchases;
  return [...purchases].sort((a, b) => {
    const av = a[sortKey] ?? "";
    const bv = b[sortKey] ?? "";
    if (typeof av === "number" && typeof bv === "number") return sortAsc ? av - bv : bv - av;
    return sortAsc
      ? String(av).localeCompare(String(bv), "de")
      : String(bv).localeCompare(String(av), "de");
  });
}

function setSortIndicator() {
  for (const th of document.querySelectorAll("th[data-key]")) {
    const arrow = th.querySelector(".sort-arrow");
    arrow.textContent = th.dataset.key === sortKey ? (sortAsc ? "▲" : "▼") : "";
  }
}

for (const th of document.querySelectorAll("th[data-key]")) {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if (sortKey === key) {
      sortAsc = !sortAsc;
    } else {
      sortKey = key;
      sortAsc = true;
    }
    currentPage = 0;
    renderCurrentView();
  });
}

function renderSums(purchases) {
  const total = purchases.reduce((sum, p) => sum + (Number(p.total_price) || 0) + (Number(p.shipping) || 0), 0);
  sumsEl.textContent = `${purchases.length} Kauf/Käufe im Filter · Summe (inkl. Versand): ${fmtEuro(total)}`;
}

toggleNewBtn.addEventListener("click", () => {
  newForm.style.display = newForm.style.display === "grid" ? "none" : "grid";
});

document.getElementById("new-purchase-cancel").addEventListener("click", () => {
  newForm.reset();
  newForm.style.display = "none";
  document.getElementById("new-purchase-status").textContent = "";
});

async function loadPurchases() {
  const params = new URLSearchParams();
  if (qInput.value.trim()) params.set("q", qInput.value.trim());

  statusMsg.textContent = "Lädt …";
  table.style.display = "none";
  try {
    const res = await fetch("/api/purchases?" + params.toString());
    const data = await res.json();
    if (!res.ok) {
      statusMsg.textContent = "Fehler: " + (data.detail || res.statusText);
      return;
    }
    statusMsg.textContent = `${data.purchases.length} Kauf/Käufe`;
    currentPurchases = data.purchases;
    currentPage = 0;
    renderCurrentView();
  } catch (err) {
    statusMsg.textContent = "Fehler: " + err;
  }
}

for (const input of [dateFromInput, dateToInput]) {
  input.addEventListener("change", () => {
    currentPage = 0;
    renderCurrentView();
  });
}

document.getElementById("reset-date-filter").addEventListener("click", () => {
  dateFromInput.value = "";
  dateToInput.value = "";
  currentPage = 0;
  renderCurrentView();
});

function renderCurrentView() {
  const filtered = sortedPurchases(filteredPurchases());
  renderSums(filtered);
  setSortIndicator();

  const pageCount = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  currentPage = Math.min(currentPage, pageCount - 1);
  const pageItems = filtered.slice(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE);
  document.getElementById("page-info").textContent = `Seite ${currentPage + 1} von ${pageCount} (${filtered.length} Kauf/Käufe, max. ${PAGE_SIZE}/Seite)`;
  document.getElementById("prev-page").disabled = currentPage === 0;
  document.getElementById("next-page").disabled = currentPage >= pageCount - 1;

  render(pageItems, filtered);
}

function render(purchases, allFiltered) {
  body.innerHTML = "";
  table.style.display = purchases.length ? "table" : "none";
  try {
    sessionStorage.setItem("purchaseListIds", JSON.stringify((allFiltered || purchases).map((p) => p.id)));
  } catch (err) {
    // sessionStorage kann in eingeschraenkten Browser-Kontexten werfen -
    // Vor-/Zurueck-Navigation ist dann einfach nicht verfuegbar.
  }
  for (const p of purchases) {
    const tr = document.createElement("tr");
    tr.className = "row";
    tr.addEventListener("click", () => {
      location.href = `purchase.html?id=${encodeURIComponent(p.id)}`;
    });

    const toggleTd = document.createElement("td");
    const toggleBtn = document.createElement("button");
    toggleBtn.type = "button";
    toggleBtn.className = "expand-btn";
    toggleBtn.textContent = expandedIds.has(p.id) ? "▼" : "▶";
    toggleBtn.title = "Verknüpfte Karten anzeigen";
    toggleBtn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      toggleExpand(p.id);
    });
    toggleTd.appendChild(toggleBtn);
    tr.appendChild(toggleTd);

    const cells = [
      formatDate(p.purchase_date), p.platform || "", p.seller || "",
      String(p.item_count ?? 0), fmtEuro(p.total_price), fmtEuro(p.shipping),
    ];
    for (const text of cells) {
      const td = document.createElement("td");
      td.textContent = text;
      tr.appendChild(td);
    }
    body.appendChild(tr);

    if (expandedIds.has(p.id)) {
      body.appendChild(buildDetailRow(p.id));
    }
  }
}

function toggleExpand(purchaseId) {
  if (expandedIds.has(purchaseId)) {
    expandedIds.delete(purchaseId);
  } else {
    expandedIds.add(purchaseId);
  }
  renderCurrentView();
}

function buildDetailRow(purchaseId) {
  const tr = document.createElement("tr");
  tr.className = "detail-row";
  const td = document.createElement("td");
  td.colSpan = 7;
  tr.appendChild(td);

  const cached = purchaseDetailsCache.get(purchaseId);
  if (cached) {
    renderDetailContent(td, cached);
  } else {
    td.textContent = "Lädt …";
    fetch(`/api/purchases/${encodeURIComponent(purchaseId)}`)
      .then((res) => res.json().then((data) => ({ ok: res.ok, data })))
      .then(({ ok, data }) => {
        if (!ok) {
          td.textContent = "Fehler: " + (data.detail || "Laden fehlgeschlagen");
          return;
        }
        purchaseDetailsCache.set(purchaseId, data);
        renderDetailContent(td, data);
      })
      .catch((err) => {
        td.textContent = "Fehler: " + err;
      });
  }
  return tr;
}

function renderDetailContent(td, purchase) {
  td.innerHTML = "";
  const items = purchase.items || [];
  if (!items.length) {
    td.textContent = "Noch keine Karte verknüpft.";
    return;
  }
  const list = document.createElement("div");
  list.className = "detail-items";
  for (const item of items) {
    const row = document.createElement("div");
    const link = document.createElement("a");
    link.href = `card.html?id=${encodeURIComponent(item.card_id)}`;
    link.textContent = item.card?.title || "(ohne Titel)";
    row.appendChild(link);
    row.appendChild(document.createTextNode(` – ${fmtEuro(item.allocated_cost)}`));
    list.appendChild(row);
  }
  td.appendChild(list);
}

newForm.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const fields = Object.fromEntries(new FormData(newForm).entries());
  const statusEl = document.getElementById("new-purchase-status");
  statusEl.textContent = "Speichert …";
  statusEl.className = "";
  try {
    const res = await fetch("/api/purchases", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(fields),
    });
    const responseBody = await res.json();
    if (!res.ok) {
      statusEl.textContent = "Fehler: " + (responseBody.detail || res.statusText);
      statusEl.className = "error";
      return;
    }
    newForm.reset();
    newForm.style.display = "none";
    statusEl.textContent = "";
    loadPurchases();
  } catch (err) {
    statusEl.textContent = "Fehler: " + err;
    statusEl.className = "error";
  }
});

qInput.addEventListener("input", () => {
  clearTimeout(qInput._debounce);
  qInput._debounce = setTimeout(loadPurchases, 300);
});

document.getElementById("prev-page").addEventListener("click", () => {
  currentPage = Math.max(0, currentPage - 1);
  renderCurrentView();
});
document.getElementById("next-page").addEventListener("click", () => {
  currentPage += 1;
  renderCurrentView();
});
document.getElementById("print-btn").addEventListener("click", () => window.print());

// Semikolon als Trennzeichen (deutsches Excel erwartet das per Default bei
// Komma-Dezimalzahlen) + UTF-8-BOM, damit Umlaute nicht als Mojibake landen.
function downloadCsv(filename, headers, rows) {
  const escape = (v) => {
    const s = v == null ? "" : String(v);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [headers, ...rows].map((row) => row.map(escape).join(";"));
  const csv = "\uFEFF" + lines.join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

document.getElementById("csv-btn").addEventListener("click", () => {
  const headers = ["Datum", "Plattform", "Verkäufer", "Karten", "Gesamt", "Versand"];
  const rows = filteredPurchases().map((p) => [
    formatDate(p.purchase_date), p.platform || "", p.seller || "",
    p.item_count ?? 0, p.total_price ?? "", p.shipping ?? "",
  ]);
  downloadCsv("kaeufe.csv", headers, rows);
});

loadPurchases();
loadPlatformRanking();
</script>
</body>
</html>
