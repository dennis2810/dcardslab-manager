<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DCardLabs – Kassenmodus</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="theme-color" content="#ffffff">
<script>
// Vor dem ersten Rendern angewendet (blockierendes Script vor <style>), damit
// eine gespeicherte manuelle Hell/Dunkel-Wahl (siehe Dashboard-Schalter) nicht
// erst kurz im System-Standard aufblitzt, bevor sie greift.
try {
  var _theme = localStorage.getItem("theme");
  if (_theme === "light" || _theme === "dark") document.documentElement.setAttribute("data-theme", _theme);
} catch (err) {}
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
}
</script>
<style>
  :root { color-scheme: light dark; }
  :root[data-theme="dark"] { color-scheme: dark; }
  :root[data-theme="light"] { color-scheme: light; }
  :root { --success-bg: #e6f4ea; --success-fg: #1e4620; --danger-bg: #fbe4e4; --danger-fg: #7a1a1a; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --success-bg: #1c3324; --success-fg: #7fd99a; --danger-bg: #3a1f1f; --danger-fg: #e59a9a; }
  }
  :root[data-theme="dark"] { --success-bg: #1c3324; --success-fg: #7fd99a; --danger-bg: #3a1f1f; --danger-fg: #e59a9a; }
  /* Gleiche Breite wie cards.html - einheitliche Desktop-Breite ueber alle
     Hauptseiten hinweg (Klaerung mit dem Nutzer), im Mobil-Modus greift
     ohnehin die separate @media-Logik unten. */
  body { font-family: system-ui, sans-serif; max-width: 1600px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  h2 { font-size: 1.05rem; }
  .page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  .brand-logo { height: 44px; width: auto; border-radius: 6px; }
  .page-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; margin: 0.75rem 0 1.25rem; }
  .page-nav label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; font-weight: 600; margin: 0; }
  .page-nav select { padding: 0.4rem 0.6rem; font-size: 0.9rem; font-weight: normal; height: 2.3rem; box-sizing: border-box; }
  /* margin: 0 auf Form und Input, sonst kann eine seitenweite generische
     form{}/input{}-Regel (z.B. fuer das Scan-Formular oder Einstellungen-
     Formulare) mit niedrigerer Spezifitaet einen margin-top/-bottom auf
     diese eigentlich unabhaengige Navigations-Suche durchsickern lassen -
     dieselbe Hoehe wie das Seiten-Auswahlfeld allein reicht dafuer nicht,
     weil der zusaetzliche Rand die Box im Flex-Layout nach oben/unten
     verschiebt (Bugreport des Nutzers: Suchfeld nicht auf gleicher Hoehe
     wie das Feld daneben). */
  .nav-search { display: flex; gap: 0.4rem; margin: 0; }
  .nav-search input { padding: 0.4rem 0.6rem; font-size: 0.9rem; width: 12rem; height: 2.3rem; box-sizing: border-box; margin: 0; -webkit-appearance: none; appearance: none; }
  @media (max-width: 480px) {
    .page-nav select, .nav-search input { min-height: 2.75rem; font-size: 1rem; }
  }
  .session-bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.6rem 0.9rem; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 1.25rem; }
  .session-bar .totals { font-weight: 600; }
  .scan-form { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
  .scan-form input { flex: 1; padding: 0.8rem 1rem; font-size: 1.2rem; }
  #status-msg { font-style: italic; color: #555; }
  .error { color: #b00020; font-weight: 600; }
  .match-list { list-style: none; padding: 0; margin: 0 0 1rem; }
  .match-list li { padding: 0.5rem 0; border-bottom: 1px solid #eee; }
  .match-list button { padding: 0.4rem 0.8rem; margin-left: 0.5rem; }
  .sale-card { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
  .sale-card .title { font-weight: 600; font-size: 1.1rem; }
  .sale-card .meta { color: #555; font-size: 0.9rem; margin-bottom: 0.75rem; }
  .sale-form { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-end; }
  .sale-form label { display: flex; flex-direction: column; font-size: 0.85rem; font-weight: 600; }
  .sale-form input, .sale-form select { font-weight: normal; padding: 0.4rem; margin-top: 0.2rem; }
  .sale-form button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; }
  .last-sale { background: var(--success-bg); color: var(--success-fg); border-radius: 6px; padding: 0.6rem 0.9rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .already-sold { background: var(--danger-bg); color: var(--danger-fg); border-radius: 6px; padding: 0.6rem 0.9rem; margin-bottom: 1rem; }
</style>
</head>
<body>
  <div class="page-header">
    <h1>Kassenmodus</h1>
    <img class="brand-logo" src="assets/dcardslab-logo.png" alt="DCardsLab">
  </div>
  <nav class="page-nav">
    <label>Seite
      <select id="page-nav-select">
        <option value="" disabled selected>Seite wählen…</option>
        <option value="search.html">Suche</option>
        <option value="dashboard.html">Dashboard</option>
        <option value="index.html">Scan</option>
        <option value="cards.html">Karten</option>
        <option value="purchases.html">Käufe</option>
        <option value="ebay.html">eBay</option>
        <option value="statistics-sales.html">Alle Verkäufe</option>
        <option value="inventory.html">Inventar</option>
        <option value="inventur.html">Inventur</option>
        <option value="shipping.html">Versand</option>
        <option value="wishlist.html">Wunschliste</option>
        <option value="private-collection.html">Private Sammlung</option>
        <option value="statistics.html">Statistiken</option>
        <option value="kleinunternehmer.html">Kleinunternehmer</option>
        <option value="pos.html">Kassenmodus</option>
        <option value="settings.html">Einstellungen</option>
      </select>
    </label>
    <form class="nav-search" action="search.html" method="get">
      <input type="search" name="q" placeholder="Suche…" aria-label="Globale Suche">
    </form>
  </nav>
  <p class="note">Für Kartenshows/Börsen: SKU scannen (jeder Barcode-/QR-Scanner tippt wie eine Tastatur + Enter)
    oder Titel eintippen, Preis bestätigen, fertig – ohne die volle Kartenverwaltung zu öffnen.</p>

  <div class="session-bar">
    <span class="totals" id="session-totals">0 Verkäufe – 0,00 €</span>
    <button type="button" id="session-reset-btn">Sitzung zurücksetzen</button>
  </div>

  <div class="last-sale" id="last-sale-bar" hidden>
    <span id="last-sale-text"></span>
    <button type="button" id="last-sale-undo-btn">↩ Rückgängig</button>
  </div>

  <form class="scan-form" id="scan-form">
    <input type="text" id="scan-input" placeholder="SKU oder Titel scannen/eingeben…" autofocus autocomplete="off">
    <button type="submit">Suchen</button>
  </form>
  <p id="status-msg"></p>

  <ul class="match-list" id="match-list" hidden></ul>
  <div id="sale-area"></div>

<script>
(function initPageNav() {
  const nav = document.getElementById("page-nav-select");
  if (!nav) return;
  const current = location.pathname.split("/").pop() || "index.html";
  for (const opt of nav.options) {
    if (opt.value === current) opt.selected = true;
  }
  nav.addEventListener("change", () => {
    if (nav.value) location.href = nav.value;
  });
})();

function fmtEuro(v) {
  return v != null ? `${Number(v).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €` : "–";
}

const SESSION_KEY = "pos_session";
let session = { count: 0, total: 0 };
try {
  session = JSON.parse(sessionStorage.getItem(SESSION_KEY)) || session;
} catch (err) {}

function saveSession() {
  try {
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
  } catch (err) {}
}

function renderSessionTotals() {
  document.getElementById("session-totals").textContent = `${session.count} Verkäufe – ${fmtEuro(session.total)}`;
}
renderSessionTotals();

document.getElementById("session-reset-btn").addEventListener("click", () => {
  if (!confirm("Sitzung zurücksetzen? Die Zähler werden auf 0 gesetzt (bereits erfasste Verkäufe bleiben erhalten).")) return;
  session = { count: 0, total: 0 };
  saveSession();
  renderSessionTotals();
});

let lastSale = null;

function renderLastSaleBar() {
  const bar = document.getElementById("last-sale-bar");
  if (!lastSale) {
    bar.hidden = true;
    return;
  }
  bar.hidden = false;
  document.getElementById("last-sale-text").textContent =
    `Zuletzt verkauft: ${lastSale.title} für ${fmtEuro(lastSale.price)}`;
}

document.getElementById("last-sale-undo-btn").addEventListener("click", async () => {
  if (!lastSale) return;
  try {
    const res = await fetch(`/api/manual-sales/${encodeURIComponent(lastSale.saleId)}`, { method: "DELETE" });
    if (!res.ok && res.status !== 204) {
      const body = await res.json().catch(() => ({}));
      alert("Fehler: " + (body.detail || res.statusText));
      return;
    }
    session.count = Math.max(0, session.count - 1);
    session.total -= lastSale.price;
    saveSession();
    renderSessionTotals();
    lastSale = null;
    renderLastSaleBar();
  } catch (err) {
    alert("Fehler: " + err);
  }
});

function renderSaleCard(card) {
  const saleArea = document.getElementById("sale-area");
  saleArea.innerHTML = "";

  const alreadySold = card.ebay_status === "Verkauft" || card.manual_sale_channel;
  if (alreadySold) {
    const p = document.createElement("p");
    p.className = "already-sold";
    p.textContent = `„${card.title}" ist bereits verkauft.`;
    saleArea.appendChild(p);
    return;
  }

  const box = document.createElement("div");
  box.className = "sale-card";
  const title = document.createElement("div");
  title.className = "title";
  title.textContent = card.title || "(ohne Titel)";
  box.appendChild(title);
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = [card.team, card.set_name, card.card_number].filter(Boolean).join(" · ");
  box.appendChild(meta);

  const form = document.createElement("div");
  form.className = "sale-form";
  form.innerHTML = `
    <label>Kanal
      <select id="pos-channel">
        <option value="Kartenshow">Kartenshow</option>
        <option value="Kleinanzeigen">Kleinanzeigen</option>
        <option value="Vinted">Vinted</option>
        <option value="Cardmarket">Cardmarket</option>
        <option value="COMC">COMC</option>
        <option value="Sonstiges">Sonstiges</option>
      </select>
    </label>
    <label>Preis (€) <input type="number" step="0.01" id="pos-price" autofocus></label>
    <button type="button" id="pos-sell-btn">Verkaufen</button>
  `;
  box.appendChild(form);
  saleArea.appendChild(box);

  const priceInput = document.getElementById("pos-price");
  priceInput.focus();

  async function sell() {
    const price = priceInput.value;
    if (!price) {
      priceInput.focus();
      return;
    }
    try {
      const res = await fetch(`/api/cards/${encodeURIComponent(card.id)}/manual-sale`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          channel: document.getElementById("pos-channel").value,
          sale_date: new Date().toISOString().slice(0, 10),
          gross_price: price,
        }),
      });
      const body = await res.json();
      if (!res.ok) {
        alert("Fehler: " + (body.detail || res.statusText));
        return;
      }
      session.count += 1;
      session.total += Number(price);
      saveSession();
      renderSessionTotals();
      lastSale = { saleId: body.id, title: card.title, price: Number(price) };
      renderLastSaleBar();
      saleArea.innerHTML = "";
      document.getElementById("status-msg").textContent = "";
      document.getElementById("match-list").hidden = true;
      const scanInput = document.getElementById("scan-input");
      scanInput.value = "";
      scanInput.focus();
    } catch (err) {
      alert("Fehler: " + err);
    }
  }
  document.getElementById("pos-sell-btn").addEventListener("click", sell);
  priceInput.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { ev.preventDefault(); sell(); }
  });
}

function renderMatchList(cards) {
  const list = document.getElementById("match-list");
  list.innerHTML = "";
  list.hidden = false;
  for (const card of cards) {
    const li = document.createElement("li");
    const label = document.createElement("span");
    label.textContent = [card.title, card.team, card.set_name].filter(Boolean).join(" · ");
    li.appendChild(label);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "Auswählen";
    btn.addEventListener("click", () => {
      list.hidden = true;
      renderSaleCard(card);
    });
    li.appendChild(btn);
    list.appendChild(li);
  }
}

async function runScan(q) {
  const statusEl = document.getElementById("status-msg");
  document.getElementById("match-list").hidden = true;
  document.getElementById("sale-area").innerHTML = "";
  if (!q) return;
  statusEl.textContent = "Suche …";
  statusEl.className = "";
  try {
    const res = await fetch(`/api/cards?q=${encodeURIComponent(q)}`);
    const body = await res.json();
    if (!res.ok) {
      statusEl.textContent = "Fehler: " + (body.detail || res.statusText);
      statusEl.className = "error";
      return;
    }
    const cards = body.cards || [];
    if (!cards.length) {
      statusEl.textContent = `Keine Karte gefunden für „${q}".`;
      return;
    }
    statusEl.textContent = "";
    if (cards.length === 1) {
      renderSaleCard(cards[0]);
    } else {
      statusEl.textContent = `${cards.length} Treffer – bitte auswählen:`;
      renderMatchList(cards);
    }
  } catch (err) {
    statusEl.textContent = "Fehler: " + err;
    statusEl.className = "error";
  }
}

document.getElementById("scan-form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  runScan(document.getElementById("scan-input").value.trim());
});
</script>
</body>
</html>
