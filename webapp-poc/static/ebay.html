<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>DCardLabs – eBay-Angebote</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  .page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  .brand-logo { height: 44px; width: auto; border-radius: 6px; }
  .page-nav { margin: 0.75rem 0 1.25rem; }
  .page-nav label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; font-weight: 600; }
  .page-nav select { padding: 0.4rem 0.6rem; font-size: 0.95rem; font-weight: normal; }
  .sums-block { font-weight: 700; font-size: 1.05rem; background: #f0f4f8; border: 1px solid #d5dee6; border-radius: 6px; padding: 0.6rem 0.9rem; margin: 0.75rem 0; }
  .pagination { display: flex; gap: 0.75rem; align-items: center; margin-top: 0.75rem; }
  @media print {
    .no-print { display: none !important; }
  }
  #oauth-banner { padding: 0.6rem 0.9rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; }
  #oauth-banner.ok { background: #e6f4ea; color: #1e4620; }
  #oauth-banner.warn { background: #fdecea; color: #611a15; }
  .controls { display: flex; gap: 0.75rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
  input, select { padding: 0.4rem 0.6rem; font-size: 1rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
  th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; }
  th[data-key] { cursor: pointer; user-select: none; white-space: nowrap; }
  th .sort-arrow { color: #888; font-size: 0.8em; }
  td.thumb img { width: 48px; height: 64px; object-fit: cover; border-radius: 4px; background: #f0f0f0; }
  tr.row-link { cursor: pointer; }
  tr.row-link:hover { background: #f7f7f7; }
  .status-Entwurf { color: #555; }
  .status-Geplant { color: #7a5c00; font-weight: 600; }
  .status-Veroeffentlicht { color: #1e4620; font-weight: 600; }
  .status-Verkauft { color: #0b3d91; font-weight: 600; }
  .status-Fehler { color: #b00020; font-weight: 600; }
  #status-msg { font-style: italic; color: #555; }
  .actions-bar { display: flex; gap: 0.75rem; align-items: center; margin-top: 1rem; }
  .error { color: #b00020; font-weight: 600; }
  #bulk-results, #sync-status { margin-top: 0.75rem; font-size: 0.9rem; }
  #bulk-results ul { margin: 0.3rem 0 0; padding-left: 1.2rem; }
</style>
</head>
<body>
  <div class="page-header">
    <h1>DCardLabs – eBay-Angebote</h1>
    <img class="brand-logo" src="assets/dcardslab-logo.png" alt="DCardsLab">
  </div>
  <nav class="page-nav no-print">
    <label>Seite
      <select id="page-nav-select">
        <option value="" disabled selected>Seite wählen…</option>
        <option value="dashboard.html">Dashboard</option>
        <option value="index.html">Scan</option>
        <option value="cards.html">Karten</option>
        <option value="purchases.html">Käufe</option>
        <option value="ebay.html">eBay</option>
        <option value="inventory.html">Inventar</option>
        <option value="statistics.html">Statistiken</option>
        <option value="settings.html">Einstellungen</option>
      </select>
    </label>
  </nav>

  <div id="oauth-banner" class="no-print">eBay-Status wird geprüft …</div>

  <div class="controls no-print">
    <input type="text" id="q" placeholder="Suche (Titel, SKU)">
    <select id="status">
      <option value="">Alle Status</option>
      <option value="Entwurf">Entwurf</option>
      <option value="Geplant">Geplant</option>
      <option value="Veroeffentlicht">Veröffentlicht</option>
      <option value="Verkauft">Verkauft</option>
      <option value="Fehler">Fehler</option>
    </select>
    <button type="button" id="sync-sales-btn">Verkäufe synchronisieren</button>
  </div>
  <div class="controls no-print">
    <label>Verkauft von <input type="date" id="sold-from"></label>
    <label>bis <input type="date" id="sold-to"></label>
    <button type="button" id="reset-date-filter">Zeitfilter zurücksetzen</button>
  </div>
  <p id="sync-status"></p>

  <p id="status-msg"></p>
  <p id="sums" class="sums-block"></p>
  <table id="listings-table" style="display: none;">
    <thead>
      <tr>
        <th></th>
        <th></th>
        <th data-key="sku">SKU <span class="sort-arrow"></span></th>
        <th data-key="title">Titel <span class="sort-arrow"></span></th>
        <th data-key="price">Preis <span class="sort-arrow"></span></th>
        <th data-key="status">Status <span class="sort-arrow"></span></th>
        <th data-key="scheduled_at">Geplant für <span class="sort-arrow"></span></th>
        <th data-key="sale_date">Verkauft am <span class="sort-arrow"></span></th>
        <th data-key="sale_price">Verkaufspreis <span class="sort-arrow"></span></th>
        <th data-key="published_at">Zuletzt aktualisiert <span class="sort-arrow"></span></th>
      </tr>
    </thead>
    <tbody id="listings-body"></tbody>
  </table>
  <div class="pagination no-print">
    <button type="button" id="prev-page">&larr; Zurück</button>
    <span id="page-info"></span>
    <button type="button" id="next-page">Weiter &rarr;</button>
    <button type="button" id="print-btn">🖨 Drucken</button>
    <button type="button" id="csv-btn">⭳ CSV-Export</button>
  </div>

  <div class="actions-bar no-print">
    <button type="button" id="publish-selected-btn" disabled>Ausgewählte veröffentlichen</button>
    <label>Preis anpassen um <input type="number" id="price-bulk-percent" step="1" style="width: 4.5rem;" placeholder="-10"> %</label>
    <button type="button" id="price-bulk-btn" disabled>Anwenden</button>
  </div>
  <div id="bulk-results"></div>

<script>
// Einheitliches Seiten-Auswahlfeld statt einzelner Links - erlaubt Navigation
// von jeder Seite zu jeder anderen; identisches Snippet auf allen Seiten dupliziert.
(function initPageNav() {
  const nav = document.getElementById("page-nav-select");
  if (!nav) return;
  const current = location.pathname.split("/").pop() || "index.html";
  for (const opt of nav.options) {
    if (opt.value === current) opt.selected = true;
  }
  nav.addEventListener("change", () => {
    if (nav.value) location.href = nav.value;
  });
})();

const PAGE_SIZE = 40;
let currentPage = 0;

// Einheitliches Datumsformat (DD.MM.YYYY[, HH:MM]) - manuell statt ueber
// toLocaleDateString/toLocaleString("de-DE"), da deren Default-Ausgabe
// Tag/Monat nicht nullgepolstert liefert (z.B. "5.1.2026" statt
// "05.01.2026").
function formatDate(value) {
  if (!value) return "";
  const d = new Date(value);
  if (isNaN(d)) return value;
  return `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}.${d.getFullYear()}`;
}
function formatDateTime(value) {
  if (!value) return "";
  const d = new Date(value);
  if (isNaN(d)) return value;
  const time = d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  return `${formatDate(value)} ${time}`;
}

// Einheitlich immer 2 Nachkommastellen bei Geldbetraegen.
function fmtEuro(value) {
  return value != null && value !== "" ? `${Number(value).toFixed(2)} €` : "";
}

const qInput = document.getElementById("q");
const statusSelect = document.getElementById("status");
const statusMsg = document.getElementById("status-msg");
const table = document.getElementById("listings-table");
const body = document.getElementById("listings-body");
const publishSelectedBtn = document.getElementById("publish-selected-btn");
const priceBulkBtn = document.getElementById("price-bulk-btn");
const priceBulkPercent = document.getElementById("price-bulk-percent");
const bulkResults = document.getElementById("bulk-results");

const STATUS_LABELS = {
  Entwurf: "Entwurf", Geplant: "Geplant", Veroeffentlicht: "Veröffentlicht",
  Verkauft: "Verkauft", Fehler: "Fehler",
};

// Gleicher Schwellwert wie main.py's _sheets_tabs()/Dashboard-Kennzahl
// ("'Geplant' seit ueber X Tagen ohne Veroeffentlichung").
const STALE_GEPLANT_DAYS = 3;

function daysPending(listing) {
  const reference = listing.scheduled_at || listing.created_at;
  if (!reference) return 0;
  const dt = new Date(reference);
  if (isNaN(dt)) return 0;
  return Math.floor((Date.now() - dt.getTime()) / (24 * 60 * 60 * 1000));
}
const SELECTABLE_STATUSES = new Set(["Entwurf", "Fehler"]);

let currentListings = [];
// SKU-ascending by default - the seller's most-used reference number.
let sortKey = "sku";
let sortAsc = true;

function sortedListings() {
  if (!sortKey) return currentListings;
  return [...currentListings].sort((a, b) => {
    const av = a[sortKey] ?? "";
    const bv = b[sortKey] ?? "";
    if (typeof av === "number" && typeof bv === "number") return sortAsc ? av - bv : bv - av;
    return sortAsc
      ? String(av).localeCompare(String(bv), "de")
      : String(bv).localeCompare(String(av), "de");
  });
}

function setSortIndicator(key) {
  for (const th of document.querySelectorAll("th[data-key]")) {
    const arrow = th.querySelector(".sort-arrow");
    arrow.textContent = th.dataset.key === key ? (sortAsc ? "▲" : "▼") : "";
  }
}
setSortIndicator(sortKey);

for (const th of document.querySelectorAll("th[data-key]")) {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if (sortKey === key) {
      sortAsc = !sortAsc;
    } else {
      sortKey = key;
      sortAsc = true;
    }
    setSortIndicator(sortKey);
    currentPage = 0;
    render(sortedListings());
  });
}

async function loadOauthStatus() {
  const banner = document.getElementById("oauth-banner");
  try {
    const res = await fetch("/api/ebay/oauth/status");
    const body = await res.json();
    if (res.ok && body.authorized) {
      banner.className = "ok";
      banner.textContent = `eBay verbunden (${body.environment || "?"})`;
    } else {
      banner.className = "warn";
      banner.textContent = "eBay ist nicht verbunden. OAuth-Flow im eBay-Server starten, bevor Angebote veröffentlicht werden können.";
    }
  } catch (err) {
    banner.className = "warn";
    banner.textContent = "eBay-Status konnte nicht geladen werden: " + err;
  }
}

function updatePublishButtonState() {
  const anySelected = !!body.querySelector("input[type=checkbox]:checked");
  publishSelectedBtn.disabled = !anySelected;
  priceBulkBtn.disabled = !anySelected;
}

async function loadListings() {
  const params = new URLSearchParams();
  if (qInput.value.trim()) params.set("q", qInput.value.trim());
  if (statusSelect.value) params.set("status", statusSelect.value);

  statusMsg.textContent = "Lädt …";
  table.style.display = "none";
  bulkResults.innerHTML = "";
  try {
    const res = await fetch("/api/ebay/listings?" + params.toString());
    const data = await res.json();
    if (!res.ok) {
      statusMsg.textContent = "Fehler: " + (data.detail || res.statusText);
      return;
    }
    statusMsg.textContent = `${data.listings.length} Angebot(e)`;
    currentListings = data.listings;
    currentPage = 0;
    render(sortedListings());
  } catch (err) {
    statusMsg.textContent = "Fehler: " + err;
  }
}

function render(listings) {
  const pageCount = Math.max(1, Math.ceil(listings.length / PAGE_SIZE));
  currentPage = Math.min(currentPage, pageCount - 1);
  const pageItems = listings.slice(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE);
  document.getElementById("page-info").textContent = `Seite ${currentPage + 1} von ${pageCount} (${listings.length} Angebot(e), max. ${PAGE_SIZE}/Seite)`;
  document.getElementById("prev-page").disabled = currentPage === 0;
  document.getElementById("next-page").disabled = currentPage >= pageCount - 1;

  body.innerHTML = "";
  table.style.display = listings.length ? "table" : "none";
  for (const listing of pageItems) {
    const tr = document.createElement("tr");

    const checkboxTd = document.createElement("td");
    if (SELECTABLE_STATUSES.has(listing.status)) {
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.dataset.listingId = listing.id;
      checkbox.addEventListener("click", (ev) => ev.stopPropagation());
      checkbox.addEventListener("change", updatePublishButtonState);
      checkboxTd.appendChild(checkbox);
    }
    tr.appendChild(checkboxTd);

    const thumbTd = document.createElement("td");
    thumbTd.className = "thumb";
    if (listing.card && listing.card.front_image_url) {
      const img = document.createElement("img");
      img.src = listing.card.front_image_url;
      img.alt = "";
      thumbTd.appendChild(img);
    }
    tr.appendChild(thumbTd);

    const skuTd = document.createElement("td");
    skuTd.textContent = listing.sku || "";
    tr.appendChild(skuTd);

    const titleTd = document.createElement("td");
    titleTd.textContent = listing.title || "(ohne Titel)";
    tr.appendChild(titleTd);

    const priceTd = document.createElement("td");
    priceTd.textContent = fmtEuro(listing.price);
    tr.appendChild(priceTd);

    const statusTd = document.createElement("td");
    statusTd.className = "status-" + listing.status;
    statusTd.textContent = STATUS_LABELS[listing.status] || listing.status;
    if (listing.status === "Geplant" && daysPending(listing) > STALE_GEPLANT_DAYS) {
      const warn = document.createElement("span");
      warn.textContent = " ⚠️";
      warn.title = `Seit über ${STALE_GEPLANT_DAYS} Tagen "Geplant", aber nicht veröffentlicht - ggf. haengengebliebenen Scheduling-Job pruefen.`;
      statusTd.appendChild(warn);
    }
    tr.appendChild(statusTd);

    const scheduledTd = document.createElement("td");
    scheduledTd.textContent = formatDateTime(listing.scheduled_at);
    tr.appendChild(scheduledTd);

    const saleDateTd = document.createElement("td");
    saleDateTd.textContent = formatDate(listing.sale_date);
    tr.appendChild(saleDateTd);

    const salePriceTd = document.createElement("td");
    salePriceTd.textContent = fmtEuro(listing.sale_price);
    tr.appendChild(salePriceTd);

    const updatedTd = document.createElement("td");
    updatedTd.textContent = formatDateTime(listing.published_at);
    tr.appendChild(updatedTd);

    tr.classList.add("row-link");
    tr.addEventListener("click", () => {
      location.href = `card.html?id=${encodeURIComponent(listing.card_id)}`;
    });
    body.appendChild(tr);
  }
  updatePublishButtonState();
  renderSums(listings);
}

function renderSums(listings) {
  const priceSum = listings.reduce((sum, l) => sum + (l.price || 0), 0);
  const from = document.getElementById("sold-from").value;
  const to = document.getElementById("sold-to").value;
  const soldInRange = listings.filter((l) => {
    if (l.status !== "Verkauft" || !l.sale_date) return false;
    const day = l.sale_date.slice(0, 10);
    if (from && day < from) return false;
    if (to && day > to) return false;
    return true;
  });
  const revenueSum = soldInRange.reduce((sum, l) => sum + (l.sale_price || 0), 0);
  document.getElementById("sums").textContent =
    `Summe Angebotspreise (sichtbar): ${priceSum.toFixed(2)} € · `
    + `Summe Verkaufserlös${from || to ? " (Zeitraum)" : ""}: ${revenueSum.toFixed(2)} € (${soldInRange.length} Verkäufe)`;
}

document.getElementById("sold-from").addEventListener("change", () => render(sortedListings()));
document.getElementById("sold-to").addEventListener("change", () => render(sortedListings()));
document.getElementById("reset-date-filter").addEventListener("click", () => {
  document.getElementById("sold-from").value = "";
  document.getElementById("sold-to").value = "";
  render(sortedListings());
});

document.getElementById("prev-page").addEventListener("click", () => {
  currentPage = Math.max(0, currentPage - 1);
  render(sortedListings());
});
document.getElementById("next-page").addEventListener("click", () => {
  currentPage += 1;
  render(sortedListings());
});
document.getElementById("print-btn").addEventListener("click", () => window.print());

// Semikolon als Trennzeichen (deutsches Excel erwartet das per Default bei
// Komma-Dezimalzahlen) + UTF-8-BOM, damit Umlaute nicht als Mojibake landen.
function downloadCsv(filename, headers, rows) {
  const escape = (v) => {
    const s = v == null ? "" : String(v);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [headers, ...rows].map((row) => row.map(escape).join(";"));
  const csv = "\uFEFF" + lines.join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

document.getElementById("csv-btn").addEventListener("click", () => {
  const headers = ["SKU", "Titel", "Preis", "Status", "Geplant für", "Verkauft am", "Verkaufspreis", "Zuletzt aktualisiert"];
  const rows = sortedListings().map((l) => [
    l.sku || "", l.title || "", l.price ?? "", STATUS_LABELS[l.status] || l.status || "",
    formatDateTime(l.scheduled_at), formatDate(l.sale_date), l.sale_price ?? "", formatDateTime(l.published_at),
  ]);
  downloadCsv("ebay.csv", headers, rows);
});

publishSelectedBtn.addEventListener("click", async () => {
  const listingIds = Array.from(body.querySelectorAll("input[type=checkbox]:checked"))
    .map((cb) => cb.dataset.listingId);
  if (!listingIds.length) return;

  publishSelectedBtn.disabled = true;
  bulkResults.textContent = "Veröffentlicht …";
  try {
    const res = await fetch("/api/ebay/listings/publish-bulk", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ listing_ids: listingIds }),
    });
    const data = await res.json();
    if (!res.ok) {
      bulkResults.textContent = "Fehler: " + (data.detail || res.statusText);
      bulkResults.className = "error";
      return;
    }
    bulkResults.className = "";
    const list = document.createElement("ul");
    for (const r of data.results) {
      const li = document.createElement("li");
      const ok = r.status !== "Fehler";
      li.textContent = `${ok ? "✓" : "✗"} ${r.listing_id}: ${STATUS_LABELS[r.status] || r.status}` + (r.error ? ` — ${r.error}` : "");
      list.appendChild(li);
    }
    bulkResults.innerHTML = "";
    bulkResults.appendChild(list);
    loadListings();
  } catch (err) {
    bulkResults.textContent = "Fehler: " + err;
    bulkResults.className = "error";
  }
});

priceBulkBtn.addEventListener("click", async () => {
  const listingIds = Array.from(body.querySelectorAll("input[type=checkbox]:checked"))
    .map((cb) => cb.dataset.listingId);
  if (!listingIds.length) return;
  const percent = Number(priceBulkPercent.value);
  if (!percent) {
    bulkResults.textContent = "Bitte einen Prozentwert ungleich 0 eingeben (z. B. -10 für 10 % günstiger).";
    bulkResults.className = "error";
    return;
  }

  priceBulkBtn.disabled = true;
  bulkResults.textContent = "Passe Preise an …";
  bulkResults.className = "";
  try {
    const res = await fetch("/api/ebay/listings/price-bulk", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ listing_ids: listingIds, percent }),
    });
    const data = await res.json();
    if (!res.ok) {
      bulkResults.textContent = "Fehler: " + (data.detail || res.statusText);
      bulkResults.className = "error";
      return;
    }
    const list = document.createElement("ul");
    for (const r of data.results) {
      const li = document.createElement("li");
      const ok = !r.error;
      li.textContent = ok
        ? `✓ ${r.listing_id}: neuer Preis ${fmtEuro(r.price)}`
        : `✗ ${r.listing_id}: ${r.error}`;
      list.appendChild(li);
    }
    bulkResults.innerHTML = "";
    bulkResults.appendChild(list);
    loadListings();
  } catch (err) {
    bulkResults.textContent = "Fehler: " + err;
    bulkResults.className = "error";
  } finally {
    priceBulkBtn.disabled = false;
  }
});

document.getElementById("sync-sales-btn").addEventListener("click", async () => {
  const syncStatus = document.getElementById("sync-status");
  syncStatus.textContent = "Synchronisiert …";
  syncStatus.className = "";
  try {
    const res = await fetch("/api/ebay/sync-sales", { method: "POST" });
    const data = await res.json();
    if (!res.ok) {
      syncStatus.textContent = "Fehler: " + (data.detail || res.statusText);
      syncStatus.className = "error";
      return;
    }
    syncStatus.textContent = `${data.synced} neue/aktualisierte Verkäufe, ${data.skipped} ohne Treffer.`;
    loadListings();
  } catch (err) {
    syncStatus.textContent = "Fehler: " + err;
    syncStatus.className = "error";
  }
});

qInput.addEventListener("input", () => {
  clearTimeout(qInput._debounce);
  qInput._debounce = setTimeout(loadListings, 300);
});
statusSelect.addEventListener("change", loadListings);

loadOauthStatus();
loadListings();
</script>
</body>
</html>
