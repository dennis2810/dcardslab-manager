<script>
// Vor dem ersten Rendern angewendet (blockierendes Script vor <style>), damit
// eine gespeicherte manuelle Hell/Dunkel-Wahl (siehe Dashboard-Schalter) nicht
// erst kurz im System-Standard aufblitzt, bevor sie greift.
try {
  var _theme = localStorage.getItem("theme");
  if (_theme === "light" || _theme === "dark") document.documentElement.setAttribute("data-theme", _theme);
} catch (err) {}
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
}
</script>
<style>

<script>
// Einheitliches Seiten-Auswahlfeld statt einzelner Links - erlaubt Navigation
// von jeder Seite zu jeder anderen; identisches Snippet auf allen Seiten dupliziert.
(function initPageNav() {
  const nav = document.getElementById("page-nav-select");
  if (!nav) return;
  const current = location.pathname.split("/").pop() || "index.html";
  for (const opt of nav.options) {
    if (opt.value === current) opt.selected = true;
  }
  nav.addEventListener("change", () => {
    if (nav.value) location.href = nav.value;
  });
})();

// Kurze, auffaellige Einblendung fuer das Ergebnis einer Aktion (Speichern/
// Loeschen/Bulk) - anders als ein reiner Status-Text neben dem jeweiligen
// Button bleibt sie sichtbar, auch wenn man inzwischen weitergescrollt hat.
function showToast(message, isError) {
  let container = document.getElementById("toast-container");
  if (!container) {
    container = document.createElement("div");
    container.id = "toast-container";
    document.body.appendChild(container);
  }
  const toast = document.createElement("div");
  toast.className = "toast" + (isError ? " toast-error" : "");
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 4000);
}

// Macht eine Tabellenzeile per Tastatur bedienbar - Tab fokussiert sie
// (tabIndex=0), Pfeil hoch/runter wandert zur Nachbarzeile, Enter loest
// dieselbe Aktion wie ein Klick aus (row.click()). Ergaenzt die bereits
// bestehende Maus-Bedienung, ersetzt sie nicht.
function makeRowKeyboardNavigable(row) {
  row.tabIndex = 0;
  row.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") {
      ev.preventDefault();
      row.click();
    } else if (ev.key === "ArrowDown") {
      const next = row.nextElementSibling;
      if (next) {
        ev.preventDefault();
        next.focus();
      }
    } else if (ev.key === "ArrowUp") {
      const prev = row.previousElementSibling;
      if (prev) {
        ev.preventDefault();
        prev.focus();
      }
    }
  });
}

let PAGE_SIZE = 40;
let currentPage = 0;
// Gleicher Schwellwert wie im Dashboard unter "Was jetzt tun?" (dupliziert,
// kein Shared-JS-Modul).
const LONG_LISTED_DAYS = 14;

// Einheitliches Datumsformat (DD.MM.YYYY[, HH:MM]) - manuell statt ueber
// toLocaleDateString/toLocaleString("de-DE"), da deren Default-Ausgabe
// Tag/Monat nicht nullgepolstert liefert (z.B. "5.1.2026" statt
// "05.01.2026").
function formatDate(value) {
  if (!value) return "";
  const d = new Date(value);
  if (isNaN(d)) return value;
  return `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}.${d.getFullYear()}`;
}
function formatDateTime(value) {
  if (!value) return "";
  const d = new Date(value);
  if (isNaN(d)) return value;
  const time = d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  return `${formatDate(value)} ${time}`;
}

// de-DE liefert Tausenderpunkt + Dezimalkomma (z.B. "1.709,10"), was fuer
// groessere Betraege deutlich lesbarer ist als toFixed().
function fmtEuro(value) {
  return value != null && value !== ""
    ? `${Number(value).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €`
    : "";
}

const qInput = document.getElementById("q");

// "/" fokussiert das Suchfeld, ausser man tippt bereits in einem Eingabefeld
// (sonst wuerde z.B. "/" in einem Notiz-Feld die Eingabe abbrechen).
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "/" || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const tag = document.activeElement?.tagName;
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
  ev.preventDefault();
  qInput.focus();
  qInput.select();
});
const statusSelect = document.getElementById("status");
const cardTypeFilterSelect = document.getElementById("card-type-filter");
const statusMsg = document.getElementById("status-msg");
const table = document.getElementById("listings-table");
const body = document.getElementById("listings-body");
const publishSelectedBtn = document.getElementById("publish-selected-btn");
const priceBulkBtn = document.getElementById("price-bulk-btn");
const endSelectedBtn = document.getElementById("end-selected-btn");
const relistSelectedBtn = document.getElementById("relist-selected-btn");
const priceBulkPercent = document.getElementById("price-bulk-percent");
const bulkResults = document.getElementById("bulk-results");
const bulkActionsBar = document.getElementById("bulk-actions");
const bulkCountEl = document.getElementById("bulk-count");
const selectAllCheckbox = document.getElementById("select-all-checkbox");

const STATUS_LABELS = {
  Entwurf: "Entwurf", Geplant: "Geplant", Veroeffentlicht: "Veröffentlicht",
  Verkauft: "Verkauft", Fehler: "Fehler", Beendet: "Beendet",
};

// Gleicher Schwellwert wie main.py's _sheets_tabs()/Dashboard-Kennzahl
// ("'Geplant' seit ueber X Tagen ohne Veroeffentlichung").
const STALE_GEPLANT_DAYS = 3;

function daysPending(listing) {
  const reference = listing.scheduled_at || listing.created_at;
  if (!reference) return 0;
  const dt = new Date(reference);
  if (isNaN(dt)) return 0;
  return Math.floor((Date.now() - dt.getTime()) / (24 * 60 * 60 * 1000));
}
// Nur Entwuerfe/fehlgeschlagene Angebote koennen (erneut) veroeffentlicht
// werden - gilt nur fuer den Veroeffentlichen-Button, die Preisanpassung
// funktioniert fuer jeden Status.
const SELECTABLE_STATUSES = new Set(["Entwurf", "Fehler"]);

let currentListings = [];
// Aufrufe je eBay-Angebots-ID (ebay_listing_id -> Zahl), nur nach einem
// Klick auf "Aufrufe laden" befuellt - siehe loadViews() unten. Bleibt
// ueber ein render() hinweg erhalten (nicht Teil von currentListings),
// damit ein Sortieren/Blaettern die schon geladenen Werte nicht verwirft.
let listingViews = {};
// Zuletzt gerenderte Seite (fuer "Alle auswaehlen" - bezieht sich bewusst
// nur auf die aktuell sichtbare Seite, nicht alle gefilterten Angebote
// ueber alle Seiten hinweg). Gleiches Muster wie cards.html.
let currentPageItems = [];
// Massenauswahl ueber Angebots-IDs statt DOM-Checkbox-Status - bleibt so
// beim Blaettern/Neuladen erhalten (anders als vorher, wo ausserhalb der
// aktuellen Seite ausgewaehlte Checkboxen beim naechsten render() verloren
// gingen).
let selectedIds = new Set();
// SKU-ascending by default - the seller's most-used reference number.
let sortKey = "sku";
let sortAsc = true;

// Fuer den "Auf eBay ansehen"-Link je Zeile - von loadOauthStatus() gesetzt,
// gleiches Muster wie card.html's getEbayEnvironment().
let ebayEnvironment = "sandbox";

function ebayListingUrl(listing) {
  const host = ebayEnvironment === "production" ? "ebay.de" : "sandbox.ebay.de";
  return `https://www.${host}/itm/${encodeURIComponent(listing.ebay_listing_id)}`;
}

function filteredListings() {
  if (!cardTypeFilterSelect.value) return currentListings;
  return currentListings.filter((l) => l.listing_type === cardTypeFilterSelect.value);
}

function sortedListings() {
  const source = filteredListings();
  if (!sortKey) return source;
  return [...source].sort((a, b) => {
    const av = a[sortKey] ?? "";
    const bv = b[sortKey] ?? "";
    if (typeof av === "number" && typeof bv === "number") return sortAsc ? av - bv : bv - av;
    return sortAsc
      ? String(av).localeCompare(String(bv), "de")
      : String(bv).localeCompare(String(av), "de");
  });
}

function setSortIndicator(key) {
  for (const th of document.querySelectorAll("th[data-key]")) {
    const arrow = th.querySelector(".sort-arrow");
    arrow.textContent = th.dataset.key === key ? (sortAsc ? "▲" : "▼") : "";
  }
}
setSortIndicator(sortKey);

for (const th of document.querySelectorAll("th[data-key]")) {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if (sortKey === key) {
      sortAsc = !sortAsc;
    } else {
      sortKey = key;
      sortAsc = true;
    }
    setSortIndicator(sortKey);
    currentPage = 0;
    render(sortedListings());
  });
}

async function loadOauthStatus() {
  const banner = document.getElementById("oauth-banner");
  banner.innerHTML = "";
  try {
    const res = await fetch("/api/ebay/oauth/status");
    const body = await res.json();
    ebayEnvironment = body.environment || "sandbox";
    if (res.ok && body.authorized) {
      banner.className = "ok";
      const text = document.createElement("span");
      text.textContent = "eBay verbunden";
      banner.appendChild(text);
      const envSpan = document.createElement("span");
      envSpan.className = "oauth-environment";
      envSpan.textContent = `(${body.environment || "?"})`;
      banner.appendChild(envSpan);
      // Nur bei "production" sinnvoll verlinkbar - das Sandbox-Verkaeufer-
      // Cockpit zeigt keine echten Angebote/Verkaeufe.
      if (body.environment === "production") {
        const link = document.createElement("a");
        link.className = "seller-hub-link";
        link.href = "https://www.ebay.de/sh/lst/active";
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = "eBay Verkäufer-Cockpit ↗";
        banner.appendChild(link);
      }
    } else {
      banner.className = "warn";
      banner.textContent = "eBay ist nicht verbunden. OAuth-Flow im eBay-Server starten, bevor Angebote veröffentlicht werden können.";
    }
  } catch (err) {
    banner.className = "warn";
    banner.textContent = "eBay-Status konnte nicht geladen werden: " + err;
  }
}

function updateBulkBar() {
  bulkActionsBar.hidden = selectedIds.size === 0;
  bulkCountEl.textContent = `${selectedIds.size} Angebot(e) ausgewählt`;
}

selectAllCheckbox.addEventListener("change", () => {

    if (selectAllCheckbox.checked) selectedIds.add(listing.id);
    else selectedIds.delete(listing.id);
  }
  updateBulkBar();
  render(sortedListings());
});

document.getElementById("bulk-clear-selection").addEventListener("click", () => {
  selectedIds.clear();

});

async function loadListings() {
  const params = new URLSearchParams();
  if (qInput.value.trim()) params.set("q", qInput.value.trim());
  if (statusSelect.value) params.set("status", statusSelect.value);

  statusMsg.textContent = "Lädt …";
  table.style.display = "none";
  bulkResults.innerHTML = "";
  try {
    const res = await fetch("/api/ebay/listings?" + params.toString());
    const data = await res.json();
    if (!res.ok) {
      statusMsg.textContent = "Fehler: " + (data.detail || res.statusText);
      return;
    }
    if (data.listings.length === 0) {
      statusMsg.textContent = params.toString()
        ? "Keine Angebote gefunden – Suche/Filter anpassen."
        : "Noch keine eBay-Angebote – auf der Kartenseite Entwürfe anlegen.";
    } else {
      statusMsg.textContent = `${data.listings.length} Angebot(e)`;
    }
    currentListings = data.listings;
    currentPage = 0;
    selectedIds.clear();
    updateBulkBar();
    render(sortedListings());
  } catch (err) {
    statusMsg.textContent = "Fehler: " + err;
  }
}

// Gleicher, in den Einstellungen konfigurierbarer Schwellwert wie der
// Preis-Alarm auf der Kartenseite (Default 20%, siehe priceAlertThresholdPct)
// - damit man direkt in der Uebersicht sieht, wo der Angebotspreis noch
// angepasst werden sollte, statt jede Karte einzeln oeffnen zu muessen.
let priceAlertThresholdPct = 20;
fetch("/api/app-status").then((r) => r.json()).then((body) => {
  priceAlertThresholdPct = body.price_alert_threshold_pct || 20;
  // Globale, in den Einstellungen konfigurierbare Seitengroesse/Ansicht
  // (Klaerung mit dem Nutzer) - render() erneut aufrufen, falls die
  // Listings bereits vor dieser Antwort geladen wurden (sonst greift der
  // korrekte Wert schon beim ersten render()-Aufruf aus loadListings()).
  PAGE_SIZE = body.page_size || 40;
  document.body.classList.toggle("compact", body.view_density === "compact");
  if (currentListings) render(sortedListings());
}).catch(() => {});

// Frei wählbare Tabellenspalten - gleiches Prinzip wie auf cards.html
// (siehe dort für die ausführliche Begründung): Spalten per CSS-Klasse auf
// der Tabelle aus-/einblenden statt bedingt in render() zu rendern.
const COLUMN_TOGGLES = [
  { key: "price_check", label: "Preis-Check", index: 6 },
  { key: "listing_since", label: "Eingestellt am", index: 8 },
  { key: "scheduled_at", label: "Geplant für", index: 9 },
  { key: "sale_date", label: "Verkauft am", index: 10 },
  { key: "sale_price", label: "Verkaufspreis", index: 11 },
  { key: "published_at", label: "Zuletzt aktualisiert", index: 12 },
  { key: "views", label: "Aufrufe", index: 13 },
];
const COLUMN_VISIBILITY_STORAGE_KEY = "ebay_hidden_columns";
let hiddenColumns = new Set();
try {
  hiddenColumns = new Set(JSON.parse(localStorage.getItem(COLUMN_VISIBILITY_STORAGE_KEY) || "[]"));
} catch (err) {}

function applyColumnVisibility() {
  const listingsTable = document.getElementById("listings-table");
  for (const col of COLUMN_TOGGLES) {
    listingsTable.classList.toggle(`hide-col-${col.index}`, hiddenColumns.has(col.key));
  }
}

function renderColumnTogglePanel() {
  const panel = document.getElementById("column-toggle-panel");
  panel.innerHTML = "";
  for (const col of COLUMN_TOGGLES) {
    const label = document.createElement("label");
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = !hiddenColumns.has(col.key);
    checkbox.addEventListener("change", () => {
      if (checkbox.checked) hiddenColumns.delete(col.key);
      else hiddenColumns.add(col.key);
      try {
        localStorage.setItem(COLUMN_VISIBILITY_STORAGE_KEY, JSON.stringify([...hiddenColumns]));
      } catch (err) {}
      applyColumnVisibility();
    });
    label.appendChild(checkbox);
    label.append(" " + col.label);
    panel.appendChild(label);
  }
}

document.getElementById("column-toggle-btn").addEventListener("click", () => {

});

function priceResearchFlag(listing) {
  if (!listing.price_research_count || listing.price == null) return null;
  const avg = listing.price_research_avg;
  const diffPct = ((Number(listing.price) - avg) / avg) * 100;
  if (Math.abs(diffPct) < priceAlertThresholdPct) {
    return { kind: "ok", symbol: "✅", title: `Preis ok (Marktdurchschnitt ${fmtEuro(avg)})` };
  }
  const direction = diffPct > 0 ? "über" : "unter";
  return {
    kind: diffPct > 0 ? "high" : "low",
    symbol: diffPct > 0 ? "🔺" : "🔻",
    title: `${Math.abs(diffPct).toFixed(0)}% ${direction} dem Marktdurchschnitt (${fmtEuro(avg)})`,
  };
}

function render(listings) {
  const pageCount = Math.max(1, Math.ceil(listings.length / PAGE_SIZE));
  currentPage = Math.min(currentPage, pageCount - 1);
  const pageItems = listings.slice(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE);
  currentPageItems = pageItems;
  document.getElementById("page-info").textContent = `Seite ${currentPage + 1} von ${pageCount} (${listings.length} Angebot(e), max. ${PAGE_SIZE}/Seite)`;
  document.getElementById("prev-page").disabled = currentPage === 0;
  document.getElementById("next-page").disabled = currentPage >= pageCount - 1;
  selectAllCheckbox.checked = pageItems.length > 0 && pageItems.every((l) => selectedIds.has(l.id));

  body.innerHTML = "";
  table.style.display = listings.length ? "table" : "none";
  for (const listing of pageItems) {
    const tr = document.createElement("tr");

    const checkboxTd = document.createElement("td");
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = selectedIds.has(listing.id);
    checkbox.addEventListener("click", (ev) => ev.stopPropagation());
    checkbox.addEventListener("change", () => {
      if (checkbox.checked) selectedIds.add(listing.id);
      else selectedIds.delete(listing.id);
      selectAllCheckbox.checked = pageItems.length > 0 && pageItems.every((l) => selectedIds.has(l.id));
      updateBulkBar();
    });
    checkboxTd.appendChild(checkbox);
    tr.appendChild(checkboxTd);

    const thumbTd = document.createElement("td");
    thumbTd.className = "thumb";
    if (listing.card && listing.card.front_image_url) {
      const img = document.createElement("img");
      img.src = listing.card.front_image_url;
      img.alt = "";
      thumbTd.appendChild(img);
    }
    tr.appendChild(thumbTd);

    const skuTd = document.createElement("td");
    skuTd.textContent = listing.sku || "";
    tr.appendChild(skuTd);

    const titleTd = document.createElement("td");
    titleTd.textContent = listing.title || "(ohne Titel)";
    tr.appendChild(titleTd);

    const priceTd = document.createElement("td");
    priceTd.textContent = fmtEuro(listing.price);
    tr.appendChild(priceTd);

    const priceFlagTd = document.createElement("td");
    const flag = priceResearchFlag(listing);
    if (flag) {
      const flagSpan = document.createElement("span");
      flagSpan.className = "price-flag price-flag-" + flag.kind;
      flagSpan.textContent = flag.symbol;
      flagSpan.title = flag.title;
      priceFlagTd.appendChild(flagSpan);
    }
    tr.appendChild(priceFlagTd);

    const statusTd = document.createElement("td");
    statusTd.className = "status-" + listing.status;
    statusTd.textContent = STATUS_LABELS[listing.status] || listing.status;
    if (listing.status === "Geplant" && daysPending(listing) > STALE_GEPLANT_DAYS) {
      const warn = document.createElement("span");
      warn.textContent = " ⚠️";
      warn.title = `Seit über ${STALE_GEPLANT_DAYS} Tagen "Geplant", aber nicht veröffentlicht - ggf. haengengebliebenen Scheduling-Job pruefen.`;
      statusTd.appendChild(warn);
    }
    if (listing.manual_sale_channel && (listing.status === "Veroeffentlicht" || listing.status === "Geplant")) {
      const warn = document.createElement("span");
      warn.className = "manual-sale-warning";
      warn.textContent = " ⚠️";
      warn.title = `Karte wurde bereits anderweitig verkauft (${listing.manual_sale_channel}) - Angebot sollte beendet werden.`;
      statusTd.appendChild(warn);
    }
    if (listing.private_collection && (listing.status === "Veroeffentlicht" || listing.status === "Geplant")) {
      const warn = document.createElement("span");
      warn.className = "manual-sale-warning";
      warn.textContent = " ⚠️";
      warn.title = "Karte wurde in die private Sammlung überführt (Privatentnahme) - Angebot sollte beendet werden.";
      statusTd.appendChild(warn);
    }
    if (listing.status === "Verkauft" && listing.delivered) {
      const flag = document.createElement("span");
      flag.textContent = " 📦";
      flag.title = "Als zugestellt markiert";
      statusTd.appendChild(flag);
    }
    if (listing.status === "Verkauft" && listing.refunded) {
      const flag = document.createElement("span");
      flag.textContent = " ↩️";
      flag.title = "Als Rückerstattung/Retoure markiert";
      statusTd.appendChild(flag);
    }
    // Importiert (siehe import_ebay_listing() in main.py) - kein
    // ebay_offer_id, da nicht ueber die Inventory API erstellt. Bulk-
    // Aktionen (Veroeffentlichen/Preis/Beenden) lehnt das Backend dafuer mit
    // 409 ab (_is_externally_managed()); der Hinweis hier erklaert vorab,
    // warum eine Massenaktion fuer diese Zeile fehlschlagen wird.
    if (listing.status === "Veroeffentlicht" && !listing.ebay_offer_id) {
      const flag = document.createElement("span");
      flag.textContent = " 📥";
      flag.title = "Importiertes Angebot - wird nicht vom Tool verwaltet (Preisänderungen/Beenden nur direkt auf eBay).";
      statusTd.appendChild(flag);
    }
    // last_auto_relisted_at wird seit main.py's _relist_listing() sowohl vom
    // manuellen "Neu einstellen"-Button als auch von der Automatik gesetzt
    // (Feldname blieb trotzdem, siehe card.html) - bleibt dauerhaft sichtbar,
    // nicht nur fuer ein paar Tage nach dem Neu-Einstellen.
    if (listing.last_auto_relisted_at) {
      const flag = document.createElement("span");
      flag.textContent = " 🔄";
      flag.title = `Neu eingestellt am ${formatDateTime(listing.last_auto_relisted_at)}`;
      statusTd.appendChild(flag);
    }
    tr.appendChild(statusTd);

    // listing_since ist anders als published_at NICHT bei jeder Bearbeitung
    // neu gesetzt, sondern nur bei Erstveroeffentlichung/Neu-Einstellen
    // (siehe main.py's _publish_listing()) - zeigt "seit wann laeuft
    // GENAU DIESES eBay-Listing", card.html hat dieselbe Anzeige.
    const listingSinceTd = document.createElement("td");
    if (listing.listing_since) {
      const days = Math.floor((Date.now() - new Date(listing.listing_since).getTime()) / (24 * 60 * 60 * 1000));
      const daysLabel = days <= 0 ? "heute" : days === 1 ? "1 Tag" : `${days} Tage`;
      // Markiert veroeffentlichte Angebote, die laenger als LONG_LISTED_DAYS
      // ohne Verkauf laufen - gleicher Schwellwert wie im Dashboard unter
      // "Was jetzt tun?" (dupliziert, kein Shared-JS-Modul).
      const longListed = listing.status === "Veroeffentlicht" && days > LONG_LISTED_DAYS;
      listingSinceTd.textContent = `${longListed ? "⏳ " : ""}${formatDateTime(listing.listing_since)} (${daysLabel})`;
      if (longListed) {
        listingSinceTd.className = "long-listed";
        listingSinceTd.title = `Seit über ${LONG_LISTED_DAYS} Tagen gelistet, ohne Verkauf.`;
      }
    }
    tr.appendChild(listingSinceTd);

    const scheduledTd = document.createElement("td");
    scheduledTd.textContent = formatDateTime(listing.scheduled_at);
    tr.appendChild(scheduledTd);

    const saleDateTd = document.createElement("td");
    saleDateTd.textContent = formatDate(listing.sale_date);
    tr.appendChild(saleDateTd);

    const salePriceTd = document.createElement("td");
    salePriceTd.textContent = fmtEuro(listing.sale_price);
    tr.appendChild(salePriceTd);

    const updatedTd = document.createElement("td");
    updatedTd.textContent = formatDateTime(listing.published_at);
    tr.appendChild(updatedTd);

    const viewsTd = document.createElement("td");
    viewsTd.className = "views-cell";
    if (listing.ebay_listing_id) {
      viewsTd.dataset.listingId = listing.ebay_listing_id;
      // listingViews (frisch per "Aufrufe laden" in dieser Sitzung geladen)
      // hat Vorrang vor last_known_views (von main.py gespeicherter Wert
      // vom letzten Abruf, ueberlebt einen Seiten-Neuladen) - beides "-",
      // wenn noch nie geladen.
      if (listing.ebay_listing_id in listingViews) {
        viewsTd.textContent = listingViews[listing.ebay_listing_id];
      } else if (listing.last_known_views !== null && listing.last_known_views !== undefined) {
        viewsTd.textContent = listing.last_known_views;
      } else {
        viewsTd.textContent = "–";
      }
    }
    tr.appendChild(viewsTd);

    const ebayLinkTd = document.createElement("td");
    if (listing.ebay_listing_id) {
      const a = document.createElement("a");
      a.href = ebayListingUrl(listing);
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "Ansehen ↗";
      // Sonst loest der Klick auf den Link zusaetzlich die Zeilennavigation
      // zu card.html aus (siehe row-link-Klick-Handler unten).
      a.addEventListener("click", (ev) => ev.stopPropagation());
      ebayLinkTd.appendChild(a);
    }
    tr.appendChild(ebayLinkTd);

    tr.classList.add("row-link");
    tr.addEventListener("click", () => {
      location.href = `card.html?id=${encodeURIComponent(listing.card_id)}`;
    });
    makeRowKeyboardNavigable(tr);
    body.appendChild(tr);
  }
  updateBulkBar();
  renderSums(listings);
}

function renderSums(listings) {
  const priceSum = listings.reduce((sum, l) => sum + (l.price || 0), 0);
  const from = document.getElementById("sold-from").value;
  const to = document.getElementById("sold-to").value;
  const soldInRange = listings.filter((l) => {
    if (l.status !== "Verkauft" || !l.sale_date) return false;
    const day = l.sale_date.slice(0, 10);
    if (from && day < from) return false;
    if (to && day > to) return false;
    return true;
  });
  const revenueSum = soldInRange.reduce((sum, l) => sum + (l.sale_price || 0), 0);
  document.getElementById("sums").textContent =
    `Summe Angebotspreise (sichtbar): ${fmtEuro(priceSum)} · `
    + `Summe Verkaufserlös${from || to ? " (Zeitraum)" : ""}: ${fmtEuro(revenueSum)} (${soldInRange.length} Verkäufe)`;
}

// Semikolon als Trennzeichen (deutsches Excel erwartet das per Default bei
// Komma-Dezimalzahlen) + UTF-8-BOM, damit Umlaute nicht als Mojibake landen.
function downloadCsv(filename, headers, rows) {
  const escape = (v) => {
    const s = v == null ? "" : String(v);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [headers, ...rows].map((row) => row.map(escape).join(";"));
  const csv = "\uFEFF" + lines.join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

document.getElementById("csv-btn").addEventListener("click", () => {
  const headers = ["SKU", "Titel", "Preis", "Status", "Eingestellt am", "Geplant für", "Verkauft am", "Verkaufspreis", "Zuletzt aktualisiert"];
  const rows = sortedListings().map((l) => [
    l.sku || "", l.title || "", l.price ?? "", STATUS_LABELS[l.status] || l.status || "", formatDateTime(l.listing_since),
    formatDateTime(l.scheduled_at), formatDate(l.sale_date), l.sale_price ?? "", formatDateTime(l.published_at),
  ]);
  downloadCsv("ebay.csv", headers, rows);
});

publishSelectedBtn.addEventListener("click", async () => {
  const selected = currentListings.filter((l) => selectedIds.has(l.id));
  const eligible = selected.filter((l) => SELECTABLE_STATUSES.has(l.status));
  const skipped = selected.length - eligible.length;
  if (!eligible.length) {
    bulkResults.textContent = "Keines der ausgewählten Angebote ist ein Entwurf oder fehlgeschlagen - nur solche können veröffentlicht werden.";
    bulkResults.className = "error";
    showToast("Keines der ausgewählten Angebote kann veröffentlicht werden.", true);
    return;
  }
  const listingIds = eligible.map((l) => l.id);

  publishSelectedBtn.disabled = true;
  bulkResults.textContent = "Veröffentlicht …";
  bulkResults.className = "";
  try {
    const res = await fetch("/api/ebay/listings/publish-bulk", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ listing_ids: listingIds }),
    });
    const data = await res.json();
    if (!res.ok) {
      bulkResults.textContent = "Fehler: " + (data.detail || res.statusText);
      bulkResults.className = "error";
      showToast("Fehler: " + (data.detail || res.statusText), true);
      return;
    }
    bulkResults.className = "";
    const list = document.createElement("ul");
    if (skipped) {
      const li = document.createElement("li");
      li.textContent = `${skipped} Angebot(e) übersprungen (weder Entwurf noch fehlgeschlagen).`;
      list.appendChild(li);
    }
    for (const r of data.results) {
      const li = document.createElement("li");
      const ok = r.status !== "Fehler";
      li.textContent = `${ok ? "✓" : "✗"} ${r.listing_id}: ${STATUS_LABELS[r.status] || r.status}` + (r.error ? ` — ${r.error}` : "");
      list.appendChild(li);
    }
    bulkResults.innerHTML = "";
    bulkResults.appendChild(list);
    const okCount = data.results.filter((r) => r.status !== "Fehler").length;
    const failedCount = data.results.length - okCount;
    let toastMsg = `${okCount} Angebot(e) veröffentlicht.`;
    if (skipped) toastMsg += ` ${skipped} übersprungen.`;
    if (failedCount) toastMsg += ` ${failedCount} fehlgeschlagen.`;
    showToast(toastMsg, failedCount > 0 && okCount === 0);
    selectedIds.clear();
    updateBulkBar();
    loadListings();
  } catch (err) {
    bulkResults.textContent = "Fehler: " + err;
    bulkResults.className = "error";
    showToast("Fehler: " + err, true);
  } finally {
    publishSelectedBtn.disabled = false;
  }
});

priceBulkBtn.addEventListener("click", async () => {
  const listingIds = Array.from(selectedIds);
  if (!listingIds.length) return;
  const percent = Number(priceBulkPercent.value);
  if (!percent) {
    bulkResults.textContent = "Bitte einen Prozentwert ungleich 0 eingeben (z. B. -10 für 10 % günstiger).";
    bulkResults.className = "error";
    showToast("Bitte einen Prozentwert ungleich 0 eingeben.", true);
    return;
  }

  priceBulkBtn.disabled = true;
  bulkResults.textContent = "Passe Preise an …";
  bulkResults.className = "";
  try {
    const res = await fetch("/api/ebay/listings/price-bulk", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ listing_ids: listingIds, percent }),
    });
    const data = await res.json();
    if (!res.ok) {
      bulkResults.textContent = "Fehler: " + (data.detail || res.statusText);
      bulkResults.className = "error";
      showToast("Fehler: " + (data.detail || res.statusText), true);
      return;
    }
    const list = document.createElement("ul");
    for (const r of data.results) {
      const li = document.createElement("li");

        : `✗ ${r.listing_id}: ${r.error}`;
      list.appendChild(li);
    }
    bulkResults.innerHTML = "";
    bulkResults.appendChild(list);
    const okCount = data.results.filter((r) => !r.error).length;
    const failedCount = data.results.length - okCount;
    showToast(`${okCount} Preis(e) angepasst.` + (failedCount ? ` ${failedCount} fehlgeschlagen.` : ""), failedCount > 0 && okCount === 0);

// Beenden ruft die echte eBay-API auf und ist danach nicht mehr rueckgaengig
// zu machen (ein beendetes Angebot laesst sich nicht per Klick wieder
// veroeffentlichen) - statt eines confirm()-Dialogs daher eine Gnadenfrist
// mit "Rueckgaengig", die den eigentlichen Request erst danach abschickt.
// Gleiches Prinzip wie purchases.html's verzoegertes Massen-Loeschen.
const END_LISTING_GRACE_SECONDS = 6;
const endSelectedUndoBtn = document.getElementById("end-selected-undo");
let pendingEndListings = null;

endSelectedBtn.addEventListener("click", () => {
  const selected = currentListings.filter((l) => selectedIds.has(l.id));
  const eligible = selected.filter((l) => l.status === "Veroeffentlicht");
  const skipped = selected.length - eligible.length;
  if (!eligible.length) {
    bulkResults.textContent = "Keines der ausgewählten Angebote ist veröffentlicht - nur solche können beendet werden.";
    bulkResults.className = "error";
    showToast("Keines der ausgewählten Angebote kann beendet werden.", true);
    return;
  }
  if (pendingEndListings) return;

  let remaining = END_LISTING_GRACE_SECONDS;
  const updateStatus = () => {
    bulkResults.textContent = `${eligible.length} Angebot(e) werden in ${remaining}s beendet … `;
  };
  bulkResults.className = "";
  updateStatus();
  endSelectedUndoBtn.hidden = false;
  endSelectedBtn.disabled = true;

  const tick = setInterval(() => {
    remaining -= 1;
    if (remaining > 0) updateStatus();
  }, 1000);

  const timeout = setTimeout(() => runEndListings(eligible, skipped), END_LISTING_GRACE_SECONDS * 1000);
  pendingEndListings = { timeout, tick };
});

endSelectedUndoBtn.addEventListener("click", () => {
  if (!pendingEndListings) return;
  clearTimeout(pendingEndListings.timeout);
  clearInterval(pendingEndListings.tick);
  pendingEndListings = null;
  endSelectedUndoBtn.hidden = true;
  endSelectedBtn.disabled = false;
  bulkResults.textContent = "Beenden abgebrochen.";
});

async function runEndListings(eligible, skipped) {
  clearInterval(pendingEndListings.tick);
  pendingEndListings = null;
  endSelectedUndoBtn.hidden = true;
  bulkResults.textContent = "Beende Angebote …";
  try {
    const results = await Promise.all(eligible.map(async (l) => {
      try {
        const res = await fetch(`/api/ebay/listings/${encodeURIComponent(l.id)}/end`, { method: "POST" });
        const data = await res.json();
        if (!res.ok) return { id: l.id, ok: false, error: data.detail || res.statusText };
        return { id: l.id, ok: true };
      } catch (err) {
        return { id: l.id, ok: false, error: String(err) };
      }
    }));
    const list = document.createElement("ul");
    if (skipped) {
      const li = document.createElement("li");
      li.textContent = `${skipped} Angebot(e) übersprungen (nicht veröffentlicht).`;
      list.appendChild(li);
    }
    for (const r of results) {
      const li = document.createElement("li");
      li.textContent = `${r.ok ? "✓" : "✗"} ${r.id}` + (r.error ? ` — ${r.error}` : "");
      list.appendChild(li);
    }
    bulkResults.innerHTML = "";
    bulkResults.appendChild(list);
    const okCount = results.filter((r) => r.ok).length;
    const failedCount = results.length - okCount;
    let toastMsg = `${okCount} Angebot(e) beendet.`;
    if (skipped) toastMsg += ` ${skipped} übersprungen.`;
    if (failedCount) toastMsg += ` ${failedCount} fehlgeschlagen.`;
    showToast(toastMsg, failedCount > 0 && okCount === 0);
    selectedIds.clear();
    updateBulkBar();
    loadListings();
  } catch (err) {
    bulkResults.textContent = "Fehler: " + err;
    bulkResults.className = "error";
    showToast("Fehler: " + err, true);
  } finally {
    endSelectedBtn.disabled = false;
  }
}

// Neu einstellen beendet erst das Angebot bei eBay und veroeffentlicht es
// direkt wieder neu (siehe main.py's _relist_listing()) - genauso wenig
// rueckgaengig zu machen wie das Beenden oben, daher dieselbe Gnadenfrist
// mit "Rueckgaengig" statt eines confirm()-Dialogs.
const RELIST_GRACE_SECONDS = 6;
const relistSelectedUndoBtn = document.getElementById("relist-selected-undo");
let pendingRelistListings = null;

relistSelectedBtn.addEventListener("click", () => {
  const selected = currentListings.filter((l) => selectedIds.has(l.id));
  const eligible = selected.filter((l) => l.status === "Veroeffentlicht" && l.ebay_offer_id);
  const skipped = selected.length - eligible.length;
  if (!eligible.length) {
    bulkResults.textContent = "Keines der ausgewählten Angebote kann neu eingestellt werden "
      + "(nur veröffentlichte, nicht importierte Angebote).";
    bulkResults.className = "error";
    showToast("Keines der ausgewählten Angebote kann neu eingestellt werden.", true);
    return;
  }
  if (pendingRelistListings) return;

  let remaining = RELIST_GRACE_SECONDS;
  const updateStatus = () => {
    bulkResults.textContent = `${eligible.length} Angebot(e) werden in ${remaining}s neu eingestellt … `;
  };
  bulkResults.className = "";
  updateStatus();
  relistSelectedUndoBtn.hidden = false;
  relistSelectedBtn.disabled = true;

  const tick = setInterval(() => {
    remaining -= 1;
    if (remaining > 0) updateStatus();
  }, 1000);

  const timeout = setTimeout(() => runRelistListings(eligible, skipped), RELIST_GRACE_SECONDS * 1000);
  pendingRelistListings = { timeout, tick };
});

relistSelectedUndoBtn.addEventListener("click", () => {
  if (!pendingRelistListings) return;
  clearTimeout(pendingRelistListings.timeout);
  clearInterval(pendingRelistListings.tick);
  pendingRelistListings = null;
  relistSelectedUndoBtn.hidden = true;
  relistSelectedBtn.disabled = false;
  bulkResults.textContent = "Neu einstellen abgebrochen.";
});

async function runRelistListings(eligible, skipped) {
  clearInterval(pendingRelistListings.tick);
  pendingRelistListings = null;
  relistSelectedUndoBtn.hidden = true;
  bulkResults.textContent = "Stelle Angebote neu ein …";
  try {
    const results = await Promise.all(eligible.map(async (l) => {
      try {
        const res = await fetch(`/api/ebay/listings/${encodeURIComponent(l.id)}/relist`, { method: "POST" });
        const data = await res.json();
        if (!res.ok) return { id: l.id, ok: false, error: data.detail || res.statusText };
        return { id: l.id, ok: true };
      } catch (err) {
        return { id: l.id, ok: false, error: String(err) };
      }
    }));
    const list = document.createElement("ul");
    if (skipped) {
      const li = document.createElement("li");
      li.textContent = `${skipped} Angebot(e) übersprungen (nicht veröffentlicht oder importiert).`;
      list.appendChild(li);
    }
    for (const r of results) {
      const li = document.createElement("li");
      li.textContent = `${r.ok ? "✓" : "✗"} ${r.id}` + (r.error ? ` — ${r.error}` : "");
      list.appendChild(li);
    }
    bulkResults.innerHTML = "";
    bulkResults.appendChild(list);
    const okCount = results.filter((r) => r.ok).length;
    const failedCount = results.length - okCount;
    let toastMsg = `${okCount} Angebot(e) neu eingestellt.`;
    if (skipped) toastMsg += ` ${skipped} übersprungen.`;
    if (failedCount) toastMsg += ` ${failedCount} fehlgeschlagen.`;
    showToast(toastMsg, failedCount > 0 && okCount === 0);
    selectedIds.clear();
    updateBulkBar();
    loadListings();
  } catch (err) {
    bulkResults.textContent = "Fehler: " + err;
    bulkResults.className = "error";
    showToast("Fehler: " + err, true);
  } finally {
    relistSelectedBtn.disabled = false;
  }
}

document.getElementById("sync-sales-btn").addEventListener("click", async () => {
  const syncStatus = document.getElementById("sync-status");
  syncStatus.textContent = "Synchronisiert …";
  syncStatus.className = "";
  try {
    const res = await fetch("/api/ebay/sync-sales", { method: "POST" });
    const data = await res.json();
    if (!res.ok) {
      syncStatus.textContent = "Fehler: " + (data.detail || res.statusText);
      syncStatus.className = "error";
      showToast("Fehler: " + (data.detail || res.statusText), true);
      return;
    }
    syncStatus.textContent = `${data.synced} neue/aktualisierte Verkäufe, ${data.skipped} ohne Treffer.`;
    showToast(`${data.synced} neue/aktualisierte Verkäufe, ${data.skipped} ohne Treffer.`);
    loadListings();
  } catch (err) {
    syncStatus.textContent = "Fehler: " + err;
    syncStatus.className = "error";
    showToast("Fehler: " + err, true);
  }
});

// Aufrufe der Sell Analytics API (getTrafficReport) - eigener API-Aufruf
// mit eigenem Tageslimit, deshalb bewusst nicht bei jedem loadListings()
// mitgeladen, sondern nur per Klick fuer die aktuell sichtbare Seite.
// Braucht den zusaetzlichen OAuth-Scope sell.analytics.readonly - ohne ihn
// liefert main.py einen 502 mit der eBay-Fehlermeldung (u. a.
// "insufficient_scope"), siehe README.md, "Web-Push-Benachrichtigungen
// einrichten"-Nachbarabschnitt "Aufrufe/Beobachter einrichten".
document.getElementById("load-views-btn").addEventListener("click", async () => {
  const viewsStatus = document.getElementById("views-status");
  const ids = [...new Set(
    currentPageItems
      .filter((l) => l.ebay_listing_id && (l.status === "Veroeffentlicht" || l.status === "Verkauft"))
      .map((l) => l.ebay_listing_id)
  )];
  if (ids.length === 0) {
    viewsStatus.textContent = "Keine veröffentlichten Angebote auf dieser Seite.";
    viewsStatus.className = "";
    return;
  }
  viewsStatus.textContent = "Lädt …";
  viewsStatus.className = "";
  try {
    const res = await fetch("/api/ebay/listings/views?listing_ids=" + encodeURIComponent(ids.join(",")));
    const data = await res.json();
    if (!res.ok) {
      viewsStatus.textContent = "Fehler: " + (data.detail || res.statusText);
      viewsStatus.className = "error";
      showToast("Fehler: " + (data.detail || res.statusText), true);
      return;
    }
    Object.assign(listingViews, data.views);
    const hitCount = ids.filter((id) => id in data.views).length;
    // eBays Report-API kann fuer aeltere, noch aktive Angebote niedrigere
    // Zahlen liefern als das eBay-eigene Verkaeufer-Cockpit, oder ein
    // Angebot ganz auslassen - eigene API-Einschraenkung, siehe README.md.
    viewsStatus.textContent = hitCount === 0
      ? "Für keines der Angebote auf dieser Seite liegen Aufrufe vor. Hinweis: eBays Report-API lässt ältere, noch aktive Angebote teils aus (siehe README.md) - das eBay-Verkäufer-Cockpit kann trotzdem Besucher zeigen."
      : `Aufrufe für ${hitCount} von ${ids.length} Angebot(en) geladen.` + (hitCount < ids.length ? " (fehlende Angebote: siehe Hinweis zu eBays Report-API in README.md)" : "");
    viewsStatus.className = "";
    render(sortedListings());
  } catch (err) {
    viewsStatus.textContent = "Fehler: " + err;
    viewsStatus.className = "error";
    showToast("Fehler: " + err, true);
  }
});

// Legt aus einer bereits auf eBay laufenden, von Hand erstellten Karteikarte
// (nicht ueber dieses Tool eingestellt) automatisch eine neue Karte mit
// eBay-Angebot an - Fotos werden von eBay heruntergeladen und wie beim Scan
// per Claude Vision erkannt (siehe import_ebay_listing() in main.py). Das
// entstehende Angebot bleibt "importiert" (kein ebay_offer_id, siehe
// Statusspalte oben) und wird bewusst nicht vom Tool verwaltet.
const importBtn = document.getElementById("import-btn");
const importItemIdInput = document.getElementById("import-item-id");
const importStatus = document.getElementById("import-status");

importBtn.addEventListener("click", async () => {
  const itemId = importItemIdInput.value.trim();
  if (!itemId) {
    showToast("Bitte eine eBay-Artikelnummer eingeben.", true);
    return;
  }
  importBtn.disabled = true;
  importStatus.textContent = "Importiert …";
  importStatus.className = "";
  try {
    const formData = new FormData();
    formData.set("item_id", itemId);
    const res = await fetch("/api/ebay/import", { method: "POST", body: formData });
    const data = await res.json();
    if (!res.ok) {
      importStatus.textContent = "Fehler: " + (data.detail || res.statusText);
      importStatus.className = "error";
      showToast("Fehler: " + (data.detail || res.statusText), true);
      return;
    }
    if (data.possible_duplicate) {
      showToast(
        `Angebot importiert, aber möglicherweise bereits vorhanden (Karte #${data.possible_duplicate.card_no ?? "?"}) - bitte prüfen.`,
        true
      );
    } else {
      showToast("eBay-Angebot importiert.");
    }
    window.location.href = `card.html?id=${encodeURIComponent(data.id)}`;
  } catch (err) {
    importStatus.textContent = "Fehler: " + err;
    importStatus.className = "error";
    showToast("Fehler: " + err, true);
  } finally {
    importBtn.disabled = false;
  }
});

qInput.addEventListener("input", () => {
  clearTimeout(qInput._debounce);
  qInput._debounce = setTimeout(loadListings, 300);
});
statusSelect.addEventListener("change", loadListings);
cardTypeFilterSelect.addEventListener("change", () => {
  currentPage = 0;
  render(sortedListings());
});

loadOauthStatus();
loadListings();
