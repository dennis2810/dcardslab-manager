<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>DCardLabs – Wunschliste</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="theme-color" content="#ffffff">
<script>
// Vor dem ersten Rendern angewendet (blockierendes Script vor <style>), damit
// eine gespeicherte manuelle Hell/Dunkel-Wahl (siehe Dashboard-Schalter) nicht
// erst kurz im System-Standard aufblitzt, bevor sie greift.
try {
  var _theme = localStorage.getItem("theme");
  if (_theme === "light" || _theme === "dark") document.documentElement.setAttribute("data-theme", _theme);
} catch (err) {}
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
}
</script>
<style>
  :root {
    color-scheme: light dark;
    --hover-bg: #f7f7f7; --detail-bg: #fafafa;
    --success-bg: #e6f4ea; --success-fg: #1e4620;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --hover-bg: #2a2a2a; --detail-bg: #202020;
      --success-bg: #1c3324; --success-fg: #7fd99a; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --hover-bg: #2a2a2a; --detail-bg: #202020;
    --success-bg: #1c3324; --success-fg: #7fd99a; }
  :root[data-theme="light"] { color-scheme: light; }
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  .page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  .brand-logo { height: 44px; width: auto; border-radius: 6px; }
  .page-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; margin: 0.75rem 0 1.25rem; }
  .page-nav label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; font-weight: 600; }
  .page-nav select { padding: 0.4rem 0.6rem; font-size: 0.95rem; font-weight: normal; }
  .nav-search { display: flex; gap: 0.4rem; }
  .nav-search input { padding: 0.4rem 0.6rem; font-size: 0.9rem; width: 12rem; }
  .controls { display: flex; gap: 0.75rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
  input, select { padding: 0.4rem 0.6rem; font-size: 1rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; }
  tr:hover { background: var(--hover-bg); }
  th[data-key] { cursor: pointer; user-select: none; white-space: nowrap; }
  th .sort-arrow { color: #888; font-size: 0.8em; }
  .expand-btn { border: none; background: none; cursor: pointer; font-size: 0.9rem; padding: 0 0.4rem; }
  tr.detail-row { cursor: default; }
  tr.detail-row td { background: var(--detail-bg); padding: 0.5rem 1rem; }
  .price-check-results { list-style: none; margin: 0.4rem 0 0; padding: 0; display: flex; flex-direction: column; gap: 0.3rem; }
  .price-check-results li { display: flex; gap: 0.5rem; align-items: baseline; }
  .price-sparkline-wrapper { max-width: 320px; margin: 0 0 0.5rem; }
  .price-hit { background: var(--success-bg); color: var(--success-fg); border-radius: 4px; padding: 0.1rem 0.4rem; font-weight: 600; }
  .sourcing-cell { font-size: 0.85rem; white-space: nowrap; }
  .sourcing-cell .note { color: #888; font-style: italic; }
  .pagination { display: flex; gap: 0.75rem; align-items: center; margin-top: 0.75rem; }
  @media print {
    .no-print, button { display: none !important; }
  }
  #status-msg { font-style: italic; color: #555; }
  #item-form { display: none; grid-template-columns: 1fr 1fr; gap: 0.75rem; border: 1px solid #ccc; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
  #item-form label { display: flex; flex-direction: column; font-size: 0.85rem; font-weight: 600; }
  #item-form input { font-weight: normal; margin-top: 0.2rem; }
  #item-form .full-row { grid-column: 1 / -1; }
  #item-form .actions { grid-column: 1 / -1; display: flex; gap: 0.75rem; align-items: center; }
  .error { color: #b00020; font-weight: 600; }
  .empty-state { color: #555; font-style: italic; }
  .table-scroll { overflow-x: auto; }
  #toast-container { position: fixed; bottom: 1rem; right: 1rem; display: flex; flex-direction: column; gap: 0.5rem; z-index: 1000; max-width: min(90vw, 360px); }
  .toast { background: #333; color: #fff; padding: 0.6rem 1rem; border-radius: 6px; font-size: 0.9rem; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); animation: toast-in 0.15s ease-out; }
  .toast-error { background: #b00020; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
  <div class="page-header">
    <h1>DCardLabs – Wunschliste</h1>
    <img class="brand-logo" src="assets/dcardslab-logo.png" alt="DCardsLab">
  </div>
  <nav class="page-nav">
    <label>Seite
      <select id="page-nav-select">
        <option value="" disabled selected>Seite wählen…</option>
        <option value="dashboard.html">Dashboard</option>
        <option value="index.html">Scan</option>
        <option value="cards.html">Karten</option>
        <option value="purchases.html">Käufe</option>
        <option value="ebay.html">eBay</option>
        <option value="statistics-sales.html">Alle Verkäufe</option>
        <option value="inventory.html">Inventar</option>
        <option value="inventur.html">Inventur</option>
        <option value="shipping.html">Versand</option>
        <option value="wishlist.html">Wunschliste</option>
        <option value="private-collection.html">Private Sammlung</option>
        <option value="statistics.html">Statistiken</option>
        <option value="search.html">Suche</option>
        <option value="settings.html">Einstellungen</option>
      </select>
    </label>
    <form class="nav-search" action="search.html" method="get">

  <p class="empty-state">Karten, die (noch) nicht im Besitz sind – bewusst getrennt von der Kartenübersicht, damit
    Bestand und Auswertungen unberührt bleiben.</p>

  <div class="controls no-print">
    <input type="text" id="q" placeholder="Suche (Titel, Team, Set, Notiz)">
    <label><input type="checkbox" id="sourcing-only-filter"> Nur Sourcing-Treffer anzeigen</label>
    <button type="button" id="toggle-form">+ Eintrag hinzufügen</button>
  </div>

  <form id="item-form" class="no-print">
    <input type="hidden" id="item-id">
    <label>Titel <input type="text" id="item-title" required></label>
    <label>Team <input type="text" id="item-team"></label>
    <label>Set <input type="text" id="item-set"></label>
    <label>Wunschpreis <input type="number" id="item-target-price" step="0.01"></label>
    <label class="full-row">Notiz <input type="text" id="item-notes"></label>

      <button type="submit" id="item-form-submit">Hinzufügen</button>
      <button type="button" id="item-form-cancel">Abbrechen</button>
      <span id="item-form-status"></span>
    </div>
  </form>

  <p id="status-msg">Lädt …</p>
  <div class="table-scroll">
    <table id="items-table" style="display: none;">
      <thead>
        <tr>
          <th></th>
          <th data-key="title">Titel <span class="sort-arrow"></span></th>
          <th data-key="team">Team <span class="sort-arrow"></span></th>
          <th data-key="set_name">Set <span class="sort-arrow"></span></th>
          <th data-key="target_price">Wunschpreis <span class="sort-arrow"></span></th>
          <th>Sourcing</th>
          <th>Notiz</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="items-body"></tbody>
    </table>
  </div>
  <p id="items-empty"></p>
  <div class="pagination no-print">
    <button type="button" id="prev-page">&larr; Zurück</button>
    <span id="page-info"></span>
    <button type="button" id="next-page">Weiter &rarr;</button>
    <button type="button" id="print-btn">🖨 Drucken</button>
    <button type="button" id="csv-btn">⭳ CSV-Export</button>
  </div>

<script>
// Einheitliches Seiten-Auswahlfeld statt einzelner Links - erlaubt Navigation
// von jeder Seite zu jeder anderen; identisches Snippet auf allen Seiten dupliziert.
(function initPageNav() {
  const nav = document.getElementById("page-nav-select");
  if (!nav) return;
  const current = location.pathname.split("/").pop() || "index.html";
  for (const opt of nav.options) {
    if (opt.value === current) opt.selected = true;
  }
  nav.addEventListener("change", () => {
    if (nav.value) location.href = nav.value;
  });
})();

// Kurze, auffaellige Einblendung fuer das Ergebnis einer Aktion (Speichern/
// Loeschen) - anders als ein reiner Status-Text neben dem jeweiligen Button
// bleibt sie sichtbar, auch wenn man inzwischen weitergescrollt hat.
function showToast(message, isError) {
  let container = document.getElementById("toast-container");
  if (!container) {
    container = document.createElement("div");
    container.id = "toast-container";
    document.body.appendChild(container);
  }
  const toast = document.createElement("div");
  toast.className = "toast" + (isError ? " toast-error" : "");
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 4000);
}

// de-DE liefert Tausenderpunkt + Dezimalkomma (z.B. "1.709,10"), was fuer
// groessere Betraege deutlich lesbarer ist als toFixed().
function fmtEuro(value) {
  return value != null && value !== ""
    ? `${Number(value).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €`
    : "";
}

function formatDate(value) {
  if (!value) return "";
  const d = new Date(value);
  if (isNaN(d)) return value;
  return `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}.${d.getFullYear()}`;
}

const statusMsg = document.getElementById("status-msg");
const table = document.getElementById("items-table");
const body = document.getElementById("items-body");
const empty = document.getElementById("items-empty");
const qInput = document.getElementById("q");
const pageInfo = document.getElementById("page-info");

const PAGE_SIZE = 40;
let currentPage = 0;
let sortKey = "title";
let sortAsc = true;
let allItems = [];

// Preisprüfung ueber die bestehende eBay-Preisrecherche (aktive Angebote,
// siehe card.html) - bewusst keine eigene Persistenz/Historie wie bei
// Karten, da ein Wunschlisten-Eintrag (noch) keine eigene Karte ist. Ergebnis
// nur pro Sitzung gemerkt (kein Cache über Neuladen hinaus), damit ein
// erneutes Aufklappen nicht sofort veraltete Preise zeigt.
const expandedIds = new Set();
const priceCheckState = new Map();

const form = document.getElementById("item-form");
const toggleFormBtn = document.getElementById("toggle-form");
const cancelBtn = document.getElementById("item-form-cancel");
const submitBtn = document.getElementById("item-form-submit");
const formStatus = document.getElementById("item-form-status");
const idInput = document.getElementById("item-id");
const titleInput = document.getElementById("item-title");
const teamInput = document.getElementById("item-team");
const setInput = document.getElementById("item-set");
const targetPriceInput = document.getElementById("item-target-price");
const notesInput = document.getElementById("item-notes");

function resetForm() {
  form.reset();
  idInput.value = "";
  submitBtn.textContent = "Hinzufügen";
  formStatus.textContent = "";
  formStatus.className = "";
}

toggleFormBtn.addEventListener("click", () => {
  const showing = form.style.display === "grid";
  if (showing) {
    form.style.display = "none";
    resetForm();
  } else {
    resetForm();
    form.style.display = "grid";
    titleInput.focus();
  }
});

cancelBtn.addEventListener("click", () => {
  form.style.display = "none";
  resetForm();
});

function startEdit(item) {
  idInput.value = item.id;
  titleInput.value = item.title || "";
  teamInput.value = item.team || "";
  setInput.value = item.set_name || "";
  targetPriceInput.value = item.target_price ?? "";
  notesInput.value = item.notes || "";
  submitBtn.textContent = "Aktualisieren";
  form.style.display = "grid";
  titleInput.focus();
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  if (!titleInput.value.trim()) {
    formStatus.textContent = "Bitte einen Titel eingeben.";
    formStatus.className = "error";
    return;
  }
  const fields = {
    title: titleInput.value.trim(),
    team: teamInput.value.trim(),
    set_name: setInput.value.trim(),
    target_price: targetPriceInput.value,
    notes: notesInput.value.trim(),
  };
  const itemId = idInput.value;
  formStatus.textContent = "Speichert …";
  formStatus.className = "";
  try {
    const res = await fetch(itemId ? `/api/wishlist/${encodeURIComponent(itemId)}` : "/api/wishlist", {
      method: itemId ? "PATCH" : "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(fields),
    });
    const responseBody = await res.json();
    if (!res.ok) {
      formStatus.textContent = "Fehler: " + (responseBody.detail || res.statusText);
      formStatus.className = "error";
      showToast("Fehler: " + (responseBody.detail || res.statusText), true);
      return;
    }
    showToast(itemId ? "Eintrag aktualisiert." : "Eintrag hinzugefügt.");
    form.style.display = "none";
    resetForm();
    loadItems();
  } catch (err) {
    formStatus.textContent = "Fehler: " + err;
    formStatus.className = "error";
    showToast("Fehler: " + err, true);
  }
});

async function deleteItem(itemId) {
  if (!confirm("Diesen Wunschlisten-Eintrag wirklich löschen?")) return;
  try {
    const res = await fetch(`/api/wishlist/${encodeURIComponent(itemId)}`, { method: "DELETE" });
    if (!res.ok && res.status !== 204) {
      const responseBody = await res.json();
      showToast("Fehler: " + (responseBody.detail || res.statusText), true);
      return;
    }
    showToast("Eintrag gelöscht.");
    loadItems();
  } catch (err) {
    showToast("Fehler: " + err, true);
  }
}

function sortValue(item, key) {
  if (key === "target_price") return item.target_price ?? -Infinity;
  return (item[key] || "").toString().toLowerCase();
}

// Ein "Treffer" ist ein automatisch gefundenes aktives eBay-Angebot (siehe
// ebay_scheduler.run_wishlist_price_check_once()) auf oder unter dem
// eingetragenen Wunschpreis - ohne Wunschpreis zaehlt jeder Fund als
// Treffer, da es dann nichts zu unterschreiten gibt.
function isSourcingHit(item) {
  if (item.last_match_price == null) return false;
  if (item.target_price == null || item.target_price === "") return true;
  return Number(item.last_match_price) <= Number(item.target_price);
}

function filteredItems() {
  if (!document.getElementById("sourcing-only-filter").checked) return allItems;
  return allItems.filter(isSourcingHit);
}

function sortedItems() {
  const rows = filteredItems().slice();
  rows.sort((a, b) => {
    const va = sortValue(a, sortKey);
    const vb = sortValue(b, sortKey);
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });
  return rows;
}

for (const th of document.querySelectorAll("th[data-key]")) {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if (sortKey === key) {
      sortAsc = !sortAsc;
    } else {
      sortKey = key;
      sortAsc = true;
    }
    currentPage = 0;
    render();
  });
}

function toggleExpand(itemId) {
  if (expandedIds.has(itemId)) {
    expandedIds.delete(itemId);
  } else {
    expandedIds.add(itemId);
  }
  render();
}

// Kleines Liniendiagramm ueber die gespeicherten Treffer der automatischen
// Hintergrund-Preispruefung (ebay_scheduler.run_wishlist_price_check_once())
// - gleiche Funktion wie card.html's Preisrecherche-Sparkline, hier 1:1
// dupliziert (kein Shared-JS im Projekt). Braucht mindestens zwei datierte
// Preise fuer eine sinnvolle Linie.
function buildPriceSparkline(entries) {
  const points = (entries || [])
    .map((entry) => ({ date: entry.checked_at, price: Number(entry.price) }))
    .filter((p) => p.date && Number.isFinite(p.price) && p.price > 0)
    .sort((a, b) => a.date.localeCompare(b.date));
  if (points.length < 2) return null;

  const svgNs = "http://www.w3.org/2000/svg";
  const width = 280;
  const height = 60;
  const padding = 8;
  const prices = points.map((p) => p.price);
  const minPrice = Math.min(...prices);
  const maxPrice = Math.max(...prices);
  const range = maxPrice - minPrice || 1;
  const xStep = (width - padding * 2) / (points.length - 1);
  const coords = points.map((p, i) => ({
    x: padding + i * xStep,
    y: height - padding - ((p.price - minPrice) / range) * (height - padding * 2),
    point: p,
  }));

  const svg = document.createElementNS(svgNs, "svg");
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.setAttribute("width", "100%");
  svg.setAttribute("height", height);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "Preisverlauf");

  const polyline = document.createElementNS(svgNs, "polyline");
  polyline.setAttribute("points", coords.map((c) => `${c.x},${c.y}`).join(" "));
  polyline.setAttribute("fill", "none");
  polyline.setAttribute("stroke", "#8ab4f8");
  polyline.setAttribute("stroke-width", "2");
  svg.appendChild(polyline);

  for (const c of coords) {
    const dot = document.createElementNS(svgNs, "circle");
    dot.setAttribute("cx", c.x);
    dot.setAttribute("cy", c.y);
    dot.setAttribute("r", "3");
    dot.setAttribute("fill", "#8ab4f8");
    const title = document.createElementNS(svgNs, "title");
    title.textContent = `${formatDate(c.point.date)} – ${fmtEuro(c.point.price)}`;
    dot.appendChild(title);
    svg.appendChild(dot);
  }
  return svg;
}

async function runPriceCheck(item) {
  const q = [item.title, item.team, item.set_name].filter(Boolean).join(" ").trim();
  priceCheckState.set(item.id, { status: "loading" });
  render();
  try {
    const res = await fetch(`/api/ebay/price-research?q=${encodeURIComponent(q)}`);
    const body = await res.json();
    if (!res.ok) {
      priceCheckState.set(item.id, { status: "error", message: body.detail || res.statusText });
    } else {
      priceCheckState.set(item.id, { status: "done", results: body.results || [] });
    }
  } catch (err) {
    priceCheckState.set(item.id, { status: "error", message: String(err) });
  }
  render();
}

// Zeigt das Ergebnis der automatischen Hintergrund-Preispruefung (siehe
// ebay_scheduler.run_wishlist_price_check_once()) direkt in der Tabelle -
// ohne manuelles Aufklappen/"Neu suchen" wie beim Pfeil-Button links. Das
// ist die eigentliche "Sourcing-Liste": aktiv beobachten und bei Treffer
// sofort kaufen, statt Wunschliste und Preisrecherche getrennt pruefen zu
// muessen.
function buildSourcingCell(item) {
  const frag = document.createDocumentFragment();
  if (item.last_match_price == null) {
    const note = document.createElement("span");
    note.className = "note";
    note.textContent = item.last_price_check_at ? "Kein Treffer" : "Noch nicht geprüft";
    frag.appendChild(note);
    return frag;
  }
  if (isSourcingHit(item)) {
    const badge = document.createElement("span");
    badge.className = "price-hit";
    badge.textContent = "✓ " + fmtEuro(item.last_match_price);
    frag.appendChild(badge);
  } else {
    frag.appendChild(document.createTextNode(fmtEuro(item.last_match_price)));
  }
  if (item.last_match_url) {
    frag.appendChild(document.createTextNode(" "));
    const link = document.createElement("a");
    link.href = item.last_match_url;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = "↗";
    link.title = item.last_match_title || "";
    frag.appendChild(link);
  }
  return frag;
}

function buildDetailRow(item) {
  const tr = document.createElement("tr");
  tr.className = "detail-row";
  const td = document.createElement("td");
  td.colSpan = 8;

  const sparkline = buildPriceSparkline(item.price_history);
  if (sparkline) {
    const wrapper = document.createElement("div");
    wrapper.className = "price-sparkline-wrapper";
    wrapper.appendChild(sparkline);
    td.appendChild(wrapper);
  }

  const state = priceCheckState.get(item.id);
  if (!state || state.status === "loading") {
    td.appendChild(document.createTextNode("Sucht aktive eBay-Angebote …"));
  } else if (state.status === "error") {
    td.appendChild(document.createTextNode("Fehler: " + state.message));
  } else if (!state.results.length) {
    td.appendChild(document.createTextNode("Keine aktiven Angebote gefunden."));
  } else {
    const target = item.target_price != null && item.target_price !== "" ? Number(item.target_price) : null;
    const ul = document.createElement("ul");
    ul.className = "price-check-results";
    for (const result of state.results) {
      const li = document.createElement("li");
      const hit = target != null && result.price != null && result.price <= target;
      if (hit) {
        const badge = document.createElement("span");
        badge.className = "price-hit";
        badge.textContent = "✓ unter Wunschpreis";
        li.appendChild(badge);
      }
      const link = document.createElement("a");
      link.href = result.item_web_url;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = `${result.title} – ${result.price != null ? fmtEuro(result.price) : "?"}`;
      li.appendChild(link);
      ul.appendChild(li);
    }
    td.appendChild(ul);
  }

  const refreshBtn = document.createElement("button");
  refreshBtn.type = "button";
  refreshBtn.textContent = "Neu suchen";
  refreshBtn.style.marginTop = "0.4rem";
  refreshBtn.addEventListener("click", () => runPriceCheck(item));
  td.appendChild(document.createElement("br"));
  td.appendChild(refreshBtn);

  tr.appendChild(td);
  return tr;
}

function render() {
  const sorted = sortedItems();
  const pageCount = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE));
  currentPage = Math.min(currentPage, pageCount - 1);
  const visible = sorted.slice(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE);
  pageInfo.textContent = sorted.length ? `Seite ${currentPage + 1} von ${pageCount} (${sorted.length} Einträge)` : "";
  document.getElementById("prev-page").disabled = currentPage === 0;
  document.getElementById("next-page").disabled = currentPage >= pageCount - 1;

  for (const th of document.querySelectorAll("th[data-key]")) {
    const arrow = th.querySelector(".sort-arrow");
    arrow.textContent = th.dataset.key === sortKey ? (sortAsc ? "▲" : "▼") : "";
  }

  body.innerHTML = "";
  if (!sorted.length) {
    table.style.display = "none";
    if (!allItems.length) {
      empty.textContent = qInput.value.trim()
        ? "Nichts gefunden."
        : "Noch keine Wunschlisten-Einträge – über „+ Eintrag hinzufügen“ eine Karte notieren, die du dir wünschst.";
    } else {
      empty.textContent = document.getElementById("sourcing-only-filter").checked
        ? "Keine Sourcing-Treffer im aktuellen Filter."
        : "Nichts gefunden.";
    }
    return;
  }
  table.style.display = "table";
  empty.textContent = "";
  for (const item of visible) {
    const tr = document.createElement("tr");

    const toggleTd = document.createElement("td");
    const toggleBtn = document.createElement("button");
    toggleBtn.type = "button";
    toggleBtn.className = "expand-btn no-print";
    toggleBtn.textContent = expandedIds.has(item.id) ? "▼" : "▶";
    toggleBtn.title = "Preis prüfen (aktive eBay-Angebote)";
    toggleBtn.addEventListener("click", () => {
      const opening = !expandedIds.has(item.id);
      toggleExpand(item.id);
      if (opening && !priceCheckState.has(item.id)) runPriceCheck(item);
    });
    toggleTd.appendChild(toggleBtn);
    tr.appendChild(toggleTd);

    for (const text of [item.title, item.team || "", item.set_name || "", fmtEuro(item.target_price)]) {
      const td = document.createElement("td");
      td.textContent = text;
      tr.appendChild(td);
    }

    const sourcingTd = document.createElement("td");
    sourcingTd.className = "sourcing-cell";
    sourcingTd.appendChild(buildSourcingCell(item));
    tr.appendChild(sourcingTd);

    const notesTd = document.createElement("td");
    notesTd.textContent = item.notes || "";
    tr.appendChild(notesTd);

    const actionsTd = document.createElement("td");
    const editBtn = document.createElement("button");
    editBtn.type = "button";
    editBtn.textContent = "Bearbeiten";
    editBtn.addEventListener("click", () => startEdit(item));
    actionsTd.appendChild(editBtn);
    const deleteBtn = document.createElement("button");
    deleteBtn.type = "button";
    deleteBtn.textContent = "Löschen";
    deleteBtn.addEventListener("click", () => deleteItem(item.id));
    actionsTd.appendChild(deleteBtn);
    tr.appendChild(actionsTd);
    body.appendChild(tr);

    if (expandedIds.has(item.id)) {
      body.appendChild(buildDetailRow(item));
    }
  }
}

async function loadItems() {
  const q = qInput.value.trim();
  try {
    const res = await fetch("/api/wishlist" + (q ? `?q=${encodeURIComponent(q)}` : ""));
    const responseBody = await res.json();
    if (!res.ok) {
      statusMsg.textContent = "Fehler: " + (responseBody.detail || res.statusText);
      return;
    }
    statusMsg.textContent = "";
    allItems = responseBody.items || [];
    currentPage = 0;
    render();
  } catch (err) {
    statusMsg.textContent = "Fehler: " + err;
  }
}

qInput.addEventListener("input", () => {
  clearTimeout(qInput._debounce);
  qInput._debounce = setTimeout(loadItems, 300);
});

document.getElementById("sourcing-only-filter").addEventListener("change", () => {
  currentPage = 0;
  render();
});

document.getElementById("prev-page").addEventListener("click", () => {
  currentPage = Math.max(0, currentPage - 1);
  render();
});
document.getElementById("next-page").addEventListener("click", () => {
  currentPage += 1;
  render();
});
document.getElementById("print-btn").addEventListener("click", () => window.print());

// Semikolon als Trennzeichen (deutsches Excel erwartet das per Default bei
// Komma-Dezimalzahlen) + UTF-8-BOM, damit Umlaute nicht als Mojibake landen.
function downloadCsv(filename, headers, rows) {
  const escape = (v) => {
    const s = v == null ? "" : String(v);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [headers, ...rows].map((row) => row.map(escape).join(";"));
  const csv = "﻿" + lines.join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

document.getElementById("csv-btn").addEventListener("click", () => {
  const headers = ["Titel", "Team", "Set", "Wunschpreis", "Sourcing-Treffer", "Zuletzt geprüft", "Notiz"];
  const rows = sortedItems().map((item) => [
    item.title || "", item.team || "", item.set_name || "", item.target_price ?? "",
    item.last_match_price ?? "", formatDate(item.last_price_check_at), item.notes || "",
  ]);
  downloadCsv("wunschliste.csv", headers, rows);
});

loadItems();
</script>
