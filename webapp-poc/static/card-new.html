<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>DCardLabs – Neue Karte anlegen</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="theme-color" content="#ffffff">
<script>
// Vor dem ersten Rendern angewendet (blockierendes Script vor <style>), damit
// eine gespeicherte manuelle Hell/Dunkel-Wahl (siehe Dashboard-Schalter) nicht
// erst kurz im System-Standard aufblitzt, bevor sie greift.
try {
  var _theme = localStorage.getItem("theme");
  if (_theme === "light" || _theme === "dark") document.documentElement.setAttribute("data-theme", _theme);
} catch (err) {}
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
}
</script>
<style>
  :root {
    color-scheme: light dark;
    --warn-bg: #fff3cd; --warn-fg: #7a5c00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --warn-bg: #4a3c00; --warn-fg: #ffd866; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --warn-bg: #4a3c00; --warn-fg: #ffd866; }
  :root[data-theme="light"] { color-scheme: light; }
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  .page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  .brand-logo { height: 44px; width: auto; border-radius: 6px; }
  .page-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; margin: 0.75rem 0 1.25rem; }
  .page-nav label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; font-weight: 600; }
  .page-nav select { padding: 0.4rem 0.6rem; font-size: 0.9rem; font-weight: normal; height: 2.3rem; box-sizing: border-box; }
  .nav-search { display: flex; gap: 0.4rem; }
  .nav-search input { padding: 0.4rem 0.6rem; font-size: 0.9rem; width: 12rem; height: 2.3rem; box-sizing: border-box; -webkit-appearance: none; appearance: none; }
  .images { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .side { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 0.5rem; }
  label { font-weight: 600; }
  .preview { display: none; max-width: 100%; max-height: 320px; border: 1px solid #ccc; border-radius: 6px; }
  .rotate-buttons { display: none; gap: 0.5rem; }
  .rotate-buttons button { padding: 0.3rem 0.7rem; font-size: 0.9rem; }
  #recognize-btn { padding: 0.5rem 1rem; font-size: 0.95rem; cursor: pointer; margin-bottom: 1.5rem; }
  #recognize-btn:disabled { opacity: 0.5; cursor: default; }
  form#card-form { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  form#card-form label { display: flex; flex-direction: column; font-size: 0.85rem; font-weight: 600; }
  form#card-form input { font-weight: normal; padding: 0.4rem; margin-top: 0.2rem; }
  form#card-form .checkbox-field { grid-column: 1 / -1; display: flex; flex-direction: row; align-items: center; gap: 0.4rem; }
  form#card-form .checkbox-field input { margin-top: 0; }
  .actions { grid-column: 1 / -1; display: flex; gap: 0.75rem; margin-top: 1rem; }
  button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { font-style: italic; color: #555; grid-column: 1 / -1; }
  .error { color: #b00020; font-weight: 600; }
  .duplicate-warning { font-weight: 600; padding: 0.75rem 1rem; border-radius: 6px; margin-top: 1rem; background: var(--warn-bg); color: var(--warn-fg); }
  .duplicate-warning .actions { display: flex; gap: 0.75rem; margin-top: 0.5rem; }
  [hidden] { display: none !important; }
  #toast-container { position: fixed; bottom: 1rem; right: 1rem; display: flex; flex-direction: column; gap: 0.5rem; z-index: 1000; max-width: min(90vw, 360px); }
  .toast { background: #333; color: #fff; padding: 0.6rem 1rem; border-radius: 6px; font-size: 0.9rem; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); animation: toast-in 0.15s ease-out; }
  .toast-error { background: #b00020; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
  <div class="page-header">
    <h1>Neue Karte anlegen</h1>
    <img class="brand-logo" src="assets/dcardslab-logo.png" alt="DCardsLab">
  </div>
  <nav class="page-nav">
    <label>Seite
      <select id="page-nav-select">
        <option value="" disabled selected>Seite wählen…</option>
        <option value="dashboard.html">Dashboard</option>
        <option value="index.html">Scan</option>
        <option value="cards.html">Karten</option>
        <option value="purchases.html">Käufe</option>
        <option value="ebay.html">eBay</option>
        <option value="statistics-sales.html">Alle Verkäufe</option>
        <option value="inventory.html">Inventar</option>
        <option value="inventur.html">Inventur</option>
        <option value="shipping.html">Versand</option>
        <option value="wishlist.html">Wunschliste</option>
        <option value="private-collection.html">Private Sammlung</option>
        <option value="statistics.html">Statistiken</option>
        <option value="search.html">Suche</option>
        <option value="settings.html">Einstellungen</option>
      </select>
    </label>
    <form class="nav-search" action="search.html" method="get">
      <input type="search" name="q" placeholder="Suche…" aria-label="Globale Suche">
    </form>
  </nav>

  <div class="images">
    <div class="side">
      <label for="front">Vorderseite</label>
      <input type="file" id="front" name="front" accept="image/*" required>
      <img id="front-preview" class="preview" alt="Vorschau Vorderseite">
      <div id="front-rotate" class="rotate-buttons">
        <button type="button" data-side="front" data-dir="left">&#8634; Links drehen</button>
        <button type="button" data-side="front" data-dir="right">&#8635; Rechts drehen</button>
      </div>
    </div>
    <div class="side">
      <label for="back">Rückseite</label>
      <input type="file" id="back" name="back" accept="image/*" required>
      <img id="back-preview" class="preview" alt="Vorschau Rückseite">
      <div id="back-rotate" class="rotate-buttons">
        <button type="button" data-side="back" data-dir="left">&#8634; Links drehen</button>
        <button type="button" data-side="back" data-dir="right">&#8635; Rechts drehen</button>
      </div>
    </div>
  </div>

  <button type="button" id="recognize-btn" disabled>KI erkennen</button>

  <form id="card-form">
    <div id="status"></div>
    <div class="actions">
      <button type="submit" id="save-btn" disabled>Karte speichern</button>
      <button type="button" id="cancel-btn">Abbrechen</button>
    </div>
  </form>

  <div id="duplicate-warning" class="duplicate-warning" hidden></div>

<script>
// Einheitliches Seiten-Auswahlfeld statt einzelner Links - erlaubt Navigation
// von jeder Seite zu jeder anderen; identisches Snippet auf allen Seiten dupliziert.
(function initPageNav() {
  const nav = document.getElementById("page-nav-select");
  if (!nav) return;
  const current = location.pathname.split("/").pop() || "index.html";
  for (const opt of nav.options) {
    if (opt.value === current) opt.selected = true;
  }
  nav.addEventListener("change", () => {
    if (nav.value) location.href = nav.value;
  });
})();

// Kurze, auffaellige Einblendung fuer das Ergebnis einer Aktion (Speichern/
// Loeschen/Bulk) - anders als ein reiner Status-Text neben dem jeweiligen
// Button bleibt sie sichtbar, auch wenn man inzwischen weitergescrollt hat.
function showToast(message, isError) {
  let container = document.getElementById("toast-container");
  if (!container) {
    container = document.createElement("div");
    container.id = "toast-container";
    document.body.appendChild(container);
  }
  const toast = document.createElement("div");
  toast.className = "toast" + (isError ? " toast-error" : "");
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 4000);
}

const FIELDS = [
  ["title", "Titel"], ["category", "Kategorie"], ["theme", "Thema"],
  ["team", "Team"], ["manufacturer", "Hersteller"], ["set_name", "Set"],
  ["season_year", "Saison"], ["card_type", "Typ"], ["variant", "Variante"],
  ["position", "Position"], ["squad_number", "Trikotnummer"],
  ["club_debut_season", "Debütsaison"], ["card_number", "Kartennr."],
  ["serial_number", "Seriennr."], ["print_run", "Auflage"],
];

const form = document.getElementById("card-form");
const statusEl = document.getElementById("status");
const recognizeBtn = document.getElementById("recognize-btn");
const saveBtn = document.getElementById("save-btn");

// Warnt vor Verlassen der Seite, sobald ein Foto gewaehlt oder ein Feld
// getippt wurde - vor dem Abbrechen-Button (der absichtlich verlaesst)
// bzw. nach erfolgreichem Speichern wird die Markierung wieder entfernt,
// damit die eigene, gewollte Navigation nicht selbst geblockt wird.
let formIsDirty = false;
document.addEventListener("input", () => { formIsDirty = true; });
document.addEventListener("change", () => { formIsDirty = true; });
window.addEventListener("beforeunload", (ev) => {
  if (!formIsDirty) return;
  ev.preventDefault();
  ev.returnValue = "";
});

document.getElementById("cancel-btn").addEventListener("click", () => {
  formIsDirty = false;
  location.href = "cards.html";
});

// Holds the blob actually submitted for each side - starts as the file the
// user picked, gets replaced by a rotated re-encoding each time they click
// a rotate button, so the preview and every upload (recognize + save) use
// the same, current image - same pattern as index.html's scan form.
const sideBlobs = { front: null, back: null };

// Build the form fields dynamically so FIELDS stays the single source of
// truth (same field set/labels as card.html's edit form).
for (const [key, label] of FIELDS) {
  const wrapper = document.createElement("label");
  wrapper.textContent = label;
  const input = document.createElement("input");
  input.type = "text";
  input.name = key;
  wrapper.appendChild(input);
  form.insertBefore(wrapper, statusEl);
}

// Inventory fields (not card master data) - collected here so the seller
// doesn't need a second trip through card.html's Inventar section just to
// record where the card physically ended up.
for (const [key, label] of [["location", "Lagerort"], ["notes", "Notiz"]]) {
  const wrapper = document.createElement("label");
  wrapper.textContent = label;
  const input = document.createElement("input");
  input.type = "text";
  input.name = key;
  wrapper.appendChild(input);
  form.insertBefore(wrapper, statusEl);
}

// Direkt beim Anlegen fuer die private Sammlung markierbar (Privatentnahme) -
// zusaetzlich zur nachtraeglichen Ueberfuehrung auf card.html.
const privateCollectionWrapper = document.createElement("label");
privateCollectionWrapper.className = "checkbox-field";
const privateCollectionCheckbox = document.createElement("input");
privateCollectionCheckbox.type = "checkbox";
privateCollectionCheckbox.name = "private_collection";
privateCollectionWrapper.append(privateCollectionCheckbox, " Für die private Sammlung (Privatentnahme)");
form.insertBefore(privateCollectionWrapper, statusEl);

function updatePreview(side) {
  const img = document.getElementById(`${side}-preview`);
  const rotateButtons = document.getElementById(`${side}-rotate`);
  const blob = sideBlobs[side];
  if (!blob) {
    img.style.display = "none";
    rotateButtons.style.display = "none";
    updateButtonsEnabled();
    return;
  }
  if (img.dataset.objectUrl) URL.revokeObjectURL(img.dataset.objectUrl);
  const url = URL.createObjectURL(blob);
  img.dataset.objectUrl = url;
  img.src = url;
  img.style.display = "block";
  rotateButtons.style.display = "flex";
  updateButtonsEnabled();
}

function updateButtonsEnabled() {
  const bothPresent = Boolean(sideBlobs.front && sideBlobs.back);
  recognizeBtn.disabled = !bothPresent;
  saveBtn.disabled = !bothPresent;
}

function rotateBlob(blob, direction) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const objectUrl = URL.createObjectURL(blob);
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = img.height;
      canvas.height = img.width;
      const ctx = canvas.getContext("2d");
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate((direction === "right" ? 90 : -90) * Math.PI / 180);
      ctx.drawImage(img, -img.width / 2, -img.height / 2);
      URL.revokeObjectURL(objectUrl);
      canvas.toBlob((rotated) => {
        if (rotated) resolve(rotated);
        else reject(new Error("Drehen fehlgeschlagen."));
      }, "image/jpeg", 0.92);
    };
    img.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      reject(new Error("Bild konnte nicht geladen werden."));
    };
    img.src = objectUrl;
  });
}

for (const side of ["front", "back"]) {
  document.getElementById(side).addEventListener("change", (ev) => {
    sideBlobs[side] = ev.target.files[0] || null;
    updatePreview(side);
  });
}

document.querySelectorAll(".rotate-buttons button").forEach((button) => {
  button.addEventListener("click", async () => {
    const { side, dir } = button.dataset;
    if (!sideBlobs[side]) return;
    try {
      sideBlobs[side] = await rotateBlob(sideBlobs[side], dir);
      updatePreview(side);
    } catch (err) {
      statusEl.textContent = "Fehler beim Drehen: " + err;
      statusEl.className = "error";
      showToast("Fehler beim Drehen: " + err, true);
    }
  });
});

recognizeBtn.addEventListener("click", async () => {
  if (!sideBlobs.front || !sideBlobs.back) return;
  recognizeBtn.disabled = true;
  statusEl.textContent = "Erkenne …";
  statusEl.className = "";

  const data = new FormData();
  data.append("front", sideBlobs.front, "front.jpg");
  data.append("back", sideBlobs.back, "back.jpg");

  try {
    const res = await fetch("/api/cards/recognize", { method: "POST", body: data });
    const body = await res.json();
    if (!res.ok) {
      statusEl.textContent = "Fehler: " + (body.detail || res.statusText);
      statusEl.className = "error";
      showToast("Fehler: " + (body.detail || res.statusText), true);
      return;
    }
    for (const [key] of FIELDS) {
      if (body[key] !== undefined && body[key] !== null) {
        form.elements[key].value = body[key];
      }
    }
    statusEl.textContent = body.status === "ok" ? "Erkennung abgeschlossen." : (body.status || "Erkennung abgeschlossen.");
    statusEl.className = "";
    showToast("Erkennung abgeschlossen.");
  } catch (err) {
    statusEl.textContent = "Fehler: " + err;
    statusEl.className = "error";
    showToast("Fehler: " + err, true);
  } finally {
    updateButtonsEnabled();
  }
});

// Karte wurde bereits angelegt (siehe main.py's create_card_manual) - die
// Warnung fragt nur noch, ob sie mit der vermuteten Alt-Karte
// zusammengefuehrt werden soll, statt das Anlegen selbst zu blockieren
// (gleiche Semantik wie beim Scannen, siehe index.html's mergeDuplicate()).
function showDuplicateWarning(newCardId, duplicate) {
  const box = document.getElementById("duplicate-warning");
  box.innerHTML = "";
  box.hidden = false;

  const text = document.createElement("p");
  text.textContent = `⚠ Evtl. bereits vorhanden: Karte #${duplicate.card_no ?? "?"} mit gleichem Titel/Set/Kartennummer.`;
  box.appendChild(text);

  const link = document.createElement("a");
  link.href = `card.html?id=${encodeURIComponent(duplicate.id)}`;
  link.target = "_blank";
  link.rel = "noopener";
  link.textContent = "Bestehende Karte ansehen";
  box.appendChild(link);

  const actions = document.createElement("div");
  actions.className = "actions";

  const mergeBtn = document.createElement("button");
  mergeBtn.type = "button";
  mergeBtn.textContent = "Mit bestehender Karte zusammenführen";
  mergeBtn.addEventListener("click", async () => {
    mergeBtn.disabled = true;
    mergeBtn.textContent = "Führe zusammen …";
    try {
      const res = await fetch(`/api/cards/${encodeURIComponent(newCardId)}/merge-into/${encodeURIComponent(duplicate.id)}`, {
        method: "POST",
      });
      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        showToast("Fehler beim Zusammenführen: " + (errBody.detail || res.statusText), true);
        mergeBtn.disabled = false;
        mergeBtn.textContent = "Mit bestehender Karte zusammenführen";
        return;
      }
      window.location.href = `card.html?id=${encodeURIComponent(duplicate.id)}`;
    } catch (err) {
      showToast("Fehler beim Zusammenführen: " + err, true);
      mergeBtn.disabled = false;
      mergeBtn.textContent = "Mit bestehender Karte zusammenführen";
    }
  });
  actions.appendChild(mergeBtn);

  const keepBtn = document.createElement("button");
  keepBtn.type = "button";
  keepBtn.textContent = "Als neue Karte behalten";
  keepBtn.addEventListener("click", () => {
    window.location.href = `card.html?id=${encodeURIComponent(newCardId)}`;
  });
  actions.appendChild(keepBtn);

  box.appendChild(actions);
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  if (!sideBlobs.front || !sideBlobs.back) return;
  saveBtn.disabled = true;
  statusEl.textContent = "Speichert …";
  statusEl.className = "";

  const fields = {};
  for (const [key] of FIELDS) {
    fields[key] = form.elements[key].value;
  }
  fields.private_collection = form.elements.private_collection.checked;

  const data = new FormData();
  data.append("front", sideBlobs.front, "front.jpg");
  data.append("back", sideBlobs.back, "back.jpg");
  data.append("fields", JSON.stringify(fields));
  data.append("location", form.elements.location.value);
  data.append("notes", form.elements.notes.value);

  try {
    const res = await fetch("/api/cards", { method: "POST", body: data });
    const body = await res.json();
    if (!res.ok) {
      statusEl.textContent = "Fehler: " + (body.detail || res.statusText);
      statusEl.className = "error";
      showToast("Fehler: " + (body.detail || res.statusText), true);
      saveBtn.disabled = false;
      return;
    }
    // Karte ist jetzt gespeichert - ab hier keine ungespeicherten Aenderungen
    // mehr, egal ob direkt weitergeleitet wird oder erst die Duplikat-
    // Warnung (mit ihren eigenen Navigationen) dazwischenkommt.
    formIsDirty = false;
    if (body.possible_duplicate) {
      showDuplicateWarning(body.id, body.possible_duplicate);
      return;
    }
    window.location.href = `card.html?id=${encodeURIComponent(body.id)}`;
  } catch (err) {
    statusEl.textContent = "Fehler: " + err;
    statusEl.className = "error";
    showToast("Fehler: " + err, true);
    saveBtn.disabled = false;
  }
});
</script>
</body>
</html>
